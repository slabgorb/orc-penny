# Pennyfarthing Repository Configuration
# This repo is a single orchestrator project using Pennyfarthing as a dependency
version: "1.0"

# No legacy compatibility needed - single repo setup
legacy_compat:
  api_repo: null
  ui_repo: null
  create_symlinks: false

# Repository definitions
repos:
  pennyfarthing-orchestrator:
    path: "."
    type: lib                    # Orchestrator/framework consumer
    language: typescript
    test_command: "npm test"
    build_command: "npm run build"
    lint_command: "npm run lint"
    dependencies: []

# Single repo - no build order needed
build_order:
  - pennyfarthing-orchestrator
