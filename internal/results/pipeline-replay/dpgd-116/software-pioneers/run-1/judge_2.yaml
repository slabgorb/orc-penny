findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Neither TEA, Dev, nor Reviewer flagged the issue of from_file_or_default
    swallowing all error types including parse and permission failures. The security.rs
    tests mention 'error swallowing' but the Reviewer did not call out the specific
    from_file_or_default unwrap_or_default pattern, and Dev implemented config loading
    without distinguishing NotFound from other errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA's security.rs test file includes 'CWE-209 error exposure' as a test\
    \ category. The Reviewer also VERIFIED 'CWE-209 Display sanitization working \u2014\
    \ internal errors not exposed in error.rs:50', confirming the pipeline addressed\
    \ this vulnerability class."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA's siem_client.rs tests explicitly include 'header injection' coverage,\
    \ and security.rs includes 'CRLF header injection' tests. The Reviewer also flagged\
    \ CRLF sanitization behavior at client.rs:26, though noting it replaces rather\
    \ than rejects \u2014 demonstrating awareness of the CWE-113 risk class."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned that 6 dependencies (clap_complete, comfy-table, csv,
    dirs, reqwest, toml) use direct version strings instead of workspace = true. The
    Reviewer did not flag this, TEA did not test for it, and Dev apparently implemented
    direct versions.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flagged ''[HIGH] RawConfig silently ignores unknown
    fields at config.rs:10-16'' and stated ''No #[serde(deny_unknown_fields)] on RawConfig.
    A user who typos api_url as api_urll gets zero feedback.'' This directly matches
    the ground truth finding.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the vacuously true assertion pattern 'assert!(config.server().is_none()
    || ...)' where the first branch always makes the OR pass. The Reviewer did not
    mention vacuous test assertions in config tests.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged a test with zero assertions (let _ = config; only checking
    non-panic). The Reviewer did not call out any specific test as lacking assertions
    on return values.
