  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed from_file_or_default swallowing all errors. TEA's 'silent
    error swallowing' tests target HTTP status codes, not config file I/O errors.
    Config tests cover TOML loading and env overrides but not distinguishing NotFound
    from permission/parse errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: Dev explicitly claims 'CWE-209 safe Display' for CliError, and reviewer
    verifies CWE-209 mitigation as correct. However, the Io(#[error(transparent)])
    variant still forwards full OS error details. Per rule 4 (opposite conclusion),
    the pipeline examined the exact code and concluded it was safe when it is not.
