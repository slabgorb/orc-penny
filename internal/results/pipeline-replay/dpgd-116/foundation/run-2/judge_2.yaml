- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client_integration.rs with 14 tests including 'header injection'
    coverage. Dev implemented sanitize_header_value() stripping CR/LF at client.rs:103-104.
    Reviewer verified CWE-113 mitigation. However, the pipeline addressed the symptom
    (sanitization) rather than root cause (should use TenantId type). Same vulnerability
    class CWE-113 was caught.
