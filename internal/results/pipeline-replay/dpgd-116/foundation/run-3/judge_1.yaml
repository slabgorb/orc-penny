- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA mentions 'Silent error swallowing' in security coverage but only regarding
    exit codes, not config file loading. Dev implemented from_file_or_default with
    unwrap_or_default. Reviewer flagged F3 about unknown fields but not about from_file_or_default
    swallowing parse/permission errors. No phase identified the specific issue of
    catching all error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly lists ''CWE-209: Error display must not expose internal
    server details, paths, or credential info'' in security coverage. Dev implemented
    ''sanitized Display messages'' in error.rs. Reviewer F8 further flags that Debug
    could leak internals. Same vulnerability class identified across all phases.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F10: 'tenant flag uses raw String instead of validated TenantId\
    \ \u2014 cli.rs:33. The Rust rules mandate: Newtypes for IDs: TenantId(String).'\
    \ TEA also covers header injection via tenant ID. Dev implemented CRLF rejection\
    \ but still uses raw String. Same vulnerability class (raw String bypassing type-safe\
    \ tenant isolation) flagged."
