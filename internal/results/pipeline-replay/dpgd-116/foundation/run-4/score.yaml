- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'header injection (newlines/null bytes in tenant/token)'
    in security.rs and siem_client.rs. Dev implemented is_header_safe() checking for
    \n, \r, \0. Same CWE-113 class caught, though the deeper type-safety concern of
    using TenantId instead of raw String was not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer noted toml version mismatch (0.8 vs 0.9) but never flagged that
    6 dependencies use direct version strings instead of workspace = true. The workspace
    dependency pattern issue was not addressed by any phase.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: Reviewer explicitly listed 'Config token field ignored' under VERIFIED
