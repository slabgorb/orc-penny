    Dev implemented from_file but no phase flagged the unwrap_or_default swallowing
    all error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote security.rs with 12 tests covering 'CWE-209 error exposure'.\
    \ Dev implemented ServerErrorDetail opaque wrapper. Reviewer verified CWE-209\
    \ protection. Same vulnerability class (CWE-209 information exposure) addressed,\
    \ though the specific Io(transparent) \u2192 eprintln leak path may not be fully\
    \ covered."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote security.rs tests for 'header injection (newlines/null bytes
    in tenant/token)' and siem_client.rs tests. Dev implemented is_header_safe() checking
    for \n, \r, \0. Same vulnerability class CWE-113 addressed, though the type-safety
    fix (using TenantId instead of raw String) was not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned direct version strings vs workspace = true. The Cargo.toml
    changes show deps added but no reviewer or test flagged the workspace dependency
    convention violation.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged as MEDIUM: 'RawConfig silently ignores unknown fields\
    \ \u2014 config.rs:18' and recommended '#[serde(deny_unknown_fields)]', listed\
    \ as Required Before Approval item #5. This fix would cause the token field issue\
    \ to surface as a parse error rather than being silently ignored."
