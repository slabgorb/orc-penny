findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No test or review comment addresses from_file_or_default swallowing all
    error types. TEA's 'silent error swallowing' tests only check that error variants
    have non-empty Display and non-zero exit codes, not that parse/permission errors
    are distinguished from NotFound.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests for 'CWE-209: Server error display must not\
    \ leak SQL/stack trace details'. Dev implemented 'safe Display impls (no internal\
    \ detail leakage)'. However, the Io(transparent) variant specifically leaking\
    \ OS paths was not flagged \u2014 same vulnerability class was addressed."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection: CRLF in tenant ID and auth token
    must be rejected''. Reviewer flagged ''--tenant accepts raw String, not TenantId
    newtype'' as MEDIUM, noting axiathon-core has TenantId available and the value
    flows unchecked into HTTP headers.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as MEDIUM: ''clap_complete, comfy-table, keyring, dirs,
    csv, and reqwest are all specified directly in the crate Cargo.toml rather than
    as workspace dependencies. This violates the project''s workspace dependency management
    pattern.'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'Reviewer noted token is briefly in memory (LOW) and recommended #[serde(skip)],
    but nobody flagged the core UX/security issue: a user putting token in config
    believes they are authenticated when they are not, with no warning. The deny_unknown_fields
    recommendation was about typos, not the token field specifically (which is a known
    field in RawConfig that gets silently discarded).'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ... always true via first branch). The reviewer mentioned a different test lacking
    assertions but not this specific vacuous OR logic.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged: 'config_file_with_unknown_fields_does_not_panic validates\
    \ non-panic but doesn't assert on the behavior' \u2014 same category of test with\
    \ insufficient/zero assertions on the actual return value."
