- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "TEA mentions 'silent error swallowing' in security tests but only about\
    \ error variants having non-empty display and non-zero exit codes \u2014 not about\
    \ from_file_or_default swallowing parse/permission errors via unwrap_or_default().\
    \ No phase flagged the specific pattern of catching all error types and silently\
    \ returning defaults."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''CWE-209: Server error display must not
    leak SQL/stack trace details'' and Dev implemented ''safe Display impls (no internal
    detail leakage)''. Same vulnerability class (CWE-209 information exposure) was
    identified and tested, though the specific Io(transparent) variant may still leak.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection: CRLF in tenant ID and auth token
    must be rejected.'' Reviewer explicitly flagged ''[MEDIUM] --tenant accepts raw
    String, not TenantId newtype'' and recommended using TenantId from axiathon-core,
    plus flagged CRLF validation belonging at construction time.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] toml version 0.8 vs spec's 0.9; workspace dependency
    violations at Cargo.toml:15-20,25' and listed clap_complete, comfy-table, keyring,
    dirs, csv, reqwest as direct deps that should use workspace declarations.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: Pipeline treated token exclusion from config as CORRECT behavior. TEA
    wrote tests validating 'Token field in config file must be ignored (tokens from
    keychain only)'. Reviewer verified token handling but focused on memory exposure,
    not on the silent-ignore UX problem. The reviewer's deny_unknown_fields recommendation
    addresses typos, not the intentionally-deserialized-then-discarded token field.
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)). The test was written by TEA and no subsequent phase flagged it as always-passing.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged same category: 'The test config_file_with_unknown_fields_does_not_panic\
