- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote CWE-209 tests in security_integration.rs and exit_codes_integration.rs
    ('cli_error_display_server_error_does_not_leak_stack_trace'). Dev implemented
    sanitized Display with hardcoded messages. Reviewer also flagged Debug potentially
    leaking inner strings.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection and CRLF prevention tests in siem_client_integration.rs.
    Dev implemented CRLF filtering in client.rs:29,36. Reviewer verified CRLF prevention
    but also noted silent dropping of invalid input. Same vulnerability class (CWE-113)
    addressed, though raw String vs TenantId type safety not specifically flagged.
