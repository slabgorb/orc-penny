- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: 'TEA security tests explicitly list ''Silent error swallowing: Every HTTP
    error status and config parse failure must produce an error'' and dev passed all
    130 tests, implying proper error discrimination was implemented.'
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly tests ''CWE-209: Server error Display must not leak stack
    traces or internal paths''. Reviewer also flagged it as CRITICAL: ''ServerError
    Display leaks internal details verbatim''.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA tests 'Header injection: CRLF in tenant ID and token must be rejected/sanitized'\
    \ \u2014 same vulnerability class CWE-113. Dev implemented CRLF prevention in\
    \ client.rs. However, the type-safety fix (using TenantId from axiathon-core)\
    \ was not adopted."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flags MEDIUM: 'Workspace dependency management incomplete \u2014\
    \ All others (clap_complete, comfy-table, csv, dirs, reqwest, toml) are defined\
    \ inline in the crate's Cargo.toml. This violates the workspace dependency management\
    \ pattern.'"
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flags HIGH: 'Config file token field silently ignored \u2014\
    \ secret left on disk' and separately 'Config silently accepts unknown fields'\
    \ recommending #[serde(deny_unknown_fields)]."
- finding_id: I5
