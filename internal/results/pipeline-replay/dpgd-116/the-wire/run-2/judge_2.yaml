findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from parse/permission errors in from_file_or_default.
    TEA tests include 'missing file fallback' but don't test that parse errors or
    permission errors propagate rather than silently defaulting.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented ServerMessage wrapper that sanitizes output (CWE-209),
    and TEA wrote security tests for CWE-209 error exposure. Reviewer verified V3:
    ''ServerMessage::Display deliberately writes server error instead of echoing raw
    server response bodies.'' Same vulnerability class addressed, though the specific
    Io(transparent) variant leaking OS details may not be fully covered.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests (CRLF/null/control chars) in tests/security.rs\
    \ and tests/siem_client.rs. Dev implemented validate_header_value() rejecting\
    \ CRLF, null bytes, control characters. However, the type-safety fix (using TenantId\
    \ from axiathon-core instead of raw String) was not addressed \u2014 only runtime\
    \ validation was added."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The Cargo.toml changes only show 2 lines modified with no
    mention of workspace dependency alignment.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged F4: ''ClientConfig silently ignores unknown TOML fields...
    users who put tokens in the config file will think they''re stored securely when
    they''re just silently dropped. A warning on unknown fields would be better.''
    Recommended #[serde(deny_unknown_fields)] or warning.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ...) in any test. The reviewer examined tests but did not flag this specific logical
    flaw.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test that only checks for non-panic
    via 'let _ = config;'. Despite SOUL.md principle 4 warning about vacuously true
    tests, this was missed.
