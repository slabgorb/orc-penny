- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from parse/permission errors in from_file_or_default.
    The dev implemented from_file() and config loading, but used unwrap_or_default()
    pattern. TEA tested 'missing file fallback' but not error-type discrimination.
    Reviewer did not flag this.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: Dev implemented ServerMessage wrapper in error.rs:52-57 that sanitizes
    output for CWE-209. TEA wrote security tests for 'CWE-209 error exposure'. Reviewer
    verified V3. Same vulnerability class (CWE-209) addressed, though the specific
    eprintln+Io(transparent) stderr leak path may not be fully covered.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests in tests/siem_client.rs and tests/security.rs\
    \ covering CRLF/null/control chars. Dev implemented validate_header_value() in\
    \ client.rs:70-80. However, the pipeline validates strings rather than using TenantId\
    \ from axiathon-core \u2014 the type-safety aspect was missed, but the CWE-113\
    \ injection risk was caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer noted F9 (toml version mismatch 0.8 vs 0.9) but did not flag
    the broader issue of 6 dependencies using direct version strings instead of workspace
    = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged F4: 'ClientConfig silently ignores unknown TOML fields\
    \ \u2014 config.rs:13-20' and explicitly described the token scenario: 'a config\
    \ file with token = \"s3cret\" parses successfully and silently ignores the field.'\
    \ Recommended #[serde(deny_unknown_fields)] or warning."
