- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The pipeline never flagged that from_file_or_default swallows all errors
    indiscriminately. The dev implemented from_file() and the TEA tested 'missing
    file fallback' but no phase distinguished NotFound from parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented ServerMessage wrapper with sanitized Display (error.rs:52-57).\
    \ TEA wrote CWE-209 security tests. Reviewer verified V3. However, the Io(#[error(transparent)])\
    \ variant still leaks \u2014 pipeline caught the class (CWE-209) but missed this\
    \ specific vector."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection tests (CRLF/null/control chars) in security.rs.
    Dev implemented validate_header_value() in client.rs:70-80. Reviewer verified
    V2. Same vulnerability class (CWE-113) caught, though fix uses runtime validation
    rather than TenantId type.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer flagged F9 (toml version mismatch 0.8 vs 0.9) but never identified
    the broader issue of 6 dependencies using direct version strings instead of workspace
    = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
