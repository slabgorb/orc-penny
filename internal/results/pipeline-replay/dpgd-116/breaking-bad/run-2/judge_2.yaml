  evidence: "Reviewer finding #14 examined token exclusion via #[serde(skip)] and\
    \ marked it 'VERIFIED GOOD.' This is the opposite conclusion \u2014 the ground\
    \ truth identifies that serde silently ignoring unknown fields leaves secrets\
    \ on disk without warning. Per opposite conclusion rule, not caught."
