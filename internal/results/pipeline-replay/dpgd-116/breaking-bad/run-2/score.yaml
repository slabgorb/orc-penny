- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'Reviewer verified ''Token excluded from config deserialization via #[serde(skip)]''
    as correct (finding #14), but this is the opposite of catching the issue. The
    problem is that serde silently ignores unknown fields like token, leaving secrets
    on disk. No phase flagged the need for #[serde(deny_unknown_fields)] or a warning.'
