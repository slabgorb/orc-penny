- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly lists ''CWE-209: Error Display doesn''t leak internal
    paths/stack traces'' as a security test in cli_error_exit_codes.rs.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote siem_client.rs tests including ''Header injection: CRLF in
    tenant ID and auth token rejected/sanitized'' targeting CWE-113. Dev implemented
    ''header injection prevention'' in client.rs. Same vulnerability class addressed.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added uuid and chrono as direct dependencies in Cargo.toml. No phase
    flagged the use of direct version strings vs workspace = true for any dependency.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: TEA describes 'Token field in TOML file is ignored (OS keychain only)'
    as a correct security property and Dev implements 'token rejection'. The pipeline
    treats silent token field ignoring as desired behavior, reaching the opposite
    conclusion from the ground truth which identifies it as a problem (secret left
    on disk, user believes they're authenticated).
