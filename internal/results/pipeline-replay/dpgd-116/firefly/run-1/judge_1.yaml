- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote siem_client.rs tests including 'Header injection: CRLF in tenant\
    \ ID and auth token rejected/sanitized' \u2014 same vulnerability class CWE-113.\
