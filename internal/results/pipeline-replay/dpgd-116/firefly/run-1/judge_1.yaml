    of the 6 dependencies.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "TEA wrote 'Config security: Token field in TOML file is ignored (OS keychain\
    \ only)' and Dev implemented 'token rejection' \u2014 both treat silent token\
    \ ignoring as correct behavior. The ground truth says this is a problem (user\
    \ believes they're authenticated, secret left on disk). Pipeline examined this\
    \ exact area and reached the opposite conclusion."
