- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented sanitized Display on CliError (error.rs:49 \u2014 ServerError\
    \ shows generic message, not inner string). TEA wrote security tests (security.rs:18-31)\
    \ confirming internal IPs/ports are not leaked. Reviewer verified CWE-209 mitigation.\
    \ However, the reviewer also flagged NotFound Display leaking inner string directly\
    \ as a remaining gap."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests in security.rs:52-96 covering CRLF injection\
    \ on tenant and token headers. Dev implemented HeaderValue::from_str() rejection\
    \ in client.rs:62. However, the deeper issue of using raw String instead of TenantId\
    \ from axiathon-core was not flagged \u2014 only the symptom (CRLF injection)\
    \ was mitigated, not the type-safety gap."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The reviewer noted toml version mismatch (0.8 vs 0.9) but never flagged
    that deps like clap_complete, comfy-table, csv, dirs, reqwest, toml use direct
    version strings instead of workspace = true. The Dev added them to workspace deps
    in root Cargo.toml but the crate Cargo.toml apparently uses direct versions.
