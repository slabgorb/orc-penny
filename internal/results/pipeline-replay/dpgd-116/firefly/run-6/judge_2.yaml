- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [MEDIUM] 'from_file_or_default swallows parse errors\
