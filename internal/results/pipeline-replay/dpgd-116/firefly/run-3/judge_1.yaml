findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Config loading tests cover TOML loading and env overrides but no test
    or code distinguishes NotFound from parse/permission errors. Dev describes 'TOML
    loading, env var overrides, XDG default path' without mentioning error discrimination
    in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA explicitly lists 'CWE-209 (error info leakage)' as coverage in exit_codes.rs
    and 'CWE-209 error exposure' in the security tests summary. Same vulnerability
    class was identified and tested for.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client.rs tests covering 'header injection security' and
    'Header injection (newlines in token/tenant)'. Dev implemented 'header injection
    prevention' in client.rs. The CWE-113 risk class was caught, though addressed
    via runtime validation rather than switching to TenantId type.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added 'chrono and uuid deps' to axiathon-client/Cargo.toml with direct
    versions. No phase flagged the 6 dependencies using direct version strings instead
    of workspace = true. Reviewer phase output is empty.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'TEA tested ''token-not-in-file security'' which validates the config
    struct excludes a token field, but no phase addressed that serde silently ignores
    unknown fields. No mention of #[serde(deny_unknown_fields)] or warning on unrecognized
    keys. The silent-ignore UX trap was not caught.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert! with
    is_none() || ...). The config_loading tests were written by TEA and passed in
    dev without anyone flagging the tautological assertion.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test using 'let _ = config;'. The
    config_loading tests passed without anyone flagging the missing assert_eq! checks
    on server() and token() for the default config.
