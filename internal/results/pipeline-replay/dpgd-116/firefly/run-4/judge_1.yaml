- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA mentions 'CliError carries context (no silent swallowing)' but this
    is a general statement about error types, not about from_file_or_default distinguishing
    NotFound from parse/permission errors. No test specifically verifies that TOML
    parse errors or permission denied errors propagate rather than falling back to
    defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security.rs tests including ''CWE-209: server error display
    doesn''t leak stack traces or internal paths''. Same vulnerability class (CWE-209
    information exposure) explicitly tested.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client.rs tests for 'header injection' and security.rs
    tests for 'Header injection prevention (newlines, CR, LF, null bytes in tokens/tenant
    IDs)'. Dev implemented 'header value validation (prevents CRLF/null injection)'.
    Same vulnerability class (CWE-113) addressed, though the type-safety aspect of
    using TenantId instead of raw String was not flagged.
