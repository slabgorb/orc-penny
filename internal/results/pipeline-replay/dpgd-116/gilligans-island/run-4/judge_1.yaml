- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged config.rs:5-9: 'Serde's default is to ignore unknown\
    \ fields. This means a typo like api_rul = \"...\" is silently ignored \u2014\
    \ the operator thinks they set the URL but got the default.' Directly addresses\
    \ the silent token/field ignoring risk."
