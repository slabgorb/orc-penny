- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer flagged silent failures in config (set_api_url, env var parsing)
    but never identified the from_file_or_default pattern that swallows all errors
    via unwrap_or_default(). No test was written to distinguish NotFound from parse/permission
    errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote security.rs tests explicitly covering 'CWE-209 error exposure'.
