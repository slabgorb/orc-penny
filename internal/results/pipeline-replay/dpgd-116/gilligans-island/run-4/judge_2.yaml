findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all errors including
    parse and permission failures. The config loading tests and reviewer comments
    discuss silent behavior for env vars and unknown fields, but never flag the unwrap_or_default
    pattern that catches all error types indiscriminately.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] ServerError variant captures raw server response\
    \ body \u2014 CWE-209 risk' at client.rs:72-74, identifying that Debug or pattern-matching\
    \ could leak internal server error details. This is the same CWE-209 vulnerability\
    \ class as the ground truth finding about CliError Display leaking internal details."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote security tests for header injection (CRLF) in tenant_id values
    in the security.rs test file. The test verifies that \r\n in tenant ID and token
    values are rejected via HeaderValue::from_str. However, the pipeline did not flag
    that SiemClient.tenant_id should use TenantId from axiathon-core instead of raw
    String.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies like clap_complete, comfy-table, csv,
    dirs, reqwest, and toml use direct version strings instead of workspace = true.
    The TEA phase added these as workspace dependencies but the actual crate Cargo.toml
    usage was not checked for workspace = true references.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] ConfigFile uses default serde behavior... Serde's
    default is to ignore unknown fields. This means a typo like api_rul = "..." is
    silently ignored.' Also noted the security test for unknown fields is vacuous
    as it accepts EITHER behavior. This matches the ground truth about needing deny_unknown_fields
    or warning.
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the specific vacuously true test with 'assert!(config.server().is_none()
    || ...)' where the first branch always makes the OR pass. The reviewer flagged
    a different vacuous test (cli_error_is_not_copy) and a different vacuous test
    (unknown fields), but not this specific is_none() || true pattern.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the test with zero assertions that only checks non-panic
    via 'let _ = config'. The reviewer flagged a different vacuous test (cli_error_is_not_copy
    at security.rs:174-179) but not this specific zero-assertion test.
