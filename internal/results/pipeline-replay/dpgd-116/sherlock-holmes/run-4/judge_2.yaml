- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default using unwrap_or_default() to swallow
    all error types. The reviewer noted with_env_overrides silently swallowing invalid
    timeout, but that is a different function and different issue.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [HIGH] CWE-209: NotFound Display exposes HTTP response
    body at error.rs:16, noting server response bodies can contain stack traces, internal
    paths, or database details. Same vulnerability class.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: dev
  evidence: Dev implemented CRLF rejection in client.rs:35-48 for both token and tenant_id,
    mitigating CWE-113 header injection. Reviewer verified this as correct. TEA wrote
    tests covering CR, LF, and CRLF variants. However, the type-safety concern (using
    TenantId from axiathon-core) was not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA noted workspace Cargo.toml was missing CLI deps and they should be
    added to [workspace.dependencies], but no phase flagged that the crate's Cargo.toml
    uses direct version strings instead of workspace = true for deps already declared
    at workspace level.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented #[serde(deny_unknown_fields)] on ClientConfig (config.rs:10),
    which the reviewer verified. This prevents silent ignoring of unknown fields like
    token, causing a parse error instead.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [MEDIUM] config_token_not_in_toml test as vacuous \u2014\
    \ accepts both Ok and Err paths so always passes. Also flagged table_formatter_handles_empty_rows\
    \ as assert!(true). Same category of vacuous assertions."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [MEDIUM] table_formatter_handles_empty_rows with assert!(!output.is_empty()\
    \ || output.is_empty()) as literally assert!(true), and flagged cli_error_display\
    \ test as only asserting !msg.is_empty() \u2014 both are tests with no meaningful\
    \ assertions on the actual behavior."
