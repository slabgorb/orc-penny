- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented #[serde(deny_unknown_fields)] on ClientConfig (config.rs:10),
    which the reviewer verified: ''Prevents deserialization of unexpected fields.
    A token field in the TOML file will cause a parse error, enforcing the tokens
    in keychain, not config rule.'' The issue was proactively avoided.'
