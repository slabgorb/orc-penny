- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA mentions 'silent error prevention' but only in context of exit codes.
    No phase distinguishes NotFound from parse/permission errors in from_file_or_default.
    Config tests cover 'TOML loading' generically but not error-type discrimination.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote security tests for 'Error information exposure (stack traces,
    DB URLs, credentials in error messages)' targeting CWE-209. Dev implemented safe
    Display for ServerError. Same vulnerability class identified, though the specific
    Io(transparent) variant was missed and reviewer marked CWE-209 as '[VERIFIED]
    correctly prevented.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
