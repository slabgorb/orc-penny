- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all error types. TEA
    mentioned 'silent error prevention' but only in context of exit codes, not distinguishing
    NotFound from parse/permission errors in config loading.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA's security_test.rs explicitly covers 'Error information exposure (stack
    traces, DB URLs, credentials in error messages)' and lists CWE-209. Same vulnerability
    class. However, the reviewer then marked CWE-209 as '[VERIFIED] correctly prevented'
    despite the Io(transparent) leak path still existing.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[LOW] SiemClient uses raw String for tenant_id instead
    of TenantId newtype' at client.rs:6, noting axiathon-core exports TenantId but
    it's unused.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned that dependencies use direct version strings instead
    of workspace = true. The dev phase added uuid and chrono deps without flagging
    the pattern, and the reviewer did not mention workspace dependency conventions.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'TEA tested ''credential exclusion'' (tokens must NOT load from config
    files), which verifies the intended behavior but does not address the silent-ignore
    problem. No phase flagged the need for #[serde(deny_unknown_fields)] or warning
    the user about unrecognized fields like token.'
