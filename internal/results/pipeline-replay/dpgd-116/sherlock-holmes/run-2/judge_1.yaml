    not error-type discrimination.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA explicitly listed 'CWE-209 error information exposure (stack traces,
    token values in error messages)' as a security test category. Dev implemented
    'security-safe Display impls' in error.rs. Reviewer verified ServerError Display
    doesn't leak. Same vulnerability class (CWE-209) was tested for, though the specific
    Io(transparent) variant may not have been caught.
