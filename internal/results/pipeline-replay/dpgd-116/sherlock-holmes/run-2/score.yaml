- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that from_file_or_default uses unwrap_or_default() to
    swallow all error types including parse and permission failures. The config tests
    cover loading and validation but not error-type discrimination on file read failures.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'CWE-209 error information exposure (stack traces,
    token values in error messages)' in error_exit_code_tests.rs. Dev implemented
    'security-safe Display impls' on CliError. Same vulnerability class (CWE-209)
    addressed, though the specific Io(transparent) variant may still leak.
- finding_id: I2
