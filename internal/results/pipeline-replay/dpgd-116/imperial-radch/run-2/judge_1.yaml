- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Header injection via CRLF in tenant ID
    and bearer token''. Dev implemented sanitize_header_value. Same vulnerability
    class identified, though the type-safety fix (using TenantId instead of raw String)
    was not applied.'
- finding_id: I3
