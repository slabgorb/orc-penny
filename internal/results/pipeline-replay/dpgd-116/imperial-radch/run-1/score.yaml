- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA security tests mention 'silent error swallowing' but only for HTTP
    connection failures, not config file loading. Reviewer flagged F7 (AXIATHON_TIMEOUT
    silent parse failure) and F12 (unknown fields) but never addressed from_file_or_default
    swallowing parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA security tests explicitly cover 'CWE-209: Error display doesn't leak\
    \ stack traces/internal details'. Reviewer also flagged F8: 'ServerError display\
    \ leaks up to 200 chars of server response body (CWE-209)' \u2014 same vulnerability\
    \ class."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection: CRLF in tenant ID and token rejected'\
    \ in siem_client.rs and security.rs. Dev implemented sanitize_header_value() stripping\
    \ \\r and \\n. However, the type-safety aspect (using TenantId instead of raw\
    \ String) was not addressed \u2014 only the CRLF symptom. Same vulnerability class\
    \ (CWE-113) was caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F9: ''clap_complete, comfy-table, csv, dirs, reqwest, and toml
    are declared directly in crates/axiathon-client/Cargo.toml with pinned versions,
    bypassing workspace dependency management. This creates version drift risk.'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F12: ''RawConfig silently ignores unknown fields... lack of
    any unknown-field handling means operators won''t discover config typos'' and
    recommends deny_unknown_fields. Though V4 marks token exclusion as correct, F12
    captures the broader silent-ignore problem that would surface the token-on-disk
    issue.'
