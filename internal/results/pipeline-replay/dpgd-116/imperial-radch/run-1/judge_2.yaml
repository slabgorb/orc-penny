- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA security tests mention 'silent error swallowing' but only for HTTP
    connection failures, not config file loading. Reviewer flags F7 (AXIATHON_TIMEOUT
    silent parse failure) which is adjacent but not the same from_file_or_default
    issue. No test or finding specifically addresses unwrap_or_default swallowing
    parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA security tests explicitly cover ''CWE-209: Error display doesn''t
    leak stack traces/internal details''. Reviewer also flagged F8: ''ServerError
    display leaks up to 200 chars of server response body (CWE-209)''. Same vulnerability
    class caught.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection: CRLF in tenant ID and token rejected'.\
    \ Dev implemented sanitize_header_value(). Reviewer verified V1. However, the\
    \ type-safety aspect (using TenantId instead of raw String) was not flagged \u2014\
    \ only the CRLF injection risk was addressed."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F9: ''clap_complete, comfy-table, csv, dirs, reqwest, and toml
    are declared directly in crates/axiathon-client/Cargo.toml with pinned versions,
    bypassing workspace dependency management. This creates version drift risk.'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F12: ''RawConfig silently ignores unknown fields... #[serde(default)]
    without #[serde(deny_unknown_fields)] means typos like sever_url or timeot are
    silently ignored... operators won''t discover config typos.'' Recommends deny_unknown_fields
    which would address the issue.'
