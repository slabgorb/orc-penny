- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA security tests cover ''Header injection: CRLF in tenant ID and token
    rejected.'' Dev implemented sanitize_header_value() stripping \r and \n. Reviewer
    verified V1. Same vulnerability class (CWE-113) addressed, though via sanitization
    rather than using typed TenantId.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
