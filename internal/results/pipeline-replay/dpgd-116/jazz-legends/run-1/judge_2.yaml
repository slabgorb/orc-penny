    bypass header injection validation (CWE-113)'.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer marked '[VERIFIED] All workspace dependencies correctly declared\
    \ in root Cargo.toml' \u2014 opposite conclusion. The ground truth issue is that\
    \ crate-level Cargo.toml uses direct version strings instead of workspace = true.\
    \ Reviewer examined this area and concluded it was correct."
