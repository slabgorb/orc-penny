    \ class identified by both phases."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote 'Header injection prevention (newlines in tenant ID and token)'
    tests in siem_client.rs. Reviewer flagged '[MEDIUM] tenant field is raw String,
