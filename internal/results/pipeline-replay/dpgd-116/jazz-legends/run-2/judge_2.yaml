    12 security tests, and all 110 tests pass in dev phase, indicating the implementation
    distinguishes error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "security.rs tests 'CWE-209 error exposure'. Dev implemented 'sanitized\
    \ Display for ServerError (CWE-209)'. Reviewer verified 'CWE-209 protection on\
    \ ServerError Display \u2014 body is stored but not shown in format!(\"{err}\"\
    )'"
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "siem_client.rs includes 'header injection' tests among its 19 tests,\
    \ security.rs also tests 'header injection'. Dev implemented 'CWE-113 newline\
    \ validation' in client.rs. However, the pipeline used runtime validation rather\
    \ than switching to TenantId type from axiathon-core \u2014 same vulnerability\
    \ class addressed differently."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added deps to workspace Cargo.toml but no phase flagged that the crate-level
