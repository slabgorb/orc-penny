- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: "TEA security tests explicitly cover 'Silent error swallowing: Config\
    \ parse errors must not be silently ignored' \u2014 this test would fail if from_file_or_default\
    \ swallows parse/permission errors via unwrap_or_default()."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA security tests cover ''CWE-209: Error messages must not expose credentials
    or sensitive paths.'' Dev implemented ''credential-sanitizing Display impl.''
    Reviewer further flagged NotFound/Config variants missing sanitize_message() (finding
    #7).'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA security tests cover 'Header injection: CRLF and null bytes in tenant\
    \ IDs and tokens.' Dev implemented CR/LF/null sanitization in client.rs:16-19.\
    \ Reviewer verified (finding #9). However, the type-safety fix (using TenantId\
    \ instead of raw String) was not flagged \u2014 only the injection vector was\
    \ mitigated via sanitization."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: 'No phase flagged the use of direct version strings instead of workspace
    = true. Reviewer noted version mismatches for dirs and toml (findings #4, #5)
    but framed them as spec deviations, not as missing workspace = true declarations.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented ''#[serde(deny_unknown_fields)]'' on ClientConfig (config.rs:11).
    Reviewer verified this at finding #11: ''Unknown TOML keys cause parse errors
    rather than silent acceptance. Good defense against typo-based misconfig.'' This
    directly prevents a token field from being silently ignored.'
