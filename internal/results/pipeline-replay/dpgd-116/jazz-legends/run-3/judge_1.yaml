    that 6 dependencies use direct version strings instead of workspace = true. The
    specific workspace inheritance issue was not identified.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented ''#[serde(deny_unknown_fields)]'' on ClientConfig (config.rs:11).
    Reviewer verified in finding #11: ''Unknown TOML keys cause parse errors rather
    than silent acceptance. Good defense against typo-based misconfig.'' Directly
    prevents the silent token field issue.'
