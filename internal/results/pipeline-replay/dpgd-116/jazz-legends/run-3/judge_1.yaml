- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''Header injection: CRLF and null bytes
    in tenant IDs and tokens'' (CWE-113). Dev implemented CR/LF/null stripping in
    client.rs:16-19. Reviewer verified. Same CWE, mitigated via sanitization rather
    than type safety.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
