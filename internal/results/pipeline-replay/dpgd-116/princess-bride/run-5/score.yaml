- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged: 'SiemClient.tenant_id is Option<String>\
    \ bypassing TenantId newtype \u2014 tenant enters HTTP header without validation'\
    \ at client.rs:15,44. Rated MEDIUM with fix: 'Accept TenantId in with_tenant(),\
    \ validate at CLI dispatch boundary.' Security subagent and tenant isolation audit\
    \ both identified this."
