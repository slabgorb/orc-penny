- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The reviewer flagged silent config fallback for invalid URL schemes (config.rs:69-71)
    but did not flag the broader from_file_or_default pattern that swallows ALL errors
    including parse and permission failures. The URL scheme fallback is a different,
    narrower issue.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests in tests/security.rs covering CWE-209 error exposure.\
    \ The reviewer also verified 'CWE-209: ServerError Display suppresses internal\
