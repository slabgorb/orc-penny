  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote CRLF header injection tests in tests/security.rs. The reviewer\
    \ flagged '--tenant accepts raw String instead of validated TenantId newtype \u2014\
