- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote 17 tests in cli_security.rs explicitly targeting ''CWE-209
    (error info exposure)''. However, the reviewer then incorrectly verified: ''[VERIFIED]
    CliError::Display does not leak tokens or internal details at error.rs:36-52'',
    reaching the opposite conclusion about the Io(transparent) variant. Credit to
    TEA for targeting the vulnerability class.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer's Data Flow Trace: 'Cli.tenant is Option<String> not Option<TenantId>\
    \ \u2014 no newtype validation at the CLI boundary.' Identified the exact type-safety\
    \ gap, though dismissed it as 'acceptable for Story 6.1'. TEA also wrote header\
    \ injection tests in cli_siem_client.rs and cli_security.rs."
