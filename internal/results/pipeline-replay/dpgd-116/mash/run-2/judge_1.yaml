- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #9 [MEDIUM]: ''tenant field uses raw Option<String>
    instead of TenantId newtype... axiathon-core exports TenantId, but both Cli and
