- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CRLF header injection prevention tests in security.rs:57-85.
    Dev implemented sanitize_header_value at client.rs:19-21 stripping \r and \n.
    Reviewer verified in finding #8. Same vulnerability class (CWE-113) addressed
    with runtime sanitization, though the type-safety fix (using TenantId) was not
    adopted.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
