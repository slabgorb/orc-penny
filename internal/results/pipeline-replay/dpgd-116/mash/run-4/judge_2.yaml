- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer finding #10 examined this exact scenario and marked it 'VERIFIED'\
    \ as correct behavior \u2014 'tokens in the TOML file are silently ignored.' This\
    \ is the opposite conclusion: the ground truth says silent ignoring is a security\
    \ risk (secret left on disk, user believes they're authenticated), but the pipeline\
    \ treated it as a feature."
