findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from parse/permission errors in from_file_or_default.
    The reviewer flagged silent ignoring of invalid timeout (F4) and unknown fields
    (F3), but never identified the blanket unwrap_or_default swallowing all error
    types including parse and permission failures.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: error Display leaking paths/stack traces''
    as a security test. Dev implemented safe Display impl. Reviewer verified V3: ''Error
    messages are generic and don''t leak internal paths, stack traces, or token details.'''
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection via CRLF in tenant/token values''
    and ''Null byte injection in tenant ID''. Dev implemented validate_header_value()
    with CRLF/null checks. Reviewer flagged F10: ''--tenant accepts raw String, not
    TenantId newtype'' and verified V1 header injection prevention.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the 6 dependencies using direct version strings instead
    of workspace = true. Reviewer F2 flagged the edition mismatch but not dependency
    version drift.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer examined the exact token behavior and concluded it was CORRECT\
    \ in V4: 'ClientConfig::token() always returns None. The RawConfig accepts but\
    \ discards the token field. Test verifies this invariant.' This is an opposite\
    \ conclusion \u2014 the ground truth says silent discard of a user's token is\
    \ a problem, but the pipeline verified it as working correctly. F3 flagged deny_unknown_fields\
    \ generally but did not connect it to the token security concern."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)) where the first branch always being true makes the OR always pass.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
