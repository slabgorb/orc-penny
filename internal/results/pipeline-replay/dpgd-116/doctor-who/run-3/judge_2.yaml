- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged CWE-209 under '[HIGH] CWE-209: ServerError Display leaks\
    \ internal details \u2014 error.rs:15-16' noting that eprintln!(\"Error: {err}\"\
    ) in main.rs:17 uses Display directly, and that there's no architectural guardrail\
    \ preventing future leakage. TEA also wrote security tests for CWE-209 error exposure.\
    \ Same vulnerability class."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] Validation functions exist but are never called\
    \ \u2014 client.rs:101-118' and '[HIGH] Silent header injection failure \u2014\
    \ client.rs:63-77' noting tenant_id accepts any string and HeaderValue::from_str\
    \ silently drops invalid headers. TEA also wrote header injection tests (CWE-113).\
    \ However, the specific finding that SiemClient uses raw String instead of TenantId\
    \ from axiathon-core was not called out \u2014 the pipeline focused on validation\
    \ not being wired in rather than using the wrong type."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer noted a toml version mismatch but did not flag that 6 dependencies
    use direct version strings instead of workspace = true. No test or review comment
    addresses workspace dependency consistency.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] RawConfig silently ignores unknown TOML fields\
    \ \u2014 config.rs:10-17' noting no #[serde(deny_unknown_fields)] and that typos\
    \ are silently ignored. Also flagged '[MEDIUM] RawConfig.token field is read and\
    \ silently discarded \u2014 config.rs:14-16' noting secrets remain in memory.\
    \ Both relate to the config silently accepting unknown/unexpected fields."
