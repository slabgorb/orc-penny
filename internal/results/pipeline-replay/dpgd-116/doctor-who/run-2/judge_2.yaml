    to test distinguishing NotFound from other error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged ''[HIGH] CliError::Config and CliError::Internal expose
    caller-provided strings in Display'' noting Internal(String) has #[error("{0}")]
    exposing inner strings directly. TEA also wrote CWE-209 security tests. Same vulnerability
    class (CWE-209 information exposure via error display).'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests in security.rs covering 'Newlines in\
    \ tenant ID and token rejected from HTTP headers.' Reviewer also flagged '[HIGH]\
    \ Silent header construction failures \u2014 CWE-113 adjacent' at client.rs:46-55.\
    \ However, neither explicitly called out that tenant_id should use TenantId from\
    \ axiathon-core instead of raw String. The CWE-113 class was caught but the type-safety\
    \ fix was not prescribed."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The reviewer noted workspace dependency version mismatches (dirs, toml
    versions wrong) but never flagged that dependencies use direct version strings
    instead of workspace = true. The Code Changes Summary shows deps were added to
    both workspace and crate Cargo.toml but no phase flagged the missing workspace
    = true pattern.
