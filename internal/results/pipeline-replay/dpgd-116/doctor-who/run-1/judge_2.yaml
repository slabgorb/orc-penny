- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: Server error stack traces not leaked
    to users, tokens not in auth error messages'' as a security test. error_exit_codes_test.rs
    includes CWE-209 info leakage tests. Reviewer also flagged the ServerError Debug
    exposure as a Medium finding.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Header injection via CRLF in tenant ID
    and token values'' in siem_client_test.rs. Dev implemented validate_tenant_id
    with CRLF/null byte rejection in client.rs:60-80. Same vulnerability class (CWE-113)
    caught, though the type-safety fix of using TenantId from axiathon-core was not
    flagged.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the use of direct version strings instead of workspace
    = true. Dev added the 6 dependencies with direct versions. Reviewer did not mention
    workspace dependency management.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer flagged missing deny_unknown_fields on RawConfig (adjacent issue),\
    \ but explicitly marked the token handling as 'VERIFIED' correct: 'Config file\
    \ does not store tokens \u2014 has_token_from_file() always returns false... Test\
    \ confirms.' This is an opposite conclusion \u2014 the reviewer examined the exact\
    \ code and concluded the silent ignoring of the token field was correct behavior."
