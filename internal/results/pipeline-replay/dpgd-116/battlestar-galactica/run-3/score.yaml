- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer explicitly examined CWE-209 on ServerError and concluded '[VERIFIED]\
    \ CWE-209 is handled correctly \u2014 Display doesn't leak internals.' But the\
    \ ground truth issue is about Io(#[error(transparent)]) forwarding full OS error\
    \ details through eprintln. Opposite conclusion rule applies \u2014 pipeline examined\
    \ the risk class and reached the wrong conclusion."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection tests in siem_client.rs and security.rs. Dev
    implemented is_safe_header_value() rejecting CRLF. Reviewer verified CWE-113 prevention
    at client.rs:99-102. Same vulnerability class (CWE-113) was identified and mitigated,
    though via runtime check rather than type-safe TenantId.
