- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default using unwrap_or_default to swallow
    all errors. TEA mentions 'config errors propagate' generically but no test specifically
    asserts that parse/permission errors are distinguished from NotFound.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA security tests explicitly cover 'CWE-209: Error Display doesn't expose\
    \ internal paths/tokens/passwords'. Dev implemented 'CWE-209 safe Display'. Reviewer\
    \ verified 'CWE-209 mitigation \u2014 Display impl sanitizes internal details\
    \ on error types'."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA security tests cover ''CRLF header injection: Tenant ID and token
    reject \r\n, \x00, \t''. Same vulnerability class (CWE-113 header injection).
    Dev implemented validate_header_value. However, the type-safety fix (using TenantId
    instead of raw String) was not addressed.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer flagged version mismatches between story spec and workspace declarations
    but did not flag the use of direct version strings instead of workspace = true
    in the crate's Cargo.toml.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: No phase flagged serde silently ignoring unknown fields like 'token' in
    config. TEA's 'token safety' tests refer to debug impl redaction, not serde's
    handling of unknown fields.
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ...) in the test suite. This is a bug in the pipeline's own test code that went
    undetected.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
