findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F3 flags: ''Config silently ignores missing file when explicitly
    specified... std::fs::read_to_string(path) failure is swallowed with if let Ok(contents).
    An explicitly-specified config path that doesn''t exist is almost certainly an
    operator mistake that should surface as an error.'' Same error-swallowing class,
    though focused on the explicit-path case rather than all error types.'
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented CWE-209 safe Display: ''CliError Display impls use generic
    messages ("server error", "access denied") and do NOT echo inner String payloads.''
    TEA wrote tests at security.rs:17-33 confirming this. Reviewer verified V2.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection prevention tests in security.rs covering CRLF
    and null byte injection for tenant_id. Dev implemented validate_header_value()
    at client.rs:84-91. However, the pipeline used runtime validation rather than
    the type-safe TenantId approach the ground truth recommends.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer V7 says 'Workspace dependencies are declared centrally' but does
    not flag the 6 specific dependencies using direct version strings instead of workspace
    = true. The pipeline concluded dependency management was correct.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F4 explicitly flags: ''ConfigFile derives Deserialize without
    #[serde(deny_unknown_fields)]. Writing token = "should-be-ignored" in the config
    file is silently accepted. Typos like servel_url instead of server_url are silently
    ignored.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F7 flags vacuous test assertions including 'config_loading.rs:219-222:\
    \ assert!(config.is_ok() || config.is_err()) \u2014 always true, asserts nothing\
    \ meaningful.' Same category of vacuously true assertions."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer F7 flags vacuous test assertions as a category, including tautologies
    and unchecked parameters. Same vulnerability class (tests that prove nothing give
