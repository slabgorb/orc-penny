- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F3 flags: ''Config silently ignores missing file when explicitly
    specified... std::fs::read_to_string(path) failure is swallowed with if let Ok(contents).
    An explicitly-specified config path that doesn''t exist is almost certainly an
    operator mistake that should surface as an error.'' Same error-swallowing class,
    though focused on the explicit-path case rather than all error types.'
  votes: 2/3
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented CWE-209 safe Display on CliError with generic messages.
    Reviewer V2 verified: ''CliError Display impls use generic messages and do NOT
    echo inner String payloads for server-sourced errors. The SECURITY comment is
    present.'' TEA also wrote security tests at security.rs:17-33.'
  votes: 3/3
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection prevention tests in security.rs. Dev implemented\
    \ validate_header_value() at client.rs:84-91 rejecting CRLF and null bytes in\
    \ tenant ID. Reviewer V1 verified. However, the specific issue of using raw String\
    \ instead of TenantId from axiathon-core was not flagged \u2014 the pipeline caught\
    \ the injection symptom but not the type-safety root cause. Still counts as same\
    \ vulnerability class (CWE-113)."
  votes: 3/3
