- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote security.rs with 13 tests explicitly covering 'CWE-209 error
    exposure' including 'Auth errors don't leak token values, server errors don't
    expose stack traces.' Same vulnerability class and concern.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] with_tenant() and with_token() bypass header\
    \ validation \u2014 only try_with_* validates' (CWE-113). TEA also wrote header\
    \ injection prevention tests for CRLF/CR/LF/null bytes in tenant ID. Same vulnerability\
    \ class identified, though neither specifically called out using raw String vs\
    \ TenantId."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer explicitly flagged '[HIGH] Workspace dependency declarations
    missing for 6 crates' noting 'They're declared directly in the crate Cargo.toml
    with inline versions. This violates the workspace pattern and creates version
    drift risk across crates.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
