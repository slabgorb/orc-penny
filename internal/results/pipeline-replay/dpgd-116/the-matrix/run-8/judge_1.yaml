- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed distinguishing NotFound from parse/permission errors
    in from_file_or_default. Config loading tests cover TOML loading and validation
    but not error-type discrimination in the fallback path.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA explicitly wrote security tests for 'CWE-209: Error display doesn't\
    \ expose internal paths or credentials' in security.rs (10 tests). Same vulnerability\
    \ class targeted. However, reviewer V3 verified Display as correct, suggesting\
    \ the Io(transparent) variant specifically was missed \u2014 but the class was\
    \ identified and tested."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Header injection via newlines/null bytes
    in tokens and tenant IDs'' in security.rs and siem_client.rs. Reviewer verified
    V2 header injection prevention. The type-safety angle (using TenantId instead
    of raw String) was not flagged, but the same vulnerability class was identified
    and tested.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev explicitly used direct version strings (clap_complete, comfy-table,
    csv, dirs, reqwest, toml) in Cargo.toml. No phase flagged the workspace = true
    convention. Reviewer noted edition mismatch (F11) but not dependency declaration
    style.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F10 flagged: ''Config silently ignores unknown fields... No
    #[serde(deny_unknown_fields)]. If a user has a typo... it''s silently ignored
    and defaults are used.'' This same mechanism would catch a user adding token to
    config. However, reviewer also marked V9 (token excluded from deserialization)
    as verified-correct, showing mixed awareness.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)). TEA wrote the test, all 102 tests passed GREEN, and reviewer did not
    flag the assertion logic.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test (let _ = config with no assert_eq!
    checks). TEA wrote the test, it passed GREEN, and reviewer did not flag the missing
    assertions.
