- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed from_file_or_default swallowing all error types. TEA's
    config_loading tests cover TOML loading and validation but no test distinguishes
    NotFound from parse/permission errors. Reviewer did not flag this pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests covering ''CWE-209: Error display doesn''t expose
    internal paths or credentials.'' Dev implemented sanitized Display on CliError.
    Reviewer verified V3: ''CWE-209: CliError Display sanitizes internal details (uses
    generic messages, inner strings not exposed for Internal, ServerError, NotFound).'''
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Header injection via newlines/null bytes
    in tokens and tenant IDs.'' Reviewer verified V2: ''Header injection prevention:
    \r, \n, \0 checked at client.rs:25-37.'' Same vulnerability class (CWE-113) addressed,
    though the type-safety fix (using TenantId from axiathon-core) was not specifically
    recommended.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged direct version strings instead of workspace = true. Reviewer
    noted edition mismatch (F11) but not workspace dependency management. Dev used
    direct versions in Cargo.toml without comment.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F10: ''Config silently ignores unknown fields... No #[serde(deny_unknown_fields)].
    If a user has a typo like servar_url instead of server_url, it''s silently ignored.''
    This fix would also surface the token field issue. However, V9 simultaneously
    approves token exclusion as correct, showing contradictory analysis.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)). Reviewer flagged vacuous stub tests (F7) but not this specific None
    || true pattern.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
