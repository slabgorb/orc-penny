findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed distinguishing NotFound from parse/permission errors
    in from_file_or_default. Config tests cover loading and validation but not error-type
    discrimination.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA security tests explicitly cover ''CWE-209: Error display doesn''t
    expose internal paths or credentials''. Dev implemented sanitized Display. Reviewer
    verified V3: ''CliError Display sanitizes internal details (uses generic messages,
    inner strings not exposed)''.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA security tests cover ''CWE-113: Header injection via newlines/null
    bytes in tokens and tenant IDs''. Reviewer verified V2: ''Header injection prevention:
    \r, \n, \0 checked at client.rs:25-37''. Same vulnerability class caught, though
    mitigation is runtime validation rather than using TenantId type.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev output lists direct dependency additions. Reviewer flagged edition
    mismatch (F11) but never mentioned workspace = true vs direct version strings.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F10: ''Config silently ignores unknown fields. RawConfig uses
    #[derive(Deserialize, Default)] with no #[serde(deny_unknown_fields)]. If a user
    has a typo like servar_url instead of server_url, it''s silently ignored.'' This
    directly encompasses the token field being silently ignored.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assert!(config.server().is_none()
    || ...) pattern. Reviewer's F7 about vacuous stub tests is a different issue (truncated
    story references).
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test that only checks for non-panic
    via 'let _ = config'.
