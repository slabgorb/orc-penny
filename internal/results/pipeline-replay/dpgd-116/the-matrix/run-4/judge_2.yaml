- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default uses unwrap_or_default()
    to swallow all error types including parse and permission failures. The reviewer
    flagged env override swallowing and URL validation bypass, but not this specific
    method's blanket error suppression.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote security tests for 'CWE-209 error exposure' and 'Error messages
    not leaking internal IPs, paths, or credentials'. Dev implemented hardcoded Display
    messages for CWE-209 safety. Same vulnerability class addressed, though the specific
    Io(transparent) variant forwarding OS details was not individually called out.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection via CRLF in tenant ID' (CWE-113).\
    \ Dev implemented sanitize_header_value() with CRLF stripping. However, the deeper\
    \ issue of using raw String instead of validated TenantId from axiathon-core was\
    \ not flagged by any phase \u2014 only the symptom (CRLF injection) was mitigated,\
    \ not the root cause (type safety)."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The reviewer noted a toml version mismatch (0.8 vs 0.9) but
    did not identify the workspace = true pattern violation.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: Reviewer explicitly flagged '[MEDIUM] RawConfig accepts unknown TOML fields
    without warning' and recommended '#[serde(deny_unknown_fields)]' to catch typos
    at parse time. Also flagged the weak config_has_no_token_field test.
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
