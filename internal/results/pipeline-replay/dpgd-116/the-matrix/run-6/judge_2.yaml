findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed from_file_or_default swallowing all error types. TEA
    tests mention 'Silent error swallowing' but only for connection errors, not config
    file parse/permission errors. No test distinguishes NotFound from parse errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly included ''CWE-209: Server error Display must not leak
    stack traces or internal paths'' as a security test category. The vulnerability
    class was identified and tested for, even though the Reviewer later verified Display
    as correct.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[LOW] tenant field is Option<String> not TenantId' noting
    'The story's technical guardrails reference axiathon-core shared types including
    TenantId. The --tenant flag accepts a raw String with no validation.' TEA also
    wrote header injection prevention tests for tenant ID.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer stated '[VERIFIED] Workspace dependencies correctly declared\
    \ in root Cargo.toml' \u2014 this verifies root declaration but misses that 6\
    \ crate-level deps use direct version strings instead of workspace = true. Opposite\
    \ conclusion on the actual issue."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] ClientConfig silently ignores unknown TOML
    fields' noting '#[serde(deny_unknown_fields)] is not' applied and 'typos in config
    files are silently ignored.' Directly matches the ground truth finding.
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ...) in the test suite. The pipeline created and approved this test without flagging
    the logical error.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test. The pipeline created and
