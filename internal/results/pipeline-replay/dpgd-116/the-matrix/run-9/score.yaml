- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from parse/permission errors in from_file_or_default.
    The reviewer flagged silent env override ignoring (different issue) but not the
    unwrap_or_default swallowing all error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA included ''CWE-209: Server error display must not leak stack traces''
    tests. Dev implemented ''CWE-209 safe Display'' in error.rs. Reviewer verified
    ''CWE-209 error information disclosure is mitigated''. Same vulnerability class
    (CWE-209 information exposure) was addressed, though the specific Io(transparent)
    variant forwarding OS details was not individually called out.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[HIGH] --tenant accepts raw String instead of validated
    TenantId (AC-5, Type Safety)' noting axiathon-core has a validated TenantId newtype
    that is unused, and arbitrary strings including CRLF are accepted. TEA also wrote
    header injection tests for newlines in tenant values.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[HIGH] Several dependencies not declared as workspace
    dependencies' stating 'None of these were added to the root Cargo.toml [workspace.dependencies].
    Instead, they are declared with inline versions in the crate's Cargo.toml. This
    violates workspace dependency management.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented '#[serde(deny_unknown_fields)]' on ClientConfig (config.rs:12).\
    \ Reviewer verified: 'serde(deny_unknown_fields) rejects unknown config fields\
    \ \u2014 this means a token field in the config file is correctly rejected (tested\
    \ in config_loading.rs:122-139).' TEA also included 'token-not-in-config' coverage."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged ''[LOW] Test exit_code_success_is_zero is vacuous''
    identifying assert_eq!(0_i32, 0) as testing nothing about the code. Same category
    of vacuously true test, different specific instance. Per partial match rule #2,
    pipeline demonstrated detection of vacuous test assertions.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged the vacuous test pattern (assert_eq!(0, 0) with comment
    acknowledging it''s a placeholder) and stated ''it should not be counted as test
    coverage.'' Same category as zero-assertion test. Per partial match rule #2, pipeline
    demonstrated awareness of tests with no meaningful assertions.'
