- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for CWE-113 header injection prevention (CRLF in tenant\
    \ IDs and auth tokens) in siem_client.rs and security.rs. Dev implemented CRLF\
    \ sanitization. However, the specific finding about using raw String instead of\
    \ TenantId from axiathon-core was not flagged \u2014 the pipeline addressed injection\
    \ but not the type-safety gap. Reviewer verified header injection prevention.\
    \ Partial credit as same vulnerability class."
