findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that from_file_or_default uses unwrap_or_default() to
    swallow all error types including parse and permission failures. Config tests
    cover loading and validation but not error-type discrimination.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote CWE-209 security tests checking that error Display must not
    leak file paths, stack traces, or internal IPs. Reviewer also flagged ServerError
    Display leaking internals via Debug (CWE-209 incomplete mitigation). Same vulnerability
    class caught by multiple phases.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-113 tests: ''SiemClient rejects CRLF in tenant IDs and
    auth tokens.'' Reviewer verified CRLF sanitization in client.rs:19-33. Same vulnerability
    class (CWE-113 header injection) addressed, though the type-safety fix (using
    TenantId instead of raw String) was not flagged.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added deps with direct version strings. Reviewer flagged a toml version
    mismatch (0.8 vs 0.9) but never flagged that dependencies should use workspace
    = true instead of direct version strings.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged as HIGH: 'RawConfig silently ignores unknown fields\
    \ (secret exposure risk) \u2014 A user who accidentally puts token = \"my-secret\"\
    ... gets no warning. Add #[serde(deny_unknown_fields)] to RawConfig to reject\
    \ unknown keys, which catches misplaced secrets.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged the vacuous test in config_loading.rs:122-138: 'the\
    \ test explicitly acknowledges this gap with an if let Ok(config) branch \u2014\
    \ meaning it passes either way. This is a vacuous assertion: it cannot fail.'\
    \ Same category of vacuously true test."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test that only checks non-panic with
    let _ = config. TEA wrote config tests but this specific gap was not identified
    by any phase.
