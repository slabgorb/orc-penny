    in from_file_or_default. TEA wrote config loading tests but none specifically
    test that parse errors or permission errors propagate rather than falling back
    to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote CWE-209 security tests at security.rs:11-19 checking that error
    Display doesn't leak file paths, stack traces, or internal IPs. Reviewer also
    flagged ServerError Debug leaking internals (same vulnerability class, CWE-209).
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote CWE-113 header injection tests in siem_client.rs (13 tests)
    and security.rs verifying CRLF rejection in tenant IDs and auth tokens. Dev implemented
    CRLF sanitization in client.rs:19-33. Same vulnerability class addressed, though
    the type-safety fix (using TenantId from axiathon-core) was not specifically flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. The reviewer noted a toml version mismatch but did not flag
