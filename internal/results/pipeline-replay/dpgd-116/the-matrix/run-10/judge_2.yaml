- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all errors via
    unwrap_or_default. The TEA's 'silent error swallowing' test checks Display impls
    are non-empty, not that parse/permission errors are distinguished from NotFound.
    The reviewer noted timeout clamping and env override validation bypass but never
    flagged the unwrap_or_default pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote cli_security.rs tests for CWE-209 including ''server_error_display_sanitizes_internal_details''.
    Dev implemented safe Display impls with static strings. Reviewer flagged ''[HIGH]
    CWE-209: ServerError Display leaks raw internal error details'' noting the inner
    String accessible via Debug. Same vulnerability class addressed across all three
    phases.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests (CRLF, lone \\n, \\r, null bytes in\
    \ tenant ID). Dev implemented CWE-113 validation in SiemClient::new(). Reviewer\
    \ explicitly flagged '[MEDIUM] tenant field accepts raw String instead of TenantId\
    \ newtype \u2014 cli.rs:26' and noted SiemClient::new() takes Option<String> instead\
    \ of TenantId."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] comfy-table, csv, dirs, toml, reqwest not\
    \ declared as workspace dependencies \u2014 Cargo.toml (crate level)' noting they\
    \ are declared inline rather than using workspace = true, violating the project\
    \ rule for workspace-level dependency declarations."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
