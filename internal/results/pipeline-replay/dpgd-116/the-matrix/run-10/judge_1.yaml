findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default uses unwrap_or_default()
    to swallow all error types. The reviewer flagged adjacent issues (timeout silent
    clamping, env override bypassing validation) but never the core from_file pattern
    that treats parse errors and permission errors the same as NotFound.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged CWE-209 on ServerError Display and NotFound Display.
    TEA wrote cli_security.rs tests for 'Error information exposure (no internal paths,
    no HTML echo-back in NotFound)'. Dev implemented static Display strings. Reviewer
    then noted the security test was vacuous and the inner String accessible via Debug.
    Same vulnerability class addressed across phases.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged: '[MEDIUM] tenant field accepts raw String\
    \ instead of TenantId newtype \u2014 cli.rs:26' and 'Same issue in SiemClient::new()\
    \ at client.rs:30 which takes tenant_id: Option<String>.' TEA also wrote header\
    \ injection prevention tests (CWE-113) for SiemClient, and Dev implemented CRLF/null\
    \ byte validation, but the raw String type issue was caught by the reviewer."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged: '[MEDIUM] comfy-table, csv, dirs, toml, reqwest not\
    \ declared as workspace dependencies \u2014 Cargo.toml (crate level)... declared\
    \ inline in the crate's Cargo.toml at lines 13-21, not in the workspace [workspace.dependencies].\
    \ This violates the project rule: Workspace-level dependency declarations in root\
    \ Cargo.toml.'"
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented #[serde(deny_unknown_fields)] on ClientConfig. Reviewer\
    \ verified: '#[serde(deny_unknown_fields)] on ClientConfig rejects unknown TOML\
    \ keys including token, api_token, password \u2014 properly blocks credential\
    \ storage in config.' This prevents the silent-ignore scenario entirely."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
