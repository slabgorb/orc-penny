- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA tests include 'missing file fallback' and 'malformed TOML' but no
    phase flagged the critical distinction between NotFound (acceptable) and parse/permission
    errors (should propagate). Dev implemented from_file_or_default without distinguishing
    error types, and reviewer did not flag it.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''CWE-209 error exposure'' in security.rs.
    Reviewer verified ServerError sanitizes status codes (finding #10), demonstrating
    awareness of the vulnerability class, though the Io(transparent) variant leaking
    OS paths was not specifically flagged.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #6: '--tenant flag uses raw String instead of TenantId\
    \ newtype at cli.rs:34 \u2014 Per rust.md: Newtypes for IDs: TenantId(String).\
    \ The tenant flag is Option<String>, and it flows as a raw string into SiemClient.'\
    \ TEA also wrote CRLF injection tests in security.rs."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned workspace dependency consistency. Dev added uuid and
    chrono with direct versions. Reviewer did not flag the 6 dependencies using direct
    version strings instead of workspace = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer reached the opposite conclusion \u2014 finding #11 'VERIFIED'\
    \ token exclusion as correct: 'IgnoredToken transparent type that deserializes\
    \ but is never stored... token value doesn't appear in Debug output.' The ground\
    \ truth identifies this silent ignoring as a problem (user believes they're authenticated).\
    \ Opposite conclusion per rule 4."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #3: 'Vacuous assertion in siem_client_requires_base_url\
    \ at tests/siem_client.rs:218 \u2014 assert!(client.base_url().is_empty() || true,\
    \ ...) is always true regardless of actual behavior. The || true nullifies the\
