    \ reaching the opposite conclusion, meaning the tests may not actually catch the\
    \ Io(transparent) forwarding path."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client.rs tests for 'header injection (X-Tenant-ID, Authorization),
    header injection prevention' targeting CWE-113. Reviewer also flagged 'with_tenant()
    inconsistent null byte handling vs with_token()' as MEDIUM. However, neither phase
    flagged the root cause of using raw String instead of validated TenantId from
    axiathon-core.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The reviewer noted toml version mismatch and missing keyring
    but did not identify the workspace = true pattern violation.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[LOW] RawConfig silently ignores unknown fields' recommending\
    \ #[serde(deny_unknown_fields)]. Adding deny_unknown_fields would reject a token\
    \ field in config, directly addressing I4. However, the reviewer also stated '_token\
    \ and _api_token fields are intentionally allowed and ignored (which is good for\
    \ security)' \u2014 partially contradicting the ground truth concern."
