- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [HIGH] ''ServerError variant leaks internal message
    via Display'' noting the fragile pattern where changing #[error("server error")]
    to #[error("server error: {0}")] would leak HTTP status codes (CWE-209). TEA also
    wrote security tests for ''CWE-209: Error information exposure (no stack traces,
    no user existence leaks)''. Same vulnerability class.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection: CRLF in tenant ID and auth token'\
    \ and 'Null byte injection in headers'. Dev implemented CRLF sanitization at client.rs:37,44.\
    \ Reviewer verified. Same vulnerability class (CWE-113), though the ground truth\
    \ specifically calls out using raw String vs TenantId type safety \u2014 the type-level\
    \ fix was not applied, but the injection risk was addressed."
