findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default using unwrap_or_default to swallow
    all errors. TEA wrote config tests for loading/validation/permissions but none
    specifically test that parse errors or permission failures propagate rather than
    falling back to defaults. Reviewer flagged silent unknown fields (I4) but not
    the blanket error swallowing in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote 2 tests for ''CWE-209: Error display does not leak server internals''.
    Dev implemented CWE-209 safe Display where ServerError Display outputs only ''server
    error occurred''. Reviewer verified ''[VERIFIED] CliError::Display does not leak
    server internals''. Same vulnerability class (CWE-209) addressed, though the specific
    Io(transparent) variant may still leak.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote 'CWE-113: Header injection prevention via newline in tenant/token\
    \ (2 tests)'. Reviewer escalated as CRITICAL: 'with_token() and with_tenant()\
    \ bypass header injection validation \u2014 client.rs:47-50, client.rs:68-71'.\
    \ The raw String type issue (vs TenantId) wasn't flagged, but the header injection\
    \ vulnerability class (CWE-113) was caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. TEA added workspace deps but didn't verify crate-level Cargo.toml
    uses workspace references. Reviewer did not mention this.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged as [HIGH]: 'ConfigFile silently accepts unknown fields\
    \ \u2014 config.rs:10-24... A config file with typos like [servr] or timout =\
    \ 30 will be silently ignored... The token field silently being ignored (line\
    \ 22-23) compounds this \u2014 an operator who puts token = \"...\" in their config\
    \ gets no warning that it's ignored.'"
- finding_id: I5
