findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Neither TEA, Dev, nor Reviewer flagged from_file_or_default swallowing
    all errors. The reviewer mentioned unwrap_or_default() but only on client.rs:79
    (HTTP response body), not the config loading path. Config tests exist but did
    not distinguish NotFound from parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "TEA wrote CWE-209 tests and the reviewer marked '[VERIFIED] Security\
    \ comment on CliError Display: error.rs:3 \u2014 no token/path leakage.' However,\
    \ the ground truth says Io(#[error(transparent)]) leaks OS error details. The\
    \ pipeline examined this exact code and concluded it was correct \u2014 opposite\
    \ conclusion. All 94 tests pass despite the issue existing."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly included ''Header injection: Tenant ID and auth token
    with \r\n are rejected/sanitized'' in security tests (tests/siem_client.rs). Dev
    implemented assert!() checks at client.rs:26-28,39-41. Reviewer verified the defense
    survives release builds. While the pipeline chose runtime assertion over TenantId
    newtype, CWE-113 was identified and mitigated.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The reviewer did not examine Cargo.toml dependency declarations
    for workspace consistency.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged: '[MEDIUM] RawConfig accepts unknown TOML fields silently\
    \ \u2014 config.rs:6-11. No #[serde(deny_unknown_fields)] on RawConfig. A typo\
    \ like api_rul = \"...\" is silently ignored.' This directly covers the token\
    \ field being silently ignored."
