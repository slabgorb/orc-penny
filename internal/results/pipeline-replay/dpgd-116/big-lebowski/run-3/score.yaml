- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer Finding #2 (HIGH) flags SiemClient header handling: ''If a tenant
    ID or token contains invalid characters, the header is silently omitted... security-sensitive
    silent failure.'' Also notes tests are vacuous (''let _ = result; They don''t
    assert anything''). Same vulnerability class (header injection via unsanitized
    tenant_id).'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer Finding #7 (MEDIUM): ''New dependencies not declared in workspace
    [workspace.dependencies]... declared directly in the crate''s Cargo.toml with
    inline versions (clap_complete = "4", comfy-table = "7", etc.). This violates
    the workspace dependency management pattern.'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer Finding #3 (HIGH): ''ConfigFile and ServerConfig structs use
    #[derive(Deserialize)] without #[serde(deny_unknown_fields)]. A user who writes
    token = "secret" gets zero feedback... Fix: Add #[serde(deny_unknown_fields)].'''
