- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default uses unwrap_or_default to
    swallow all error types including parse and permission failures. The reviewer
    flagged silent env var parse errors and silent unknown TOML fields, but never
    the from_file fallback pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''CWE-209: Error messages don''t leak stack
    traces, DB details, or user existence''. Reviewer further flagged ''[MEDIUM] NotFound
    error leaks user-controlled input in Display'' noting inconsistent sanitization
    on NotFound and ConfigError variants. Same vulnerability class addressed.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'CRLF header injection prevention on tenant ID and
    auth token' and 'Null byte injection in headers'. Dev implemented sanitization
    at client.rs:42-48. Same vulnerability class (CWE-113 header injection) addressed,
    though the type-safety fix (using TenantId instead of String) was not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The reviewer verified dependency boundaries but not workspace
