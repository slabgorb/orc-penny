- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] RawConfig silently ignores unknown TOML fields\
    \ \u2014 config typos go undetected' and explicitly called out the token-in-config\
    \ scenario: 'If a user puts a token in the config file, the tool silently ignores\
    \ it with no warning. The user thinks they're authenticated; they're not.' Required\
    \ fix: deny_unknown_fields or warn on [auth] section."
