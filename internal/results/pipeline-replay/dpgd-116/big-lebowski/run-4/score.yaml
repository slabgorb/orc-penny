- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #7: 'RawConfig silently ignores token field \u2014 config.rs:23.\
    \ The token field in RawConfig is #[allow(dead_code)] and silently parsed then\
    \ discarded. If an operator puts token = \"...\" in their config, there's no warning\
    \ that it's being ignored.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged vacuous tests (findings #10 and #11) \u2014 same category\
    \ of 'assertion that always passes.' Finding #10: 'assert_eq!(0i32, 0) tests nothing.'\
    \ Finding #11: 'assert!(true) always passes.' Same type of issue as the ground\
    \ truth's None || true vacuous assertion."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: 'The reviewer flagged vacuous tests with trivially true assertions (#10,
