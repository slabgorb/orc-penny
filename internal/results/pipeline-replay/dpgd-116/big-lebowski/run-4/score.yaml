- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests for 'CWE-209: Server error display doesn't leak\
    \ stack traces, paths, or credentials.' Dev implemented sanitized Display in error.rs.\
    \ Reviewer verified: 'CWE-209 error display sanitization \u2014 error.rs uses\
    \ constant thiserror messages that ignore the inner String payload.'"
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Tenant ID and auth token with CRLF injection
    rejected/sanitized.'' Dev implemented CRLF rejection in client.rs with_tenant().
    Reviewer then flagged the silent rejection as a correctness bug (finding #2),
    noting it should return Result. The CWE-113 vulnerability class was identified,
    though the raw String vs TenantId type safety gap was not.'
