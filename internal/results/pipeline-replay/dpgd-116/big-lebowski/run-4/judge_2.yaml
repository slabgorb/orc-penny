- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented error.rs with 'sanitized Display (CWE-209)' using constant\
    \ thiserror messages. TEA wrote CWE-209 tests: 'Server error display doesn't leak\
    \ stack traces, paths, or credentials.' Reviewer verified #20: 'error.rs uses\
    \ constant thiserror messages that ignore the inner String payload, preventing\
    \ information leakage.' However, the Io(#[error(transparent)]) variant may still\
    \ leak \u2014 pipeline demonstrated awareness of the risk class."
