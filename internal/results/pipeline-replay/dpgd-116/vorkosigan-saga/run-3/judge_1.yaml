- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests for CWE-209 error exposure. Dev implemented\
    \ sanitized Display that discards inner strings. Reviewer verified: 'Display impl\
    \ does not leak internal details \u2014 ServerError(msg) and NotFound(msg) discard\
    \ their inner strings in display output.' Pipeline demonstrated awareness and\
    \ implemented mitigations for the vulnerability class."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote header injection tests covering CRLF in tenant ID, token, and
    base URL (CWE-113). Dev implemented CRLF stripping. Reviewer verified: ''CRLF
    characters stripped from base_url, token, and tenant_id.'' Same vulnerability
    class (CWE-113) addressed, though the deeper type-safety issue of using TenantId
    from axiathon-core was not flagged.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flagged: ''toml, clap_complete, comfy-table, csv,
    dirs, reqwest are all declared locally in the crate''s Cargo.toml instead of in
    [workspace.dependencies]'' and listed it as required before re-review.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged: ''ClientConfig accepts unknown TOML fields silently...
