- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: 'Dev implemented InternalDetail wrapper: ''CliError::ServerError and Config
    wrap an InternalDetail type that suppresses sensitive info in Display (CWE-209)''.
    TEA wrote 9 security tests covering ''CWE-209 error exposure''. Reviewer verified
    ''CliError::Display does not leak InternalDetail strings to user-facing output''.
    However, the stderr eprintln path in main.rs was not wired up (main.rs is a dead
    stub), so the mitigation is incomplete in practice.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: dev
  evidence: 'Dev implemented CRLF stripping: ''SiemClient strips CR/LF from tenant
    IDs and rejects tokens with CR/LF (header injection prevention)''. TEA wrote header
    injection tests in cli_siem_client.rs and cli_security.rs. Same CWE-113 vulnerability
    class addressed, though via sanitization rather than the ground truth''s preferred
    TenantId type safety approach.'
