findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all errors (parse, permission,
    I/O) via unwrap_or_default(). TEA tested 'missing file defaults' but didn't test
    that parse errors or permission errors are surfaced rather than silently falling
    back. Reviewer flagged silent env parse failures (#4) and silent unknown fields
    (#3) but not this specific error-swallowing pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #1 flagged CWE-209 concerns around CliError Display
    and ServerError, noting the inconsistency pattern and that Debug could leak internals.
    TEA also wrote security tests for ''CWE-209: Error messages don''t leak stack
    traces or server paths''. Same vulnerability class (CWE-209 information exposure)
    was identified, though the specific Io(transparent) instance wasn''t called out.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'CRLF in tenant ID and auth token rejected/sanitized'\
    \ in security.rs. Dev implemented sanitize_header_value() in client.rs:17-19.\
    \ Reviewer verified 'Header injection (CWE-113) prevention implemented'. However,\
    \ the type-safety aspect (using TenantId from axiathon-core instead of raw String)\
    \ was not addressed \u2014 only runtime sanitization was applied."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. The code changes show deps added to Cargo.toml but no one
    noted they should use workspace dependency references.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #3 explicitly flags: ''ClientConfig silently accepts
    unknown fields including token... An operator could put token = "my-secret" in
    the plaintext config file thinking it works, when it''s actually ignored. This
    is a security anti-pattern.'' Recommends #[serde(deny_unknown_fields)] or warning
    on unknown fields.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)) where the first branch of the OR always makes the assertion pass regardless.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the test with zero assertions that only checks for
    non-panic via 'let _ = config'. No mention of missing assert_eq! checks on default
    config values.
