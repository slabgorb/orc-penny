- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: "TEA Security Tests explicitly list: 'Silent error prevention (invalid\
    \ TOML, bad env vars must error, not default)' \u2014 tests that invalid TOML\
    \ and bad env vars must produce errors, not silently fall back to defaults."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA flagged CWE-209 in Security Tests: ''CWE-209: Token not exposed in
    Debug output.'' Same vulnerability class (information exposure) applied to a different
    instance (token vs error details), but demonstrates awareness of the CWE-209 risk
    category.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer MEDIUM finding: 'validate_tenant_id() exists but is never called\
    \ \u2014 A malicious tenant ID can be passed to the constructor without validation.'\
    \ TEA also wrote CWE-113 header injection tests. However, neither flagged the\
    \ core issue of using raw String instead of TenantId from axiathon-core."
