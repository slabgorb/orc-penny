- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA listed ''CWE-209: error messages must not leak internal paths/details''
    as a security test. Reviewer verified CWE-209 sanitization on ServerError Display
    impl. Same vulnerability class (CWE-209) was identified and tested, though the
    specific Io(transparent) propagation path to stderr was not called out.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection: CRLF in tenant ID and auth token
    rejected''. Dev implemented CRLF checks in client.rs:56-72. Reviewer verified:
    ''Explicit \r and \n checks on both tenant and token before header construction.''
    Same CWE-113 risk class caught, though mitigated via runtime checks rather than
    using TenantId type.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the 6 dependencies using direct version strings instead
    of workspace = true. The reviewer noted missing keyring from workspace deps but
    did not catch the version-string-vs-workspace issue on the other 6 deps.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [MEDIUM] ''Unknown TOML fields silently ignored'' at
    config.rs:15-22 and recommended #[serde(deny_unknown_fields)]. However, the reviewer
    simultaneously verified token handling as correct (''Token never stored in config...
    VERIFIED''), reaching an opposite conclusion on the specific token instance. Partial
    credit: the general recommendation of deny_unknown_fields would surface the token
    problem.'
