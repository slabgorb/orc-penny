- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA mentions 'No silent error swallowing in SiemClient' but that targets
    SiemClient, not config's from_file_or_default. Reviewer verified token handling
    in config but did not flag the unwrap_or_default swallowing all error types. No
    phase addressed distinguishing NotFound from parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA listed ''CWE-209: error messages must not leak internal paths/details''
    as a security test category. Same vulnerability class (CWE-209) was tested for.
    However, the reviewer verified ServerError sanitization as correct without flagging
    the Io(transparent) variant leaking through eprintln, so the reviewer missed the
    specific instance.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection: CRLF in tenant ID and auth token
    rejected''. Dev implemented CRLF checks in client.rs:56-72. Reviewer verified
    CRLF prevention. Same vulnerability class CWE-113 was addressed, though the type-safety
    fix (using TenantId instead of raw String) was not flagged.'
