findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The TEA phase mentions 'silent config parse error swallowing' as a security
    test, and the reviewer flags silent env override issues (finding 8), but neither
    the tests nor the reviewer specifically identify that from_file_or_default swallows
    ALL errors via unwrap_or_default(). The reviewer's finding 7 is about deny_unknown_fields,
    not about the error-swallowing pattern in from_file_or_default. The config_loading
    tests don't appear to test that parse errors are surfaced rather than silently
    defaulted.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding 6 flags CWE-209: ''ServerError variant passes through
    raw internal details'' and notes the security test is vacuous. TEA also wrote
    security tests for CWE-209 error information exposure. Same vulnerability class
    (CWE-209 information leakage via Display) even if the specific variant differs
    slightly.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection tests for tenant IDs via CR/LF/null. Reviewer\
    \ finding 11 also flags that 'with_tenant() and with_token() bypass injection\
    \ validation' and that axiathon-core's validated TenantId could be used. However,\
    \ the dev implemented validated wrappers rather than using TenantId from axiathon-core,\
    \ so the raw String type remains \u2014 the risk was identified but the fix is\
    \ incomplete."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. The TEA phase added dependencies to workspace but the dev
    phase apparently used direct versions in the crate Cargo.toml. The reviewer did
    not mention this issue.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding 7 explicitly flags: 'Config silently accepts unknown\
    \ fields \u2014 no #[serde(deny_unknown_fields)]' and describes the exact scenario\
    \ of typos being silently ignored. This matches the ground truth about token fields\
    \ being silently ignored."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified a vacuously true test with assert!(config.server().is_none()
    || ...). The reviewer mentions the CWE-209 security test being vacuous (finding
    6, checking !display.is_empty()), but that's a different test than the one identified
    in I5 about config assertions.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged a test with zero assertions that only checks non-panic
    via 'let _ = config'. None of the review findings mention this specific issue.
