    risk. Same vulnerability class caught across all three phases.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: "Pipeline addressed CWE-113 header injection via CRLF sanitization, but\
    \ the ground truth finding is that SiemClient.tenant_id uses raw String instead\
    \ of axiathon-core's validated TenantId type, bypassing type-safe tenant isolation.\
    \ Reviewer '[VERIFIED] Header injection (CWE-113) is sanitized' \u2014 concluded\
    \ the sanitization approach is correct, missing that the type system should enforce\
    \ this per SOUL.md Principle #2. Opposite conclusion on the type safety aspect."
