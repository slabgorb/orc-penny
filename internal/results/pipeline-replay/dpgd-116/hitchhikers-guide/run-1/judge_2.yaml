- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: ServerError Display must not leak internal
    paths/stack traces'' as a security test. Dev implemented security-safe Display
