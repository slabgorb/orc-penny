    swallows parse/permission errors. Config tests exist but none distinguish NotFound
    from other error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "TEA wrote CWE-209 tests and Reviewer marked '[VERIFIED] CliError::Display\
    \ impls do not leak tokens, stack traces, or backtraces (CWE-209 safe)' \u2014\
    \ opposite conclusion. The ground truth says Io(transparent) forwards full OS\
    \ error details via eprintln, which the pipeline examined and deemed correct."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests for 'Header injection via newlines in tenant ID and auth\
    \ token (CWE-113)' in siem_client.rs. Reviewer verified 'Header injection with\
    \ \\r\\n is blocked \u2014 client.rs:51,59; tests at siem_client.rs:139-174'.\
    \ Pipeline caught CWE-113 class though not the type-safety angle of using raw\
    \ String vs TenantId."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies use direct version strings instead
    of workspace = true. Dev created Cargo.toml entries with direct versions and neither
    TEA nor Reviewer caught the workspace dependency drift risk.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer item #5: '[MEDIUM] RawConfig silently ignores unknown TOML fields\
    \ \u2014 No #[serde(deny_unknown_fields)] on RawConfig. If an operator typos api_url\
    \ as api-url or apiUrl, the field is silently ignored.' Recommended adding deny_unknown_fields."
