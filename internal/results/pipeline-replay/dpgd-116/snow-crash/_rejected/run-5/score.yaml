- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: server error Display doesn''t leak internal
    stack traces'' as a security test. Dev implemented sanitized ServerError Display.
    However, the Io(#[error(transparent)]) variant still leaks, so the specific instance
    was missed while the class was addressed.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''Header injection: tenant/token with \r\n
    must be rejected''. Dev implemented newline rejection in client.rs:31-35,44-48.
    Reviewer verified header injection prevention. Same CWE-113 class caught, though
    the type-safety fix (using TenantId from axiathon-core) was not identified.'
