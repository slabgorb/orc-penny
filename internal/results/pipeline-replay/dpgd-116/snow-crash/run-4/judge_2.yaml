findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed the from_file_or_default error swallowing. Config tests
    focus on TOML parsing and env overrides but never test that permission/parse errors
    are distinguished from NotFound. Reviewer flagged deny_unknown_fields but not
    the unwrap_or_default swallowing all error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote CWE-209 security tests including 'server_error_display_sanitizes_internal_details'
    in security.rs. Reviewer escalated to HIGH noting ServerError stores raw body
    accessible via Debug derive. Same vulnerability class addressed across multiple
    phases.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote CRLF injection tests for tenant ID (CWE-93). Dev implemented
    CRLF filtering in client.rs:27-34. Reviewer flagged as LOW that tenant field is
    raw String not TenantId. The header injection risk was directly tested and mitigated,
    though the type-safety gap was only noted at LOW.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. TEA mentioned 'Added workspace deps' but the actual Cargo.toml
    additions used direct versions. Reviewer verified dependency isolation but not
    workspace consistency.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as MEDIUM: ''RawConfig silently accepts unknown fields''
    and specifically noted ''a TOML file with tken = "secret" (a typo of "token")
    is silently accepted'' and recommended #[serde(deny_unknown_fields)].'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ... always true). The test was written by TEA and passed through dev and review
    without the logical flaw being caught.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test on default config. Reviewer noted
    a similar weakness in completion tests ('only checks it doesn't panic') but did
    not identify the config default test's let _ = config pattern with no assertions.
