- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase distinguished NotFound from parse/permission errors in from_file_or_default.
    The config_loading tests cover TOML loading and env overrides but never test that
    permission or parse errors propagate instead of falling back to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote CWE-209 security tests (security.rs:12 'server_error_display_sanitizes_internal_details').\
    \ Reviewer also flagged HIGH: 'ServerError stores raw server body accessible via\
    \ Debug \u2014 either redact the body, implement manual Debug, or document the\
    \ security constraint.' Same vulnerability class addressed."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote CRLF header injection tests for tenant ID (siem_client.rs,\
    \ listed under CWE-93). Reviewer flagged as LOW: 'tenant field is String not TenantId\
    \ \u2014 raw String tenant bypasses TenantId newtype validation.' Dev implemented\
    \ CRLF prevention in client.rs but kept raw String."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. The Cargo.toml changes added uuid and chrono but no reviewer
    or test checked for workspace dependency consistency.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged as MEDIUM: 'RawConfig silently accepts unknown\
    \ fields \u2014 config.rs:7-12 uses #[derive(Deserialize)] without #[serde(deny_unknown_fields)].\
    \ A TOML file with tken = \"secret\" (a typo) is silently accepted.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ... always true). TEA wrote the test but created the problem; no subsequent phase
    flagged it.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
