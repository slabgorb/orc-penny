- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The reviewer flagged Config Display swallowing diagnostic detail and the
    vacuous config test, but never identified that from_file_or_default uses unwrap_or_default()
    to swallow all error types including parse/permission failures. The vacuous test
    (is_ok() || is_err()) actually masks this issue rather than catching it.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[HIGH] CWE-209 \u2014 NotFound and ServerError leak\
    \ server response body to user' at error.rs:24,27 and client.rs:96-101, noting\
    \ raw server responses flow to the user's terminal. TEA also wrote security tests\
    \ for CWE-209 error exposure. Same vulnerability class (CWE-209 information exposure\
    \ via Display to stderr)."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[LOW] tenant CLI flag accepts raw String \u2014 not\
    \ validated as TenantId' at cli.rs:35, noting axiathon-core defines TenantId as\
    \ a validated newtype but the tenant value is passed as raw string. TEA also wrote\
    \ header injection tests for CRLF in tenant ID."
