findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default using unwrap_or_default() to swallow
    all error types. TEA wrote config loading tests but none specifically verify that
    parse/permission errors propagate rather than falling back to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote security tests specifically targeting CWE-209 (error detail
    leakage). Dev implemented CWE-209 safe Display. Reviewer verified ServerError
    and Unauthorized Display don't leak details. Same vulnerability class addressed
    across multiple phases.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'header injection via newlines in tenant/token'. Dev
    implemented sanitize_header_value for both token and tenant_id. Reviewer verified
    'CR/LF stripping is correctly applied to both token and tenant_id values. Prevents
    CWE-113.' The CWE-113 injection risk is mitigated via sanitization, though the
    type-safety improvement (using TenantId from axiathon-core) was not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F7: ''clap_complete, comfy-table, csv, dirs, reqwest, and toml
    are specified inline with version numbers rather than as workspace dependencies.
    The story spec says to add these to [workspace.dependencies].'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F4: 'RawConfig uses default serde deserialization, which silently\
    \ ignores unknown fields... If someone puts token = \"secret\" in the TOML, serde\
    \ silently drops it \u2014 no warning, no error. The #[serde(deny_unknown_fields)]\
    \ attribute should be used.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F4 flags vacuous test: ''the test is vacuous: it checks has_token_from_file()
    which is hardcoded to false.'' Same category of vacuous/always-passing test assertion
    in config_loading tests, adjacent location.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test that only checks non-panic via
    'let _ = config;'. The reviewer's vacuous test finding (F4) covers a different
    test, and no phase identified this specific missing-assertion issue.
