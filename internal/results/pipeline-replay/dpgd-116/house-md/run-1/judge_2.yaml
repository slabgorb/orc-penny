findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all error types. The
    reviewer flagged F5 (env override silently swallowed) which is adjacent but about
    a different method and different error path. No test specifically verifies that
    parse/permission errors in config file loading are surfaced rather than falling
    back to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: TEA wrote CWE-209 security tests. Dev implemented 'CWE-209 safe Display'
    on CliError. Reviewer verified ServerError Display shows only 'Server returned
    error (HTTP {code})' and Unauthorized shows only 'Permission denied'. Same vulnerability
    class addressed, though the Io(transparent) variant specifically may still leak.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote tests for 'header injection via newlines in tenant/token'. Dev
    implemented sanitize_header_value stripping CR/LF for both token and tenant_id.
    Reviewer verified 'CR/LF stripping is correctly applied to both token and tenant_id
    values. Prevents CWE-113.' The type-safety angle (using TenantId from axiathon-core)
    was not flagged, but the CWE-113 risk was mitigated via sanitization.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F7: ''clap_complete, comfy-table, csv, dirs, reqwest, and toml
    are specified inline with version numbers rather than as workspace dependencies.
    The story spec says to add these to [workspace.dependencies]. This means other
    crates can''t share version pins, risking version fragmentation across the workspace.'''
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F4: 'RawConfig uses default serde deserialization, which silently\
    \ ignores unknown fields... If someone puts token = \"secret\" in the TOML, serde\
    \ silently drops it \u2014 no warning, no error. The #[serde(deny_unknown_fields)]\
    \ attribute should be used, or at minimum a warning should be emitted.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F4 identifies vacuous test assertions in config_loading.rs:
    ''the test is vacuous: it checks has_token_from_file() which is hardcoded to false.''
    Same category of vacuous/always-true test assertions in config test files, adjacent
    location.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test that only checks non-panic with
    'let _ = config;'. The reviewer identified other test quality issues but not this
    specific pattern of a test with no assertions on the default config's return values.
