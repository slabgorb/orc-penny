- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed error discrimination in from_file_or_default. TEA tests
    cover TOML loading but not distinguishing NotFound from parse/permission errors.
    Dev implemented config without this distinction. Reviewer did not flag it.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA's security_test.rs explicitly lists CWE-209 coverage. The test plan
    includes 7 security tests covering 'CWE-209, CRLF header injection, silent error
    prevention.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #4: ''--tenant accepts raw String instead of validated
    TenantId newtype. cli.rs:32 declares pub tenant: Option<String>... Similarly,
    SiemClient.tenant at client.rs:11 stores Option<String> instead of Option<TenantId>.'''
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: 'No phase flagged direct version strings vs workspace = true. The reviewer
    noted the toml version mismatch (finding #5) but not the workspace dependency
    pattern issue.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer finding #17 marks as 'VERIFIED' that 'Config file does not store\
    \ tokens \u2014 no token field in ClientConfig' and finding #9 notes serde silently\
    \ ignores unknown keys 'which is correct.' The reviewer reached the opposite conclusion\
    \ from the ground truth \u2014 they deemed silent field ignoring acceptable rather\
    \ than flagging the risk of users believing they're authenticated."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #9 flags vacuous tests in config_test.rs, and finding
    #10 flags ''assert!(true)'' as vacuous. Same category of vacuously true assertions
    identified across multiple tests, demonstrating detection capability for this
    class of issue.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #9: 'config_test.rs:132-150 \u2014 the test loads a\
    \ config with token and api_token keys, then does let _ = config. It never actually\
    \ asserts that no token value was loaded... the test proves nothing because it\
    \ has no assertion.'"
