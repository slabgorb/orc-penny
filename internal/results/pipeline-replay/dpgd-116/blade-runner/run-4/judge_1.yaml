- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all error types
    via unwrap_or_default(). Config tests cover loading and precedence but never test
    that parse errors or permission errors are distinguished from NotFound.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F5 flags exactly this: \"CliError::Config Display exposes inner\
    \ string \u2014 error.rs:30-31. The {0} interpolation exposes the raw inner string...\
    \ can include filesystem paths. This violates that contract.\" TEA also wrote\
    \ CWE-209 security tests, and Dev hardened ServerError Display, but Config variant\
    \ was left leaking."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote header injection tests in security.rs (CWE-113). Dev implemented
    HeaderValue::from_str validation to reject CRLF. Reviewer flagged F4 noting the
    protection is implicit. Same vulnerability class (CWE-113) addressed, though none
    flagged the specific issue of using raw String instead of TenantId from axiathon-core.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned that dependencies use direct version strings instead
    of workspace = true. The code changes summary shows Cargo.toml was modified but
    only to add the env feature to clap.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F8: "ConfigFile silently ignores unknown fields... A user adding
    token = ''secret'' to their config gets no warning. Consider adding #[serde(deny_unknown_fields)]
    or at minimum logging a warning." This matches the ground truth about secret tokens
    being silently ignored.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F2 flags a vacuous tautological assertion: \"assert!(result.is_err()\
    \ || result.is_ok()) \u2014 This is a tautology \u2014 Result is always Ok or\
    \ Err. The test always passes regardless of behavior.\" Same category of vacuously\
    \ true assertion as the ground truth's is_none() || true pattern."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F7: \"URL validation test asserts nothing \u2014 security.rs:209-215.\
    \ This test does nothing if the config loads successfully \u2014 it reads server_url()\
    \ into _url and drops it. There's no assertion... It silently passes whether validation\
    \ works or not.\" Same category of zero-assertion test."
