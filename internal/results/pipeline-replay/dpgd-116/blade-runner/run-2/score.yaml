- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer V2 explicitly examines this code and concludes it is CORRECT:\
    \ 'Token never loaded from TOML file... Security contract is met.' This is the\
    \ opposite conclusion \u2014 the ground truth says silently ignoring a user's\
    \ token field is a problem (secret left on disk, user believes they're authenticated).\
    \ Per strict rules, opposite conclusion means not caught."
