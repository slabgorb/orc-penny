- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all errors via
    unwrap_or_default(). TEA config tests cover env overrides and precedence but not
    error-type discrimination. Reviewer F9 mentions a fallback path issue but not
    the broader error-swallowing pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F5 flags 'ServerError Display leaks server response body \u2014\
    \ CWE-209 risk' at error.rs:23. TEA also included 'CWE-209: Error display doesn't\
    \ leak server URLs or stack traces' as a security test. Same vulnerability class\
    \ (CWE-209 information exposure) identified, different instance."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F6 flags 'Header injection defense is implicit, not explicit\
    \ \u2014 client.rs:85-90' citing CWE-113, noting tenant and token values passed\
    \ directly to req.header() without validation. TEA also wrote header injection\
    \ prevention tests. However, neither phase specifically flags that tenant_id should\
    \ use TenantId from axiathon-core instead of raw String \u2014 the type-safety\
    \ dimension is missed, but the vulnerability class is caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentions that 6 dependencies use direct version strings instead
    of workspace = true. The Cargo.toml changes are listed but workspace dependency
    consistency is never checked.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer V2 examines the exact code (RawConfig token field, from_raw()\
    \ hardcoding api_token: None) but concludes 'Security contract is met.' This is\
    \ the opposite conclusion \u2014 the ground truth says silently ignoring a user's\
    \ token config is a problem (user thinks they're authenticated, secret left on\
    \ disk). Per strict rules, examining code and reaching the wrong conclusion does\
    \ not count."
