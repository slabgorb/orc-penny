- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: CliError::Display must not leak server
    internals or tokens'' as a security test. Reviewer also flagged ''[HIGH] CliError::ServerError
    Display leaks internal details (CWE-209)'' noting Debug exposure risk.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection: tenant/token values with \r\n
    must not inject headers'' and Dev implemented CRLF sanitization in with_tenant().
    Same vulnerability class (CWE-113) addressed, though the type-safety fix of using
    TenantId instead of raw String was not implemented.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] Workspace Cargo.toml missing Story 6.1 dependencies'
    noting 'they are declared only as direct dependencies in the crate's Cargo.toml.
    This violates the workspace dependency management pattern.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Pipeline designed tokens to come from keychain only and verified 'Config\
    \ does not store/expose tokens', but never addressed serde silently ignoring unknown\
    \ fields. A user putting token in config gets no warning \u2014 the deny_unknown_fields\
    \ fix was never considered."
