findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: The reviewer flagged silent AXIATHON_TIMEOUT env var handling but never
    identified that from_file_or_default swallows all errors (parse, permission, I/O)
    via unwrap_or_default. No test was written to distinguish NotFound from other
    error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: CliError::Display must not leak server
    internals or tokens'' as a security test. Reviewer also flagged ''[HIGH] CliError::ServerError
    Display leaks internal details (CWE-209)'' noting Debug impl exposes internal
    details.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection: tenant/token values with \r\n
    must not inject headers''. Dev implemented CRLF sanitization in with_token() and
    with_tenant(). Same vulnerability class (CWE-113 header injection) was addressed,
    though the type-safety aspect of using TenantId instead of raw String was not
    flagged.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] Workspace Cargo.toml missing Story 6.1 dependencies'
    noting they are 'declared only as direct dependencies in the crate's Cargo.toml'
    which 'violates the workspace dependency management pattern established by the
    project.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'The pipeline designed config without a token field and verified ''Config
    does not store/expose tokens'', but never addressed serde silently ignoring unknown
    fields. No mention of #[serde(deny_unknown_fields)] or warning on unrecognized
    keys. A user putting token in config would still have it silently ignored with
    their secret on disk.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert!(config.server().is_none()
    || ...)). The TEA wrote the test containing this flaw and neither dev nor reviewer
    caught the vacuous logic.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test (let _ = config with no assert).
    TEA wrote this test and neither dev nor reviewer flagged the absence of meaningful
    assertions.
