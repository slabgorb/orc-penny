findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No test or code addresses distinguishing NotFound from parse/permission
    errors in from_file_or_default. The reviewer flagged silent AXIATHON_TIMEOUT handling
    but not the broader unwrap_or_default swallowing all error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: CliError::Display must not leak server
    internals or tokens'' as a security test. Reviewer also flagged [HIGH] ''ServerError
    inner string leakage risk'' noting Debug impl exposes internal details.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote header injection tests: ''Header injection: tenant/token values
    with \r\n must not inject headers.'' Dev implemented CRLF sanitization in with_token()
    and with_tenant(). Same vulnerability class CWE-113, though the type-safety aspect
    (using TenantId from axiathon-core) was not addressed.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [MEDIUM] 'Workspace Cargo.toml missing Story 6.1 dependencies\
    \ \u2014 they are declared only as direct dependencies in the crate's Cargo.toml.\
    \ This violates the workspace dependency management pattern.'"
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'TEA tested ''tokens must NOT be loadable from config file (keychain only)''
    which validates the design decision but does not test that unknown fields like
    token are rejected or warned about. No use of #[serde(deny_unknown_fields)] or
    unknown-field detection was written or flagged.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: The vacuously true assertion pattern (is_none() || ...) was not identified
    by any phase. The pipeline wrote these tests and no phase flagged the logical
    flaw.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: The zero-assertion test pattern (let _ = config with no assert) was not
    identified by any phase. The pipeline created these tests without catching that
    they assert nothing.
