- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote CWE-209 tests: 'Error Display must not leak internal IPs, ports,\
    \ or file paths.' Reviewer verified: 'ServerError Display says \"server error:\
    \ please try again later\" \u2014 does not expose the inner string.' However,\
    \ the ground truth is about stderr exposure via eprintln, and the reviewer marked\
    \ CWE-209 as VERIFIED (correct), not flagging the eprintln leak path. TEA tested\
    \ the Display impl sanitization which is the same vulnerability class."
