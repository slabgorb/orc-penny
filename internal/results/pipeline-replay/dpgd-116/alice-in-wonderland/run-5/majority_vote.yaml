- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "Reviewer flagged [LOW]: '--tenant accepts raw String, not TenantId newtype\
    \ \u2014 cli.rs:39. Per .claude/rules/rust.md: Newtypes for IDs: TenantId(String)\
    \ \u2014 prevents mixing ID types. The --tenant flag accepts Option<String> rather\
    \ than using the TenantId newtype from axiathon-core. Similarly, SiemClient::new\
    \ takes Option<&str> for tenant_id. This weakens type safety at the boundary.'\
    \ TEA also listed CRLF injection in security coverage."
  votes: 3/3
