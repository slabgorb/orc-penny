- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all errors. The
    config_handles_missing_file test is itself tautological (is_ok || is_err), and
    no test distinguishes NotFound from parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer verified: 'Error Display messages in error.rs do not expose\
    \ internal details (CWE-209). ServerError shows \"please try again later\", not\
    \ the inner string.' However, the reviewer missed the Io(transparent) forwarding\
    \ issue. The Dev also implemented sanitized Display. Partial catch \u2014 the\
    \ transparent Io variant leaking OS details was not flagged."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: dev
  evidence: "Dev implemented CRLF/null byte sanitization in client.rs:23-27. TEA wrote\
    \ security tests for header injection (CWE-113). However, the underlying issue\
    \ \u2014 using raw String instead of TenantId from axiathon-core \u2014 was not\
    \ flagged. The sanitization is a mitigation, not the type-safe fix. Partial catch."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer verified workspace dependency declarations as correct, but the
    actual issue is that some deps in the crate Cargo.toml use direct version strings
    instead of workspace = true. No phase caught this.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer verified tokens are not loaded from file and noted RawConfig\
    \ lacks a token field so serde silently ignores it \u2014 but framed this as correct\
    \ behavior ('Correct per security requirements'). The actual risk \u2014 a user\
    \ believing their token config is active when it's silently ignored \u2014 was\
    \ not flagged. Dev even noted 'Config uses serde(default) on unknown fields (not\
    \ deny_unknown_fields) so token/api_token in TOML are silently ignored per security\
    \ requirement.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [HIGH]: 'config_handles_missing_file test is a tautology\
    \ \u2014 is_ok() || is_err() is always true for any Result. This test asserts\
    \ absolutely nothing.' Also flagged security tests with 'let _ = result' as vacuous."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [HIGH]: ''Four security tests construct a value and
    then do let _ = result... These tests assert nothing. The SiemClient::new does
    sanitize CRLF/null bytes (good!), but the tests never verify the sanitized value.
    They would pass even if the sanitization code were deleted.'''
