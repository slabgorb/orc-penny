  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "The reviewer flagged a vacuous test about missing config file handling\
    \ (config_loading.rs:71-74) but never identified the underlying from_file_or_default\
