- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: dev
  evidence: 'Dev implemented header injection prevention at client.rs:31,38. TEA wrote
    tests for ''Header injection: Tenant ID and token with \r\n rejected/sanitized.''
    Reviewer verified V1: ''Header injection prevention is correct at client.rs:31,38.''
    The exploit is prevented via runtime validation, though the type-safety approach
    (using TenantId) was not adopted.'
