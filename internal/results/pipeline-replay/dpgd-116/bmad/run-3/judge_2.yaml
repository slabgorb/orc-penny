- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'F6 flags CWE-209: ''Http(#[from] reqwest::Error) with #[error("HTTP error:
