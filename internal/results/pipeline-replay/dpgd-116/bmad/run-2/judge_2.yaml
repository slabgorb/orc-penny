- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Neither TEA tests nor Dev implementation nor Reviewer flagged the silent
    swallowing of non-NotFound errors in from_file_or_default. The reviewer flagged
    M2 (silent env var parse failure) but not the broader from_file_or_default issue.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer H2 explicitly flags CWE-209: ''main.rs:22 prints these via eprintln!("Error:
    {e}")... The error.rs doc comment explicitly warns Display output is for internal
    logging only... but main.rs violates this by printing Display output directly.
    Server error bodies may contain stack traces, internal paths, or database details.'''
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer H1 flags CWE-113 header injection: ''with_tenant/with_token
    accept arbitrary strings with no validation. A tenant ID containing non-ASCII
    or non-visible characters could bypass reqwest checks.'' Reviewer M5 also flags
    that --tenant flag should use TenantId newtype from axiathon-core.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the use of direct version strings instead of workspace
    = true for the 6 dependencies. The pipeline did not catch this finding.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer M1 explicitly flags: ''ClientConfig derives Deserialize without
    #[serde(deny_unknown_fields)]. A config file with api_ulr = "..." (typo) will
    be silently accepted, and the user gets the default with no warning.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the vacuously true assertion assert!(config.server().is_none()
    || ...) where the first branch always passes. Neither TEA tests, Dev implementation,
    nor Reviewer identified this specific vacuous assertion.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
