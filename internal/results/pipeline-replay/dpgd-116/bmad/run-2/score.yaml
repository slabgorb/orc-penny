- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer H2 flagged CWE-209: ''main.rs:22 prints these via eprintln!("Error:
    {e}"). The error.rs doc comment explicitly warns Display output is for internal
    logging only. Sanitize before showing to end users but main.rs violates this by
    printing Display output directly.'''
