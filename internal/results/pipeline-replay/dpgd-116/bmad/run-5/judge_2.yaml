- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Neither TEA, Dev, nor Reviewer flagged that from_file_or_default swallows
    all error types including parse/permission failures. The reviewer noted unwrap_or_default()
    in client.rs response body reading, but not the config loading silent fallback.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [CRITICAL] CWE-209: ''handle_response passes the raw
    HTTP response body directly into CliError variants... A server-side stack trace,
    internal path, database connection string... will be printed to the operator''s
    terminal.'' Same CWE-209 class, explicitly called out.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [HIGH]: 'tenant CLI flag accepts raw String, not validated\
    \ TenantId \u2014 CWE-113 header injection. The --tenant flag is Option<String>,\
    \ and this raw string flows directly into SiemClient::default_headers(). No validation,\
    \ no newtype. Fix: Introduce a TenantId newtype with validated constructor.'"
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Neither TEA, Dev, nor Reviewer flagged that 6 dependencies use direct
    version strings instead of workspace = true. The reviewer flagged tempfile as
    a LOW finding but that's a dev-dependency; the 6 production deps (clap_complete,
    comfy-table, csv, dirs, reqwest, toml) using direct versions were not flagged.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged [HIGH]: 'Config silently ignores unknown TOML fields\
    \ \u2014 ClientConfig uses #[serde(default)] but does not use #[serde(deny_unknown_fields)].\
    \ A user who typos server_url as server_uri gets no warning.' Exact match to the\
    \ ground truth finding."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the vacuously true assertion assert!(config.server().is_none()
    || ...) where the first branch always passes. The reviewer noted subcommand help
    tests are assertion-free but did not catch this specific vacuous OR pattern.
- finding_id: I6
