- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged M3: 'CWE-209: Server error details leaked to stderr'\
    \ \u2014 same vulnerability class (CWE-209 information exposure via error Display).\
    \ The reviewer noted that CliError details are printed verbatim to stderr and\
    \ that internal details leak contrary to stated security policy."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged M1: 'CWE-113: No validation on tenant ID passed as HTTP\
    \ header' \u2014 tenant_id field is Option<String> and should use validated TenantId\
    \ newtype per rust.md conventions. Exact match to the ground truth finding."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Neither TEA, Dev, nor Reviewer flagged that clap_complete, comfy-table,
    csv, dirs, reqwest, and toml use direct version strings instead of workspace =
    true. H3 flagged unused deps but not the version drift issue.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
