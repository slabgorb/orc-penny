- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev implemented config loading that silently returns defaults on all errors
    ('empty server_url fallback, unknown fields ignored'). No distinction between
    NotFound and other error types. Reviewer did not flag this. TEA tests did not
    address error discrimination in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flagged CWE-209: ''Server response bodies leak to
    user. map_status() passes raw server response body into CliError variants. main.rs:13
    prints these to stderr. Server stack traces, internal paths, and PII in error
    responses reach the operator.'' Marked HIGH SEC, blocking.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote a dedicated security.rs test file covering 'CWE-113, header\
    \ injection' with 10 tests. Dev also noted 'CWE-113 header injection prevention'\
    \ in client.rs implementation. Reviewer confirmed the assert checks CR/LF. The\
    \ ground truth is about using raw String instead of TenantId type \u2014 the pipeline\
    \ caught the header injection risk class (same CWE-113) even if the fix used asserts\
    \ rather than type-safe TenantId."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev explicitly added direct version strings for clap_complete, comfy-table,
    csv, dirs, reqwest, toml in Cargo.toml rather than using workspace = true. No
    TEA test or reviewer finding flagged workspace dependency drift.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
