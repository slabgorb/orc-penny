- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: 'TEA wrote `config_rejects_invalid_toml` and `config_invalid_timeout_env_returns_error`
    tests under Rule #1 (silent errors). These tests expect errors on invalid input
    rather than silent fallback to defaults, which would fail against an `unwrap_or_default()`
    implementation that swallows all errors.'
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote `cli_error_server_error_display_does_not_expose_internals` test
    for CWE-209. Dev implemented CWE-209 safe Display on CliError. Reviewer further
    flagged Unauthorized/NotFound variants as CWE-209 partial violations at error.rs:19,22.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote `siem_client_rejects_tenant_id_with_newlines` and `siem_client_rejects_token_with_newlines`
    tests for CWE-113 header injection. Dev implemented HeaderValue::from_str() validation
    at client.rs:62. Reviewer verified CWE-113 prevention.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: dev
  evidence: "Dev added all dependencies using `{ workspace = true }` in Cargo.toml.\
    \ Reviewer verified: 'All workspace deps compliant \u2014 Cargo.toml uses { workspace\
    \ = true } for all shared deps. Complies with lang-review #11.'"
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer''s devil''s advocate section explicitly identifies the issue:
    ''they also typo their config file with api_ulr... no error, the default http://localhost:8080
    is silently used. The TOML parser accepts unknown fields by default, which is
    serde''s behavior, but it means config file typos are invisible.'' This matches
    the ground truth about needing #[serde(deny_unknown_fields)].'
