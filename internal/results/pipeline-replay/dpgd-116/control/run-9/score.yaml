findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase addressed from_file_or_default swallowing all errors. TEA config
    tests cover loading/precedence but not error discrimination between NotFound and
    parse/permission failures. Reviewer flagged silent ignoring of unknown fields
    (F7) and unparseable timeout (F8) but not the broader unwrap_or_default swallowing
    all error types.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote security tests for ''Error messages not leaking internal paths
    (CWE-209)'' and ''CWE-209 error exposure''. Dev implemented ''CWE-209 safe Display''.
    Reviewer verified V3: ''Display impls show generic user-facing messages, not internal
    details.'' Same vulnerability class addressed even if transparent Io forwarding
    may remain as a residual gap.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Header injection via newlines in token/tenant ID
    (CWE-113)''. Dev implemented CRLF rejection in client.rs:34-62. Reviewer verified
    V2: ''Rejects \r and \n in tokens and tenant IDs.'' Same vulnerability class (CWE-113)
    caught, though the deeper type-safety fix (using TenantId from axiathon-core)
    was not flagged.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged direct version strings instead of workspace = true. Reviewer
    F9 noted a toml version mismatch (0.8 vs 0.9) but did not identify the broader
    pattern of 6 deps bypassing workspace dependency declarations.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F7: ''RawConfig silently ignores unknown fields including typos...
    Consider at least a log warning for unknown fields, or use #[serde(deny_unknown_fields)]
    for fail-fast behavior.'' Directly matches the ground truth finding about token
    field being silently ignored.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F10 flagged a vacuous test: ''siem_client_validates_server_url_scheme...
    it never verifies non-http schemes are rejected. This is a vacuous test that proves
    nothing about validation.'' Same category (vacuously true test) identified in
    a different test, demonstrating detection capability per partial match rule 2.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase flagged the zero-assertion test using 'let _ = config;'. Reviewer
    identified vacuous tests (F10) but specifically about URL scheme validation, not
    about the config default test with no assertions.
