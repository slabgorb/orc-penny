findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev implemented load_from() that propagates errors, and load_default()
    uses from_file_or_default pattern. However, the pipeline never flagged that the
    from_file_or_default/unwrap_or_default approach swallows ALL error types including
    parse and permission errors. Reviewer VERIFIED config loading but did not flag
    distinguishing NotFound from other errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer confirmed HIGH SEC finding: ''CWE-209: CliError::General echoes
    raw reqwest errors to users. client.rs:70 passes e.to_string() to CliError::General,
    and error.rs:13 displays it via #[error("error: {0}")]. TLS errors, DNS details,
    and internal URLs could leak.'' This matches the ground truth finding about CWE-209
    info leakage.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote CRLF header injection tests in tests/siem_client.rs covering
    tenant_id and token with \r\n. Reviewer also confirmed this as a HIGH SEC finding
    about header injection via CRLF. Though the tests had zero assertions (flagged
    as MEDIUM), the vulnerability class was caught.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev's summary says 'added workspace deps (reqwest, comfy-table, keyring,
    clap_complete, dirs, csv, toml)' but the ground truth finding is that these 6
    deps use direct version strings instead of workspace = true. The Reviewer design
    deviations and no other phase flagged workspace dependency drift. No phase caught
    this.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "The ground truth finding is that serde silently ignores unknown fields,\
    \ so a user putting token in config believes they're authenticated when they're\
    \ not. Reviewer's Devil's Advocate mentioned 'a confused user adds token = sk-...\
    \ to their cli.toml' and noted 'serde(default) and no deny_unknown_fields, the\
    \ token string is silently ignored' but concluded this is 'acceptable behavior\
    \ (tokens go in keychain per AC-8), but a warning would be better.' The reviewer\
    \ examined the exact scenario and reached the wrong conclusion \u2014 dismissing\
    \ it as acceptable. Score: not caught."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer confirmed MEDIUM TEST finding: ''CWE-209 security tests give
    false confidence. Tests at error_exit_codes.rs:106-124 test Config and ServerError
    variants but never test General.'' While the exact finding is about a vacuous
    is_none() || true assertion, the pipeline caught the same category (vacuously
    true/misleading test assertions providing false confidence). The reviewer explicitly
    identified the test-analyzer finding about ''zero-assertion on CRLF injection
    tests'' and vacuous patterns.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer confirmed via test-analyzer finding: 'Zero-assertion on cli_derives_clap_parser'\
    \ and explicitly called out 'CWE-209 security tests give false confidence \u2014\
    \ tests never test General (which is the vulnerable one). The test suite claims\
    \ CWE-209 coverage but misses the actual vulnerability.' Also the silent-failure-hunter\
    \ confirmed 'Zero-assertion test' pattern as HIGH. The ground truth finding about\
    \ a test with zero assertions (only checks non-panic, let _ = config) matches\
    \ the pipeline's confirmed findings about zero-assertion tests."
