- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev implemented load_from() with proper error propagation and load_default()
    separately, but the pipeline output does not mention distinguishing NotFound from
    other errors in from_file_or_default/unwrap_or_default pattern. The reviewer verified
    'Config loading works' but did not flag the silent swallowing of parse/permission
    errors specifically.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged HIGH finding: ''CWE-209: CliError::General echoes raw
    reqwest errors to users. client.rs:70 passes e.to_string() to CliError::General,
    and error.rs:13 displays it via #[error("error: {0}")]. Contradicts the SECURITY
    doc comment. TLS errors, DNS details, and internal URLs could leak.'''
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote tests in siem_client.rs covering 'header injection, CRLF injection'\
    \ (AC-7). Reviewer also confirmed CRLF injection finding: 'CRLF in headers (confirmed\
    \ HIGH \u2014 no validation exists)' and flagged that tenant_id uses raw String\
    \ without TenantId type from axiathon-core (type-design subagent deferred stringly-typed\
    \ tenant_id). Partial match: same CWE-113 vulnerability class caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev explicitly added dependencies using direct version strings in Cargo.toml
    rather than workspace = true. The pipeline output states 'added workspace deps
    (reqwest, comfy-table, keyring, clap_complete, dirs, csv, toml)' but the code
    changes summary shows crates/axiathon-client/Cargo.toml with direct deps. No finding
    was raised about version drift or missing workspace = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "TEA wrote a test 'config_has_no_token_field' that passes because the\
    \ struct lacks a token field. The reviewer's Devil's Advocate section mentions\
    \ 'a confused user adds token = sk-... to their cli.toml' and that serde silently\
    \ ignores it, but concludes 'This is acceptable behavior (tokens go in keychain\
    \ per AC-8), but a warning would be better.' The pipeline examined this exact\
    \ scenario and reached the wrong conclusion \u2014 it did not flag the missing\
    \ #[serde(deny_unknown_fields)] as a defect."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer's test-analyzer subagent confirmed: 'Zero-assertion on cli_derives_clap_parser\
    \ (dismissed \u2014 compile-time verification is valid)' and flagged 'Vacuous\
    \ is_ok() || is_help_error() pattern (deferred LOW)'. More directly, the reviewer\
    \ flagged the CWE-209 test false confidence pattern. The test-analyzer finding\
    \ about vacuous OR always passes matches the ground truth pattern of 'assertion\
    \ is None || true'. Same category, adjacent instance \u2014 caught."
- finding_id: I6
