- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Dev implemented config.rs with load_from() that propagates errors, and\
    \ load_default() uses a separate path. However, neither TEA nor Dev distinguished\
    \ NotFound from other errors in from_file_or_default \u2014 the pipeline never\
    \ flagged this specific silent error swallowing pattern. Reviewer verified config\
    \ loading as correct."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged HIGH finding: ''CWE-209: CliError::General echoes raw
    reqwest errors to users. client.rs:70 passes e.to_string() to CliError::General,
    and error.rs:13 displays it via #[error("error: {0}")]. TLS errors, DNS details,
    and internal URLs could leak.'' Also flagged that CWE-209 tests give false confidence
    by not testing the General variant.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CRLF header injection tests in tests/siem_client.rs: ''CRLF
    injection: Tenant ID and token with \r\n (AC-7)''. Reviewer also confirmed CRLF
    finding as HIGH. Partial match applies: same CWE-113 vulnerability class (header
    injection via unvalidated string) was caught, though the ground truth specifically
    mentions missing TenantId type from axiathon-core.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: true
  caught_by: dev
  evidence: "Dev explicitly noted in Files Changed: 'Cargo.toml \u2014 added workspace\
    \ deps (reqwest, comfy-table, keyring, clap_complete, dirs, csv, toml)' \u2014\
    \ Dev used workspace dependencies. The ground truth finding is that 6 deps use\
    \ direct versions instead of workspace = true; Dev's implementation used workspace\
    \ deps, avoiding the issue."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'The pipeline never flagged that serde silently ignores unknown fields
    (including a hypothetical token field) nor suggested #[serde(deny_unknown_fields)].
    Dev''s devil''s advocate noted ''token string is silently ignored'' but framed
    it as acceptable behavior, not a security finding requiring a fix.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer's test-analyzer subagent flagged 'Vacuous is_ok() || is_help_error()\
    \ pattern (deferred LOW)' \u2014 same vacuously-true OR pattern. However, the\
    \ reviewer ultimately deferred this as LOW and concluded 'the logic is correct.'\
    \ Applying partial match rule: same category (vacuous test with OR pattern that\
    \ always passes), adjacent location. Scored as caught despite wrong conclusion\
    \ on that specific instance \u2014 the pipeline demonstrated awareness of vacuous\
    \ OR patterns in tests."
- finding_id: I6
