  caught: false
  caught_by: null
  evidence: 'Dev explicitly added direct version strings to Cargo.toml: ''Added all
    required dependencies'' to crates/axiathon-client/Cargo.toml. The reviewer''s
    ''[VERIFIED] Config token exclusion'' section examined config but no phase flagged
    the workspace dependency drift issue. The ground truth finding about 6 deps using
    direct versions instead of workspace = true was not caught.'
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Pipeline reached opposite conclusion. Reviewer '[VERIFIED] Config token\
    \ exclusion \u2014 ClientConfig has only server_url and timeout_seconds fields.\
    \ No token field. Serde ignores unknown TOML keys by default, so a token = ...\
    \ in the file is silently dropped.' This examines the exact issue but concludes\
    \ the behavior is acceptable, missing that silent discard of a secret field is\
    \ the problem \u2014 user believes they're authenticated when they're not. No\
    \ test for #[serde(deny_unknown_fields)] or warn-on-unknown behavior."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged '[MEDIUM] [TEST] Tautological assertion \u2014\
    \ config_loading.rs:44-47': 'assert!(config.server_url.is_none() || config.server_url.is_some(),\
    \ ...) \u2014 This is true || false or false || true \u2014 always true. The test\
    \ can never fail. Should assert config.server_url.is_none() specifically.' Also\
    \ listed in Delivery Findings."
