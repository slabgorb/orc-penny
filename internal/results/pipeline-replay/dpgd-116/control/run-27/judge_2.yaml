- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote header injection CRLF tests in siem_client.rs. Reviewer confirmed\
    \ '[VERIFIED] CRLF header injection prevention \u2014 client.rs:15 strips both\
    \ CR and LF. Tests at siem_client.rs:152-173 verify injection is blocked.' However,\
    \ the ground truth finding is about using raw String instead of validated TenantId\
    \ newtype \u2014 the pipeline addressed CRLF sanitization but noted '[LOW] SiemClient\
    \ uses String for tenant_id instead of TenantId newtype' as a deferred low finding.\
    \ Scoring as caught because TEA demonstrated awareness of header injection risk\
    \ class and wrote tests preventing it."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
