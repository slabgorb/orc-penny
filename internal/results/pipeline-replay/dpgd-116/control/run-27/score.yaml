- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Dev implemented config loading with graceful handling of missing files\
    \ (Ok(default) at config.rs:25) but did not distinguish NotFound from other error\
    \ types. Reviewer noted missing file \u2192 Ok(default) as verified behavior without\
    \ flagging the failure to distinguish error types."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer explicitly verified 'CliError Display impl uses generic messages\
    \ (error.rs:13-38)' and 'Error messages don't echo raw bodies' as CORRECT. Reviewer-security\
    \ dismissed CWE-209 findings as out of scope or LOW. The pipeline reached the\
    \ opposite conclusion \u2014 treating the generic error display as a security\
    \ positive rather than identifying the Io(#[error(transparent)]) leaking OS details."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA included 'Header injection: CRLF in token/tenant_id must be rejected\
    \ (siem_client.rs)' as a security test. Dev implemented CRLF sanitization. However,\
    \ the ground truth finding is about using raw String instead of TenantId newtype\
    \ \u2014 the Reviewer flagged this as LOW finding '[LOW] [TYPE] SiemClient uses\
    \ String for tenant_id instead of TenantId newtype'. Per partial match rules,\
    \ same vulnerability class (header injection / type-safe tenant isolation) caught."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added dependencies using direct version strings in crates/axiathon-client/Cargo.toml
    and added them to Cargo.toml workspace. No phase flagged that these deps should
    use workspace = true references instead of direct version strings. Reviewer did
    not flag version drift risk.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer verified '[VERIFIED] Config token exclusion \u2014 evidence:\
    \ ClientConfig at config.rs:11-14 has only server_url and timeout_seconds fields.\
    \ No token field. Serde ignores unknown TOML keys by default, so a token = \"\
    ...\" in the file is silently dropped.' This is exactly the opposite conclusion\
    \ \u2014 the Reviewer examined the code and concluded it was CORRECT behavior,\
    \ not flagging that a user believing they've authenticated via config token is\
    \ silently ignored. Score as not caught per 'Opposite conclusion' rule."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] [TEST] Tautological assertion \u2014 config_loading.rs:44-47'\
    \ noting 'assert!(config.server_url.is_none() || config.server_url.is_some()...)\
    \ is true || false or false || true \u2014 always true. The test can never fail.\
    \ Should assert config.server_url.is_none() specifically.' This matches the ground\
    \ truth finding of a vacuously true assertion."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] [TEST] Env var override tests never exercise
    override path' noting 'tests branch on std::env::var("AXIATHON_API_URL"). In a
    clean CI environment, the env var isn't set, so the tests always take the else
