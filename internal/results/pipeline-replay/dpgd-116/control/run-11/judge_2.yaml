- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all error types.
    The reviewer flagged silent ignoring of unknown TOML fields and silent env var
    parsing failures, but never addressed the from_file/unwrap_or_default pattern
    that swallows permission, parse, and I/O errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[MEDIUM] ConfigError Display leaks arbitrary user-controlled
    strings at error.rs:28-29' noting it passes through inner strings verbatim including
    file paths and TOML parse errors. TEA also wrote security tests for 'CWE-209 display
    sanitization.' Same vulnerability class (CWE-209) caught.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: Reviewer flagged '[HIGH] with_token()/with_tenant() bypass header injection
    validation at client.rs:39-42' identifying CWE-113 risk on tenant. TEA also wrote
    tests for 'header injection prevention' in siem_client_tests.rs. Same vulnerability
    class on the same component, though the specific fix (use TenantId type) was not
    mentioned.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Reviewer marked '[VERIFIED] Workspace dependencies correctly declared\
    \ at Cargo.toml:11-51' \u2014 this verified the root workspace declarations exist\
    \ but did not check that the crate-level Cargo.toml uses 'workspace = true' references\
    \ instead of direct version strings."
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged '[MEDIUM] RawConfig silently ignores unknown fields\
    \ at config.rs:13-17' and explicitly noted: 'The test client_config_ignores_token_field_in_toml\
    \ passes precisely because of this \u2014 it silently drops the token field rather\
    \ than warning the user.' Recommended #[serde(deny_unknown_fields)]."
- finding_id: I5
