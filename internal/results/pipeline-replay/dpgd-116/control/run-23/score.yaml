findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Dev implemented from_file() with 'graceful missing-file handling' but\
    \ the ground truth finding is about swallowing ALL errors (parse, permission,\
    \ etc.) vs only NotFound. The reviewer VERIFIED 'TOML parse errors are surfaced,\
    \ not swallowed; missing files degrade gracefully' \u2014 suggesting the implementation\
    \ may actually handle this correctly \u2014 but no explicit test or finding addresses\
    \ the NotFound-vs-other-errors distinction. The reviewer's VERIFIED item suggests\
    \ parse errors ARE surfaced, which would mean the bug doesn't exist in the implementation,\
    \ but the ground truth finding about distinguishing error types was never explicitly\
    \ flagged or tested."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "The reviewer VERIFIED 'CWE-209: error Display impls don't leak tokens,\
    \ paths, or stack traces' \u2014 this is the opposite conclusion. The ground truth\
    \ finding says CliError Display DOES leak internal details via eprintln! and transparent\
    \ IO errors. The pipeline examined the exact concern and concluded it was correctly\
    \ handled, which is worse than not examining it."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote header injection security tests in siem_client_test.rs: ''Header
    injection prevention (CRLF, CR, LF, null byte in tenant ID)'' and Dev implemented
    validate_tenant_id() rejecting CR/LF/null/empty. The reviewer also flagged with_tenant()
    not calling validate_tenant_id() as HIGH finding [SEC][TYPE]. Same CWE-113 vulnerability
    class caught.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added workspace deps (dirs, toml) to Cargo.toml but the ground truth
    finding is that 6 deps (clap_complete, comfy-table, csv, dirs, reqwest, toml)
    use direct version strings instead of workspace = true. No phase explicitly flagged
    this version drift risk or tested for it.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flagged: ''ClientConfig uses #[derive(Deserialize)]
    without #[serde(deny_unknown_fields)]. Typos in config keys are silently ignored''
    as MEDIUM finding [SILENT], and listed it as a required fix in the REJECTED verdict.'
- finding_id: I5
