- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: "Dev implemented from_file() with graceful missing-file handling, and\
    \ Reviewer verified 'TOML parse errors are surfaced, not swallowed; missing files\
    \ degrade gracefully'. However, neither TEA nor Dev nor Reviewer flagged the specific\
    \ issue of distinguishing NotFound from other error types in from_file_or_default\
    \ \u2014 the finding is about silently swallowing ALL errors including permission\
    \ denied and parse errors, not just missing files."
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer explicitly verified 'CWE-209: error Display impls don't leak\
    \ tokens, paths, or stack traces' and listed it as [VERIFIED]. This is the opposite\
    \ conclusion \u2014 the reviewer examined the exact code and concluded it was\
    \ correct when the ground truth says it leaks internal details via Io(#[error(transparent)])\
    \ forwarding full OS error details. Scoring as not caught per the opposite-conclusion\
    \ rule."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote header injection prevention tests in siem_client_test.rs: ''Header
    injection prevention (CRLF, CR, LF, null byte in tenant ID)''. Dev implemented
    validate_tenant_id() rejecting CR/LF/null/empty. Reviewer confirmed [VERIFIED]
    ''Header injection validation rejects CR, LF, null, empty via validate_tenant_id()''.
    The underlying issue (raw String vs TenantId type) was caught as a security concern
    even if the fix differed from using axiathon-core''s TenantId.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added workspace deps for dirs and toml but added 6 dependencies (clap_complete,
    comfy-table, csv, dirs, reqwest, toml) using direct version strings in Cargo.toml
    rather than workspace = true. Neither TEA, Dev, nor Reviewer flagged version drift
    risk from not using workspace = true for these dependencies.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged [MEDIUM] ''ClientConfig uses #[derive(Deserialize)]
    without #[serde(deny_unknown_fields)]. Typos in config keys are silently ignored''
    and listed it as a blocking fix: ''Add #[serde(deny_unknown_fields)] to ClientConfig''.
    This directly addresses the ground truth finding about silent field ignorance,
    though the ground truth frames it around a token field specifically.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA included in config_loading_test.rs tests for 'malformed TOML not\
    \ silently ignored'. Reviewer also identified [MEDIUM] 'zero-assertion builder\
    \ tests' pattern. However, the specific vacuously-true assertion pattern (assert!(x.is_none()\
    \ || true)) \u2014 TEA's config tests were described as testing that malformed\
    \ TOML is not silently ignored, which is adjacent. The 'zero assertion' finding\
    \ was caught by reviewer for builder tests (same category, adjacent location)."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
