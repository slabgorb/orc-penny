- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote header injection tests in siem_client_test.rs: ''Header validation
    missing (5 tests): validate_tenant_id accepts CRLF, null, empty''. Dev implemented
    validate_tenant_id() rejecting CR/LF/null. Reviewer flagged that with_tenant()
    doesn''t call validate_tenant_id() as HIGH finding, and also flagged with_token()
    lacks CRLF validation.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added workspace deps for dirs and toml but used direct version strings
    ('dirs 6', 'toml 0.8') rather than workspace = true. No phase flagged the 6 existing
    deps (clap_complete, comfy-table, csv, dirs, reqwest, toml) using direct versions
    instead of workspace references.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged as MEDIUM: ''ClientConfig silently ignores unknown TOML
    fields (typo-prone)'' and required fix: ''Add #[serde(deny_unknown_fields)] to
    ClientConfig''. This directly addresses the ground truth finding about serde silently
    ignoring unknown fields including a token field.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
