- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer VERIFIED 'CWE-209: error Display impls don't leak tokens, paths,\
    \ or stack traces' \u2014 concluded this was correct. The ground truth finding\
