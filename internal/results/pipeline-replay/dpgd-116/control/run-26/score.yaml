- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No test or implementation distinguishes NotFound from other error types
    in from_file_or_default. The config loading implementation uses unwrap_or_default
    without error discrimination. Neither TEA tests nor Dev implementation nor Reviewer
    flagged this specific silent swallowing of non-NotFound errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Reviewer VERIFIED: 'Error display is CWE-209 safe \u2014 All Display\
    \ messages are static or contain only the caller-provided context string, never\
    \ internal state.' Dev implemented safe Display messages at error.rs:16-38. TEA\
    \ also wrote security tests for CWE-209 error exposure."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
