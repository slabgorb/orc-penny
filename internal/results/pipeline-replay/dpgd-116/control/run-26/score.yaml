    \ Type-design subagent also confirmed this at client.rs:11."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added direct version strings in Cargo.toml (clap_complete, comfy-table,
    csv, dirs, reqwest, toml) rather than using workspace = true. Neither TEA tests
    nor Reviewer flagged workspace dependency drift.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer examined the exact issue (config ignoring token field) but concluded\
    \ it is CORRECT/safe: 'ClientConfig has no token field; serde ignores unknown\
    \ keys by default \u2014 safe.' The ground truth says this is a bug (user puts\
    \ token in config believing they're authenticated, but it's silently ignored).\
    \ Pipeline reached opposite conclusion \u2014 examined the code and called it\
    \ safe when it's the problem."
