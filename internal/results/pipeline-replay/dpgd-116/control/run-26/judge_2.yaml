- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented ClientConfig with no token field: 'Config ignores token\
    \ field | config.rs:12 | ClientConfig has no token field; serde ignores unknown\
    \ keys by default \u2014 safe'. Reviewer verified this. However, the ground truth\
    \ says the issue is that serde SILENTLY ignores unknown fields and the user believes\
    \ they're authenticated \u2014 the pipeline concluded this is 'safe' (opposite\
    \ conclusion for the silent ignore risk). Applying partial match rule 4: pipeline\
    \ examined the exact code and concluded it is correct when the finding says silent\
    \ ignore is the problem."
