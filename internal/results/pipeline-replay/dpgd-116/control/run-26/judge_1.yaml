- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No evidence that the pipeline distinguished NotFound from other errors
    in from_file_or_default. Dev implemented config loading but no mention of error
    discrimination. Reviewer verified 'Config ignores token field' and HTTP URL validation
    but never flagged swallowed errors in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Reviewer verified: '[VERIFIED] Error display is CWE-209 safe \u2014 error.rs:16-38\
    \ \u2014 All Display messages are static or contain only the caller-provided context\
    \ string, never internal state'. Dev implemented safe Display messages in error.rs."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote security tests including 'Header injection prevention' in security.rs.\
    \ Dev implemented CRLF rejection in client.rs. Reviewer confirmed '[VERIFIED]\
    \ Header injection prevented \u2014 client.rs:59-70 \u2014 HeaderValue::from_str()\
    \ rejects CRLF'. However, the ground truth finding is specifically about using\
    \ raw String instead of TenantId type \u2014 the reviewer also flagged this as\
    \ [MEDIUM] TYPE finding: 'SiemClient.tenant_id uses raw String instead of TenantId\
    \ from axiathon-core'. Caught by reviewer as well."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No mention of workspace = true for dependencies anywhere in the pipeline
    output. Dev added deps to Cargo.toml but no indication they used workspace = true.
    Reviewer did not flag version drift risk.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "The pipeline verified 'Config ignores token field' because ClientConfig\
    \ has no token field (serde ignores unknown keys). However, the ground truth finding\
    \ is that a user BELIEVES they are authenticated when token is silently ignored\
    \ \u2014 requiring #[serde(deny_unknown_fields)] or a warning. The reviewer actually\
    \ concluded the current behavior is SAFE: '[VERIFIED] Config ignores token field\
    \ \u2014 ClientConfig has no token field; serde ignores unknown keys by default\
    \ \u2014 safe'. This is the opposite conclusion from the ground truth finding."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "Test-analyzer confirmed: 'config_loading.rs:125 tautological token test:\
    \ Confirmed as [LOW]. Tests that config.server_url is set after loading a file\
    \ with token field \u2014 but doesn't actually assert the token was discarded.'\
    \ This is the same category (vacuously true/tautological assertion) as the ground\
    \ truth I5 finding about assert!(config.server().is_none() || ...) always being\
    \ true."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
