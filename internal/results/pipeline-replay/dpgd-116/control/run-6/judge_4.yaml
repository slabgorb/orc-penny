    \ as correct, potentially missing the Io(transparent) gap \u2014 but the vulnerability\
    \ class was identified and tested."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
