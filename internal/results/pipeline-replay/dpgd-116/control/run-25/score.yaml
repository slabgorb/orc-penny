- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: 'No phase flagged that serde silently ignores unknown fields (missing
    #[serde(deny_unknown_fields)]) leading to a user believing token = ''...'' in
