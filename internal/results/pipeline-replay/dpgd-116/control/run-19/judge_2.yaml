- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: security.rs test file covers 'CWE-209' explicitly. TEA summary states
    'SiemClient header injection (CRLF) and token redaction' and security tests cover
    CWE-209/113/532. The same CWE-209 information exposure class was identified and
    tested.
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA explicitly states 'SiemClient needs custom Debug (redact token) and
    input sanitization (reject CRLF)' and security.rs covers CWE-113. Dev also implemented
    'CRLF sanitization' in client.rs. The header injection risk via raw String tenant_id
    was directly addressed.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
