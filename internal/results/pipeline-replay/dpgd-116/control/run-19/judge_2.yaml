  caught: false
  caught_by: null
  evidence: No mention of workspace = true dependency declarations anywhere in pipeline
    output. Neither TEA, Dev, nor Reviewer flagged direct version strings vs workspace
    inheritance.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
