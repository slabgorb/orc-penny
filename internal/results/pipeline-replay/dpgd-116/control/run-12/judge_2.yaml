findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: TEA explicitly listed 'Invalid TOML must error, not silently default'
    as a security test in config_loading.rs, demonstrating awareness that parse errors
    should not silently fall back to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA included ''CWE-209: Error messages not leaking internal paths/stack
    traces'' as a security test in exit_codes.rs. Reviewer #16 examined the Display
    impl but concluded it was correct (opposite conclusion), so credit goes to TEA
    for writing the test targeting the vulnerability class.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #7: '--tenant accepts raw String \u2014 not validated\
    \ as TenantId. Per rust.md: Newtypes for IDs... axiathon-core provides TenantId,\
    \ but --tenant accepts Option<String>.' TEA also wrote CWE-113 header injection\
    \ tests for tenant ID."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned workspace = true vs direct version strings. The reviewer
    did not flag the 6 dependencies using direct versions instead of workspace references.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #4: 'Config silently accepts unknown TOML fields \u2014\
    \ no #[serde(deny_unknown_fields)]. A typo like api-url or timout would be silently\
    \ ignored, and the user would get defaults without any warning.' Directly addresses\
    \ the silent field ignoring concern."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #13 flags 'Test config_handles_large_timeout_gracefully\
    \ has no assertion' and #14 flags 'Test unmapped_error_codes_still_produce_error\
    \ has no assertion \u2014 let _ = err does nothing.' Same category of vacuous\
    \ test detection per partial match rule #2."
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #13: 'the test assigns to _result with no assertion.\
    \ This is a vacuous test \u2014 it verifies no panic but doesn't check whether\
    \ the value was accepted or rejected.' Finding #14: 'let _ = err; does nothing...\
    \ the assertion is vacuous.' Both flag zero-assertion tests."
