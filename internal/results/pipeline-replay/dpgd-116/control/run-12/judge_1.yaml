- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: true
  caught_by: tea
  evidence: TEA security tests include 'Invalid TOML must error, not silently default'
    in config_loading.rs, which would fail if from_file_or_default silently swallows
    parse errors via unwrap_or_default().
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 info leakage check in exit_codes.rs (lines 111-131),
    verifying no /src/ paths or panic traces leak. Reviewer finding #16 also verified
    this. Same vulnerability class addressed.'
- finding_id: I2
