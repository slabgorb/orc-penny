findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all errors. TEA's 'silent
    error swallowing' tests only cover HTTP status codes, not config file loading
    errors. Reviewer did not examine this pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 tests: ''Error messages don''t leak stack traces, internal
    paths, or JWT tokens.'' Dev implemented ''CWE-209 safe Display.'' Reviewer verified
    V-4: ''CWE-209 error Display does not leak JWTs.'' Same vulnerability class caught.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F-11: 'tenant field is raw String, not TenantId newtype \u2014\
    \ cli.rs:32. Project Rust rules mandate newtypes for IDs. The axiathon-core crate\
    \ already defines TenantId.' TEA also wrote CWE-113 CRLF injection tests and Dev\
    \ implemented CRLF sanitization, but the core issue of using raw String instead\
    \ of TenantId was flagged by Reviewer."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer F-7 mentions version mismatches (dirs 5 vs 6, toml 0.8 vs 0.9)
    but does not flag the use of direct version strings instead of workspace = true.
    The ground truth issue is about 6 deps bypassing workspace dependency declarations,
    which no phase identified.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented 'deny_unknown_fields for security' on ClientConfig (config.rs:8).\
    \ Reviewer verified V-2: 'deny_unknown_fields on ClientConfig \u2014 rejects token/password\
    \ fields in TOML.' This directly prevents the silent ignore of unknown fields\
    \ like token."
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (is_none() ||
    ... always passes). The Reviewer examined tests but did not flag this specific
    test as vacuous. 142 tests passed without anyone noticing the tautological assertion.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test. The test with 'let _ = config;'
    and no assert statements was not flagged by TEA, Dev, or Reviewer. SOUL.md principle
    4 ('A vacuously true test is worse than no test') was not applied here.
