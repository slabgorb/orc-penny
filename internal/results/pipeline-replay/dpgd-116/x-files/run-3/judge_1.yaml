- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all errors. TEA's 'silent
    error swallowing' tests only cover HTTP status codes, not config file loading.
    Reviewer V-9 verified config validation but not error discrimination in from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly wrote CWE-209 tests: ''CWE-209: Error messages don''t
    leak stack traces, internal paths, or JWT tokens.'' Dev implemented CWE-209 safe
    Display with security doc comment. Reviewer V-4 verified ''CWE-209 error Display
    does not leak JWTs.'' Same vulnerability class addressed, though the specific
    Io(transparent) vector may still exist.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote CWE-113 CRLF injection tests for tenant ID headers. Dev implemented\
    \ CRLF sanitization in client.rs:23,30. Reviewer V-3 verified prevention and F-11\
    \ flagged 'tenant field is raw String, not TenantId newtype' \u2014 matching both\
    \ the injection and type-safety aspects of this finding."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer F-7 flagged version number mismatches (dirs 5 vs 6, toml 0.8
    vs 0.9) but did not flag that 6 dependencies use direct version strings instead
    of workspace = true. The workspace inheritance pattern issue was not identified.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: dev
  evidence: "Dev implemented #[serde(deny_unknown_fields)] on ClientConfig (config.rs:8).\
    \ Reviewer V-2 verified: 'deny_unknown_fields on ClientConfig \u2014 rejects token/password\
    \ fields in TOML.' TEA also tested: 'Credential storage: Config file must NOT\
    \ contain token/password fields.'"
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion (assert!(config.server().is_none()
    || ...)). TEA wrote the test with this bug, Dev passed it without noticing, and
    Reviewer did not flag the vacuous logic.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test (let _ = config). TEA wrote
    it, Dev passed it, and Reviewer did not flag the missing assertions on default
    config values.
