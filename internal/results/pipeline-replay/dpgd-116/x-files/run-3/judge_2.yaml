findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default swallowing all errors via unwrap_or_default().
    TEA's 'silent error swallowing' tests target HTTP status codes, not config file
    loading. Reviewer verified config validation (V-9) but not the error-swallowing
    fallback path.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 tests: ''Error messages don''t leak stack traces, internal
    paths, or JWT tokens.'' Dev implemented CWE-209 safe Display on CliError. Reviewer
    verified at V-4. Same vulnerability class caught.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: CRLF injection prevention in auth tokens
    and tenant ID headers.'' Dev implemented CRLF sanitization in client.rs:23,30.
    Reviewer flagged raw String vs TenantId at F-11 and verified CWE-113 at V-3.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Reviewer F-7 flags version mismatches (dirs 5 vs 6, toml 0.8 vs 0.9) but
    does not flag the use of direct version strings instead of workspace = true. The
    core issue of version drift from bypassing workspace dependencies was not identified.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''Credential storage: Config file must NOT contain
    token/password fields.'' Dev implemented #[serde(deny_unknown_fields)] on ClientConfig
    (config.rs:8). Reviewer verified at V-2: ''rejects token/password fields in TOML.'''
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion (is_none() || ... always
    true). The reviewer did not flag this test quality issue despite reviewing test
    files.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test that only checks non-panic.
    The reviewer did not flag this test quality issue despite SOUL.md principle 4
    warning 'a vacuously true test is worse than no test.'
