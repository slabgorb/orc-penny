- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F5 explicitly flags: 'RawConfig uses #[derive(serde::Deserialize)]\
    \ without #[serde(deny_unknown_fields)]. An operator who typos server_url as server_ur\
    \ gets no warning \u2014 the field is silently ignored and defaults are used.'\
    \ This encompasses the token-silently-ignored issue."
- finding_id: I5
