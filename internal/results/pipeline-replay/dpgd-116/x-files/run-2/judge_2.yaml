- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase identified that from_file_or_default swallows all errors via
    unwrap_or_default(). TEA mentions config loading tests but none specifically test
    distinguishing NotFound from parse/permission errors. Reviewer did not flag this
    pattern.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly listed ''CWE-209: Error display does not leak internal
    paths/stack traces'' as a security test category, and wrote tests in error_handling_integration.rs:96-129.
    Reviewer verified as ''CWE-209 compliant''. Same vulnerability class addressed,
    though the specific eprintln forwarding instance may not have been fully prevented.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote ''Header injection: Newline rejection in tenant ID and token
    values'' tests. Dev implemented sanitization stripping \r\n in client.rs:37. However,
    the pipeline addressed injection via character stripping rather than using TenantId
    type from axiathon-core, so the type-safety aspect was missed. Same vulnerability
    class (CWE-113) was caught.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that 6 dependencies (clap_complete, comfy-table, csv,
    dirs, reqwest, toml) use direct version strings instead of workspace = true. Reviewer
    noted toml_edit vs toml spec divergence (F9) but not the workspace dependency
    pattern.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F5 explicitly flagged: ''RawConfig silently ignores unknown
    TOML fields without #[serde(deny_unknown_fields)]. An operator who typos server_url
    as server_ur gets no warning.'' This encompasses the token silent-ignore scenario.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer F6 flagged vacuous assertion pattern in config_rejects_negative_timeout:
    ''uses if let Ok(c) which means if load() returns Err, the test silently passes
    without checking anything. This is a vacuous assertion pattern.'' Same category
    of vacuously true test assertions.'
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer F7 explicitly flagged: 'siem_client_rejects_newline_in_token\
    \ test... let _ = client; // Construction should not panic \u2014 This test verifies\
    \ construction doesn't panic but doesn't verify the token was sanitized.' Same\
    \ category of zero-assertion tests."
