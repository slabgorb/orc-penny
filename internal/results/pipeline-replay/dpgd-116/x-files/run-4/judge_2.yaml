findings:
- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged from_file_or_default using unwrap_or_default() to swallow
    all error types. The reviewer discussed CliError::Config Display but never identified
    that parse errors, permission errors, etc. are silently converted to defaults.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-209: server error Display must not leak internal
    IPs, ports, usernames'' in exit_codes.rs and security_integration.rs. Dev implemented
    ''security-sanitized Display (CWE-209)'' in error.rs. Same vulnerability class
    caught.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote 13 tests in siem_client.rs including 'Header injection prevention\
    \ (CRLF in token/tenant values)' and 'CRLF injection prevention'. The reviewer\
    \ also flagged silent header drops at client.rs:62-72. However, the raw String\
    \ vs TenantId type issue was not addressed \u2014 only the injection vector was\
    \ mitigated via HeaderValue::from_str."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned workspace dependency consistency. The dev modified
    Cargo.toml only to add the env feature to clap. No test or review comment addressed
    direct version strings vs workspace = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer''s MEDIUM finding explicitly states: ''#[serde(default)] silently
    accepts unknown fields... If an operator accidentally puts token = "..." in the
    config, the token is silently ignored. A warning should be emitted when security-sensitive
    fields like token or password appear in the config file.'' Also notes missing
    #[serde(deny_unknown_fields)].'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the vacuously true assertion pattern (assert! with
    is_none() || ...). Neither the TEA test design, dev implementation, nor reviewer
    flagged this logical flaw in test assertions.
- finding_id: I6
  title: "Test with zero assertions \u2014 only checks non-panic"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: No phase identified the zero-assertion test that only checks for non-panic
    via 'let _ = config'. Neither TEA, dev, nor reviewer flagged this as a vacuous
    test.
