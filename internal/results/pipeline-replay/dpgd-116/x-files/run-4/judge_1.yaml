- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged the from_file_or_default swallowing all error types.
    The reviewer discussed Config Display hiding details but never identified the
    unwrap_or_default() pattern that silently falls back on parse/permission errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests in exit_codes.rs and security_integration.rs for ''CWE-209
    error display sanitization'' and ''CWE-209: server error Display must not leak
    internal IPs, ports, usernames''. Dev implemented ''security-sanitized Display
    (CWE-209)''. Same vulnerability class addressed.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: TEA wrote siem_client.rs with 13 tests including 'header injection, HTTP
    status mapping, CRLF injection prevention'. Tests explicitly cover CWE-113 header
    injection via CRLF in token/tenant values. However, the specific recommendation
    to use TenantId from axiathon-core was not flagged.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase mentioned workspace dependency declarations vs direct version
    strings. The code changes show Cargo.toml was modified but no one flagged the
    6 deps using direct versions instead of workspace = true.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer explicitly flagged '[MEDIUM] #[serde(default)] silently accepts\
    \ unknown fields \u2014 config.rs:11' and specifically noted: 'If an operator\
    \ accidentally puts token = \"...\" in the config, the token is silently ignored.\
    \ A warning should be emitted when security-sensitive fields like token or password\
    \ appear in the config file.'"
