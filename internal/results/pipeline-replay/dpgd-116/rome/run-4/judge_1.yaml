- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding #2 flags CWE-209: 'ServerError Display leaks internal\
    \ details' \u2014 identifies that reqwest error paths via e.to_string() can contain\
    \ connection details, DNS info, internal hostnames. Same vulnerability class (CWE-209\
    \ information exposure via error messages)."
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: false
  caught_by: null
  evidence: TEA wrote CRLF injection tests for tenant_id in SiemClient, and Dev implemented
    CRLF/null-byte validation in SiemClient::new(). However, the ground truth finding
    is that tenant_id is a raw String instead of using the validated TenantId newtype
    from axiathon-core. The pipeline validates the string content but doesn't flag
    the missing type-safe integration. The CRLF validation is a runtime check, not
    the compile-time type safety the finding calls for.
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: No phase flagged that dependencies use direct version strings instead
    of workspace = true. Reviewer noted a toml version mismatch with the story spec
    but did not flag the workspace dependency pattern issue.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer finding #4: ''ClientConfig silently accepts unknown TOML fields...
    Should use #[serde(deny_unknown_fields)]''. While the ground truth specifically
    mentions a token field being silently ignored, the reviewer flagged the same root
    cause (missing deny_unknown_fields) and rated it HIGH.'
- finding_id: I5
  title: "Vacuously true test \u2014 assertion is None || true"
  weight: 5
