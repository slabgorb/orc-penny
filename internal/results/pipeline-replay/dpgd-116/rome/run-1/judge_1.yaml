- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA tests config loading and Dev implements from_file_or_default, but
    no test or review finding addresses the specific issue of swallowing parse/permission
    errors vs NotFound. The config tests cover TOML loading and env overrides but
    not error discrimination.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA explicitly includes ''CWE-209: CliError::Display must not leak server
    internals'' as a security test. Dev implemented security-safe Display where ServerError(_)
    writes generic message. Reviewer verified V2: ''ServerError(_) Display writes
    generic message, not the inner string.'' Same vulnerability class addressed.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA includes 'CWE-113: Header injection via newlines in token/tenant\
    \ ID' and siem_client_test.rs covers 'header injection prevention'. Dev implemented\
    \ with_tenant_validated rejecting CR/LF. Reviewer verified V3. However, the default\
    \ field remains raw String \u2014 the class was caught but the full fix (using\
    \ TenantId from core) was not applied."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
