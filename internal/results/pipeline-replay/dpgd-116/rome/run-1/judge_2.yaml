    errors.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA listed ''CWE-209: CliError::Display must not leak server internals''
    as a security test. Dev implemented security-safe Display. Reviewer verified V2:
    ''ServerError(_) Display writes generic message, not the inner string.'' Same
    vulnerability class (CWE-209) was addressed.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote tests for ''CWE-113: Header injection via newlines in token/tenant
    ID''. Dev implemented with_tenant_validated() rejecting CR/LF. Reviewer verified
    V3. Same vulnerability class caught, though the pipeline used opt-in validated
    methods rather than replacing the raw String with TenantId type.'
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
  weight: 3
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: Dev added dependencies to both workspace and crate Cargo.toml but no phase
    flagged that the crate uses direct version strings instead of workspace = true
    references.
- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: "Reviewer V5 explicitly approved the token dropping behavior: 'token()\
    \ always returns None. RawConfig.token field is silently dropped. Tokens cannot\
    \ leak from config file.' This is the opposite conclusion \u2014 the pipeline\
    \ saw the code and judged it correct, missing that a user's secret sits on disk\
    \ in plaintext while they believe they're authenticated. F9 (deny_unknown_fields)\
    \ addresses different unknown fields, not the known token field."
