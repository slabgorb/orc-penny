- finding_id: C1
  title: from_file_or_default swallows ALL errors including parse and permission failures
  weight: 8
  phase_ideal: dev
  caught: false
  caught_by: null
  evidence: TEA tests 'missing file defaults' but no test verifies that parse errors
    or permission errors propagate instead of falling back to defaults. Reviewer flags
    silent error swallowing in output formatters but not in config loading's from_file_or_default.
- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 tests in exit_codes.rs (''Server error Display must
    not leak internal paths/stack traces''). Dev implemented fixed user-facing Display
    messages in error.rs. Reviewer verified: ''Display impls use fixed user-facing
    messages. Internal details are not exposed in Display.'''
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer flagged: ''axiathon-core dependency declared but entirely unused...
    --tenant flag is Option<String> (raw, unvalidated) instead of using the TenantId
    newtype that axiathon-core provides.'' TEA also wrote CWE-113 CRLF injection tests,
    but the core type-safety issue was caught by reviewer.'
