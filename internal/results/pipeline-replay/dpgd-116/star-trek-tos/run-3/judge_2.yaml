- finding_id: I4
  title: "Config token field silently ignored \u2014 secret left on disk"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flags: ''RawConfig uses serde''s default deserialization
    which silently ignores unknown fields. A config file containing token = "my-secret"
    is silently accepted and the token is discarded... serde''s #[serde(deny_unknown_fields)]
    would actively reject configs containing a token field.'''
