- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: 'Reviewer explicitly flags: ''The --tenant flag is Option<String> (raw,
    unvalidated) instead of using the TenantId newtype that axiathon-core provides
    with UUID validation. This contradicts the project''s Rust rules.'' TEA also wrote
    CWE-113 header injection tests for tenant ID CRLF rejection.'
