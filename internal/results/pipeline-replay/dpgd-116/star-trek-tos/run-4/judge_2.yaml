- finding_id: I1
  title: CliError Display leaks internal details to stderr (CWE-209)
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote CWE-209 security tests: ''Server error display must not leak
    stack traces, connection strings, or credentials.'' Dev implemented CWE-209-safe
    Display. Reviewer verified ServerError Display omits response body. Same vulnerability
    class addressed, though the specific Io(transparent) variant leak was not explicitly
    called out.'
- finding_id: I2
  title: "SiemClient.tenant_id uses raw String \u2014 header injection risk (CWE-113)"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding 2 flagged that with_token()/with_tenant() bypass header\
    \ injection validation (CWE-113) and are public. TEA also wrote header injection\
    \ tests. However, neither phase flagged the specific issue of using raw String\
    \ instead of axiathon-core's TenantId type \u2014 the focus was on validation\
    \ bypass rather than type safety."
- finding_id: I3
  title: Dependencies use direct version strings instead of workspace = true
