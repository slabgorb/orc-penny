- finding_id: C1
  title: "EventEnricher::enrich() has no error return path \u2014 enrichment failures\
    \ are invisible"
  weight: 8
  phase_ideal: reviewer
  caught: false
  caught_by: null
  evidence: EventEnricher::enrich() returns EnrichmentResult with no error path. TEA
    tests don't assert error returns from enrich. Dev implemented EnrichmentResult
    as a plain struct with fields_added and source. Reviewer mentions tenant context
    deferral for EventEnricher but does not flag the missing error return path.
