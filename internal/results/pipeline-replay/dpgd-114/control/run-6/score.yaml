- finding_id: C1
  title: "EventEnricher::enrich() has no error return path \u2014 enrichment failures\
    \ are invisible"
  weight: 8
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer flagged as MEDIUM: 'EventEnricher::enrich() infallible return\
    \ \u2014 returns EnrichmentResult not Result<EnrichmentResult, PluginError>. If\
    \ the enrichment lookup fails... the implementor must return EnrichmentResult\
    \ { fields_added: 0, ... } \u2014 caller cannot distinguish enrichment found nothing\
    \ from enrichment errored.'"
