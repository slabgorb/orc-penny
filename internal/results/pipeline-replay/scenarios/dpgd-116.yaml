# Pipeline Replay Scenario: DPGD-116 — Story 6.1 CLI Framework & Structure
#
# Ground truth: 7 findings (1 critical + 6 important) from external review
# that the original TDD pipeline missed. Pipeline APPROVED, then Zious11
# found issues in PR #51. All fixed in re-review.
#
# 3-point story — lighter than dpgd-117 (5pt). Faster Dev phase.
#
# Original pipeline theme: the-matrix
# Original pipeline characters:
#   TEA: The Architect
#   Dev: Agent Smith
#   Reviewer: The Merovingian

id: dpgd-116
title: "Story 6.1: CLI Framework & Structure"
story_id: "6-1"
jira: DPGD-116

repo:
  path: axiathon
  base_commit: f6bdd2cf3106f624e8622853989bd0e93043552b
  branch: feature/story-6.1-cli-framework-structure

context:
  epic: sprint/context/context-epic-6.md
  story: sprint/context/context-story-6-1.md
  session_archive: sprint/archive/DPGD-116-session.md

phases: [tea, dev, reviewer]

ground_truth:
  total_weight: 37
  round_1:
    fix_commit: 734e1612d460
    findings:
      - id: C1
        title: "from_file_or_default swallows ALL errors including parse and permission failures"
        severity: critical
        weight: 8
        category: security
        phase_ideal: dev
        files: [crates/axiathon-client/src/config.rs]
        description: >
          Self::from_file(path).unwrap_or_default() catches every error type —
          permission denied, TOML parse errors, disk I/O, encoding errors — and
          silently returns default config. A user with a typo in cli.toml gets
          silently routed to defaults. Permission denied errors (potential security
          signal) are discarded. Should distinguish NotFound (acceptable fallback)
          from all other errors.

      - id: I1
        title: "CliError Display leaks internal details to stderr (CWE-209)"
        severity: important
        weight: 5
        category: security
        phase_ideal: reviewer
        files: [crates/axiathon-client/src/main.rs, crates/axiathon-client/src/error.rs]
        description: >
          eprintln!("error: {e}") prints Display impl directly to stderr.
          Io(#[error(transparent)]) forwards full OS error details. Internal
          server details, file paths, network topology leak when real errors
          propagate. Needs user_message() method returning sanitized messages.

      - id: I2
        title: "SiemClient.tenant_id uses raw String — header injection risk (CWE-113)"
        severity: important
        weight: 5
        category: security
        phase_ideal: tea
        files: [crates/axiathon-client/src/client.rs]
        description: >
          set_tenant_id accepts any string including CRLF. axiathon-core provides
          validated TenantId but it's unused. Bypasses type-safe tenant isolation.
          Should use Option<TenantId> from axiathon-core.

      - id: I3
        title: "Dependencies use direct version strings instead of workspace = true"
        severity: important
        weight: 3
        category: build
        phase_ideal: dev
        files: [crates/axiathon-client/Cargo.toml]
        description: >
          6 deps (clap_complete, comfy-table, csv, dirs, reqwest, toml) use direct
          versions despite being in [workspace.dependencies]. Causes version drift
          risk across workspace crates.

      - id: I4
        title: "Config token field silently ignored — secret left on disk"
        severity: important
        weight: 5
        category: security
        phase_ideal: reviewer
        files: [crates/axiathon-client/src/config.rs]
        description: >
          Serde silently ignores unknown fields. A user putting token = "sk-secret..."
          in config believes they're authenticated when they're not, with their secret
          in plaintext. Should use #[serde(deny_unknown_fields)] or detect and warn.

      - id: I5
        title: "Vacuously true test — assertion is None || true"
        severity: important
        weight: 5
        category: testing
        phase_ideal: tea
        files: [crates/axiathon-client/tests/config_loading.rs]
        description: >
          assert!(config.server().is_none() || ...) — first branch always true,
          OR always passes. Should be assert_eq!(config.server(), None).

      - id: I6
        title: "Test with zero assertions — only checks non-panic"
        severity: important
        weight: 5
        category: testing
        phase_ideal: tea
        files: [crates/axiathon-client/tests/config_loading.rs]
        description: >
          let _ = config; — test has no assertions on return value. Should add
          assert_eq! checks for server() and token() on the default config.

original_pipeline:
  theme: the-matrix
  tea_tests: 54
  dev_files: 10
  reviewer_verdict: approved
  pr_number: 51

phase_prompts:
  tea: |
    You are the TEA (Test Engineer/Architect) for Story 6.1: CLI Framework & Structure.

    Your task is the RED phase of TDD:
    1. Read the epic and story context in this project's CLAUDE.md
    2. Design and write comprehensive failing tests for the CLI framework
    3. Tests go in crates/axiathon-client/tests/
    4. Run `cargo test -p axiathon-client` to verify tests fail (RED state)

    Cover all acceptance criteria:
    - Top-level command groups (query, rules, alerts, ingest, config, status, tenant, login, completion, init)
    - Subcommand help rendering
    - Exit codes (0/1/2/3/4) via CliError::exit_code()
    - Output formatting (table/json/csv)
    - Global flags (-v, --quiet, --server with AXIATHON_SERVER env var)
    - Clap derive macros (declarative only)
    - SiemClient HTTP wrapper with tenant/auth headers
    - Config file loading from ~/.config/axiathon/cli.toml
    - Shell completion generation (bash/zsh/fish/powershell)
    - Stub handlers printing "not yet implemented"

    Write tests that would catch security issues (CWE-209 error exposure,
    header injection, silent error swallowing, config validation).
    When done, provide a summary of test files and test count.

  dev: |
    You are the Dev (Developer) for Story 6.1: CLI Framework & Structure.

    Your task is the GREEN phase of TDD:
    1. Read the epic and story context in this project's CLAUDE.md
    2. Review the tests already written in crates/axiathon-client/tests/
    3. Implement production code in crates/axiathon-client/src/ to make ALL tests pass
    4. Run `cargo test -p axiathon-client` to verify all tests pass
    5. Run `cargo clippy -p axiathon-client` to check for lint issues

    Key implementation details:
    - Clap 4.x with derive macros only
    - SiemClient wrapping reqwest::Client
    - Config loading from TOML with proper error handling
    - Output formatting (table via comfy-table, JSON, CSV)
    - Shell completion via clap_complete
    - Exit codes mapped from CliError variants

    Make the tests pass with clean, production-quality code.
    When done, provide a summary of files changed and test results.

  reviewer: |
    You are the Reviewer (Code Reviewer) for Story 6.1: CLI Framework & Structure.

    Your task is the REVIEW phase:
    1. Read the epic and story context in this project's CLAUDE.md
    2. Read ALL code changes — both tests and implementation
    3. Perform an adversarial security-focused review

    Check for:
    - Security: CWE-209 error exposure, header injection (CWE-113), silent failures
    - Config safety: error swallowing, unknown field handling, secret exposure
    - Build: workspace dependency management
    - Test quality: vacuous assertions, missing assertions, coverage gaps
    - Type safety: raw strings vs validated newtypes (TenantId)
    - Code accuracy: comments matching reality, doc comments matching behavior

    Be thorough. The goal is to catch issues the TEA and Dev may have missed.
    Output findings as a structured list: [SEVERITY] Finding title — description.
    Conclude with a verdict: APPROVED, APPROVED_WITH_FINDINGS, or CHANGES_REQUESTED.
