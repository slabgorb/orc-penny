# Pipeline Replay Scenario: MSSCI-10836 — Crowdstrike Falcon API Integration
#
# Ground truth: 16 findings (6 critical + 10 important) from external review
# that the original pipeline missed. Pipeline produced the code, Zious11
# found issues in PR #2. Review was DISMISSED (fixes applied).
#
# Large PR — 35 files, +4001/-605 lines. Go codebase (different from DPGD-116 Rust).
#
# No original pipeline theme — this predates pennyfarthing installation.

id: mssci-10836
title: "MSSCI-10836: Introduce Crowdstrike Falcon API Integration"
story_id: "MSSCI-10836"
jira: MSSCI-10836

repo:
  path: poller-cobra
  base_commit: 243f79ef441ca9585a074d334e077593c1850258
  branch: MSSCI-10836-client-test

roots:
  repo: ../../../../../poller-orc/poller-cobra

context:
  # No pennyfarthing context docs — pre-framework PR
  claude_md: CLAUDE.md

phases: [tea, dev, reviewer]

ground_truth:
  total_weight: 71
  round_1:
    fix_commit: null  # fixes applied across multiple commits
    findings:
      - id: C1
        title: "Ping() only checks nil pointer — does NOT verify actual API connectivity"
        severity: critical
        weight: 8
        category: correctness
        phase_ideal: tea
        files: [internal/crowdstrike/api.go]
        description: >
          Ping() checks c.inner == nil and logs "connectivity verified" without
          making any network call. Users get false confidence that the API
          connection is working when it may not be.

      - id: C2
        title: "FetchAlerts/Detections/Hosts are stubs returning empty slices — no data collected"
        severity: critical
        weight: 8
        category: correctness
        phase_ideal: reviewer
        files: [internal/crowdstrike/api.go]
        description: >
          FetchAlerts(), FetchDetections(), FetchHosts() all return empty slices
          with no error. The collector will run indefinitely collecting zero data
          with no indication anything is wrong.

      - id: C3
        title: "CrowdStrike source created but never passed to the collector"
        severity: critical
        weight: 8
        category: correctness
        phase_ideal: reviewer
        files: [internal/app/runner/runner.go]
        description: >
          runner.go creates and pings the CrowdStrike source but never wires it
          into the collector. The collector has TODO comments and does nothing
          with the source. The integration is non-functional scaffolding.

      - id: C4
        title: "Missing Context in ApiConfig — required for OAuth2 token management"
        severity: critical
        weight: 5
        category: security
        phase_ideal: dev
        files: [internal/crowdstrike/api.go]
        description: >
          falcon.ApiConfig is missing Context field. The CrowdStrike SDK
          requires context.Context for OAuth2 token lifecycle management.
          Without it, token refresh and cancellation are broken.

      - id: C5
        title: "Detections API deprecated (Oct 2024) — full decommission Sep 2025"
        severity: critical
        weight: 5
        category: correctness
        phase_ideal: reviewer
        files: [internal/crowdstrike/api.go]
        description: >
          FetchDetections() targets the Detections API which was deprecated
          Oct 2024 with full decommission Sep 30, 2025. Should use Alerts
          API (QueryAlertsV2/GetAlertsV2) instead.

      - id: C6
        title: "Alert struct fields don't match CrowdStrike API schema"
        severity: critical
        weight: 5
        category: correctness
        phase_ideal: tea
        files: [internal/crowdstrike/api.go]
        description: >
          Alert struct uses ID/Timestamp/Severity/Source but actual API returns
          composite_id/created_timestamp/severity_name. Missing MITRE ATT&CK
          fields (tactics, techniques). Struct won't correctly deserialize
          real API responses.

      - id: I1
        title: "Import paths use old poller-template instead of poller-cobra"
        severity: important
        weight: 3
        category: build
        phase_ideal: reviewer
        files: [internal/crowdstrike/README.md]
        description: >
          Documentation references import paths from poller-template instead
          of poller-cobra, despite the module rename.

      - id: I2
        title: "Comment claims 'custom' data source supported but code returns error"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: reviewer
        files: [internal/crowdstrike/source.go]
        description: >
          Code comment says custom data source is supported but the actual
          code returns an error for unrecognized source types.

      - id: I3
        title: "Cursor parameter documented but never used — pagination is broken"
        severity: important
        weight: 5
        category: correctness
        phase_ideal: tea
        files: [internal/crowdstrike/source.go]
        description: >
          The cursor parameter is documented for pagination tracking but is
          never used in FetchRecords. Every poll cycle re-fetches from the
          beginning with no deduplication.

      - id: I4
        title: "Error wrapping missing context in fetch methods (CLAUDE.md violation)"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: reviewer
        files: [internal/crowdstrike/source.go]
        description: >
          Fetch methods don't wrap errors with context using fmt.Errorf,
          violating the project's CLAUDE.md coding standards.

      - id: I5
        title: "Silent fallback on CROWDSTRIKE_LIMIT parse errors — no warning logged"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: dev
        files: [internal/config/config.go]
        description: >
          Non-numeric CROWDSTRIKE_LIMIT values silently fall back to the
          default with no warning logged, inconsistent with how other
          numeric env vars are handled.

      - id: I6
        title: "ValidateConfig() prints deprecated BaseURL/APIKey fields"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: reviewer
        files: [internal/config/utils.go]
        description: >
          ValidateConfig() still prints deprecated BaseURL and APIKey fields
          instead of the new CrowdStrike-specific configuration fields.

      - id: I7
        title: "FetchRecords returns []interface{} instead of typed slice"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: dev
        files: [internal/crowdstrike/source.go]
        description: >
          FetchRecords returns []interface{} instead of []Record, losing
          type safety. Callers must type-assert every element.

      - id: I8
        title: "No region validation — invalid regions silently default to us-1"
        severity: important
        weight: 3
        category: security
        phase_ideal: dev
        files: [internal/crowdstrike/api.go]
        description: >
          Invalid region strings silently default to us-1. Should validate
          against known values (us-1, us-2, eu-1, us-gov-1, ap-1) or at
          minimum log a warning.

      - id: I9
        title: "Missing MITRE ATT&CK fields (tactics, techniques) in Alert struct"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: tea
        files: [internal/crowdstrike/api.go]
        description: >
          Alert struct is missing tactics and techniques fields which are
          standard in CrowdStrike alert responses and critical for
          security analytics downstream.

      - id: I10
        title: "Documentation claims Detections works but API is deprecated"
        severity: important
        weight: 3
        category: correctness
        phase_ideal: reviewer
        files: [internal/crowdstrike/README.md]
        description: >
          README documentation claims the Detections collection feature works
          but the underlying API is deprecated and the method is a stub.

phase_prompts:
  tea: |
    You are the TEA (Test Engineer/Architect) for MSSCI-10836: Crowdstrike Falcon API Integration.

    Your task is the RED phase of TDD:
    1. Read CLAUDE.md for project conventions
    2. Design and write comprehensive failing tests for the CrowdStrike integration
    3. Tests go in the appropriate *_test.go files alongside implementation
    4. Run `go test ./...` to verify tests fail (RED state)

    Cover:
    - CrowdStrike client initialization with valid/invalid config
    - API connectivity verification (Ping should actually verify connectivity)
    - Alert/Detection/Host fetching with proper API schema mapping
    - Pagination via cursor-based tracking
    - Error handling with context wrapping per CLAUDE.md
    - Config validation (region, limits, env var parsing)
    - Source integration with collector (source must be wired in)
    - Type safety (no []interface{} returns)
    - MITRE ATT&CK field presence in Alert struct

    Write tests that would catch: stub methods returning empty data,
    broken pagination, missing OAuth2 context, schema mismatches,
    dead code paths, and silent configuration failures.
    When done, provide a summary of test files and test count.

  dev: |
    You are the Dev (Developer) for MSSCI-10836: Crowdstrike Falcon API Integration.

    Your task is the GREEN phase of TDD:
    1. Read CLAUDE.md for project conventions
    2. Review the tests already written in *_test.go files
    3. Implement production code to make ALL tests pass
    4. Run `go test ./...` to verify all tests pass
    5. Run `make lint` to check for lint issues

    Key implementation details:
    - Use gofalcon SDK v0.18.0 for CrowdStrike API calls
    - Implement real API calls (QueryAlertsV2, GetAlertsV2), not stubs
    - Wire CrowdStrike source into the collector in runner.go
    - Include context.Context in ApiConfig for OAuth2
    - Map Alert struct fields to actual API schema
    - Implement cursor-based pagination in FetchRecords
    - Validate region against known values
    - Wrap errors with context per CLAUDE.md

    Make the tests pass with clean, production-quality code.
    When done, provide a summary of files changed and test results.

  reviewer: |
    You are the Reviewer (Code Reviewer) for MSSCI-10836: Crowdstrike Falcon API Integration.

    Your task is the REVIEW phase:
    1. Read CLAUDE.md for project conventions
    2. Read ALL code changes — both tests and implementation
    3. Perform an adversarial review focused on correctness and security

    Check for:
    - Stub/dead code: methods that return empty data without doing real work
    - Integration gaps: components created but not wired together
    - API correctness: struct fields matching actual CrowdStrike API schema
    - Deprecated APIs: Detections API deprecated Oct 2024
    - OAuth2 lifecycle: context propagation for token management
    - Pagination: cursor actually used and advancing
    - Error handling: wrapping with context per CLAUDE.md
    - Config safety: silent fallbacks, missing validation
    - Type safety: raw interface{} vs typed returns
    - Documentation accuracy: comments matching actual behavior

    Be thorough. The goal is to catch issues the TEA and Dev may have missed.
    Output findings as a structured list: [SEVERITY] Finding title — description.
    Conclude with a verdict: APPROVED, APPROVED_WITH_FINDINGS, or CHANGES_REQUESTED.
