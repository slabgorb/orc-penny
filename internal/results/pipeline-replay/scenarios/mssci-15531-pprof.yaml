# Pipeline Replay Scenario: pprof Profiling Infrastructure (cobra PR #15)
#
# Ground truth: 4 important findings from Zious11 review Pass 1 that blocked
# approval. Claude pipeline (TEA→Dev) produced the code, internal reviewer
# approved, then Kraken found what was missed. 4 review passes total.
#
# Same feature deployed to coaster (#57) and bear (#91) by Claude — identical
# findings reproduced across repos. Cross-repo comparison possible.
#
# Claude co-authored: confirmed (Co-Authored-By: Claude Opus 4.6)
# 6 files, +543/-1 lines. Focused Go feature (profiling subsystem).
#
# Finding provenance:
#   Pass 1: 0C + 4I + 10S + 4TD → CHANGES_REQUESTED
#   Pass 2: 0C + 2I remaining + 3 new S → CHANGES_REQUESTED
#   Pass 3: 0C + 1I remaining + 4 new S → CHANGES_REQUESTED
#   Pass 4: 0C + 0I remaining → APPROVED (11S + 3TD non-blocking)
#
# The 4 Important findings from Pass 1 are ground truth — they blocked merge.
# Suggestions that persisted are tracked but lower-weighted.

id: pprof-cobra-15
title: "Pprof Profiling Infrastructure (poller-cobra)"
story_id: "pprof"
jira: null

repo:
  path: poller-cobra
  base_commit: d7e1810d1db81549a03fc3b9ad69597b07695339
  branch: feat/add-pprof-profiling

roots:
  repo: ../../../../../poller-orc/poller-cobra

context:
  claude_md: CLAUDE.md

phases: [tea, dev, reviewer]

ground_truth:
  total_weight: 38
  round_1:
    fix_commit: 9182127  # fix: address pprof PR review comments
    findings:
      # === IMPORTANT (blocking) — Pass 1 ===

      - id: I1
        title: "Missing WriteTimeout, ReadHeaderTimeout, IdleTimeout on HTTP server"
        severity: important
        weight: 5
        category: security
        phase_ideal: dev
        files: [internal/profiling/pprof.go]
        description: >
          Server created with only ReadTimeout. Health server at
          internal/health/server.go sets all four timeouts. Missing
          ReadHeaderTimeout allows slowloris-style DoS (gosec G112,
          CWE-400). Missing IdleTimeout leaks keep-alive connections.
          Pattern violation — health server is the established precedent.

      - id: I2
        title: "ListenAndServe failure swallowed — caller never knows server failed to start"
        severity: important
        weight: 5
        category: correctness
        phase_ideal: tea
        files: [internal/profiling/pprof.go]
        description: >
          Bind errors (port in use, permission denied) are logged inside
          a goroutine but never propagated to the caller. Start() returns
          a shutdown closure as if the server started successfully.
          Fix: separate bind (synchronous) from serve (async), return
          error from Start().

      - id: I3
        title: "Pprof server exposed without authentication"
        severity: important
        weight: 5
        category: security
        phase_ideal: reviewer
        files: [internal/profiling/pprof.go]
        description: >
          newPprofMux() registers pprof handlers with no auth middleware.
          PPROF_ADDR can be set to 0.0.0.0:3030. /debug/pprof/heap and
          /debug/pprof/goroutine can leak in-memory API keys and tokens.
          CVE-2019-11248 demonstrated this exact risk. In Kubernetes,
          localhost insufficient — pod-to-pod access via hostNetwork,
          sidecars, kubectl port-forward. Persisted through 3 review
          passes until author pushback accepted with layered mitigations.

      - id: I4
        title: "runner.Execute error discarded silently on exit"
        severity: important
        weight: 5
        category: correctness
        phase_ideal: reviewer
        files: [main.go]
        description: >
          if err := runner.Execute(...); err != nil { return 1 } — exits
          with code 1 but never logs the error. runner.Execute returns 6
          distinct wrapped errors. Pod crashes with exit 1 and operator
          sees nothing in kubectl logs. CLAUDE.md violation — "Use
          charmbracelet/log with structured fields."

      # === SUGGESTIONS that persisted (non-blocking but pipeline-detectable) ===

      - id: S3
        title: "Hardcoded test ports risk CI flakiness"
        severity: suggestion
        weight: 2
        category: testing
        phase_ideal: tea
        files: [internal/profiling/pprof_test.go]
        description: >
          Ports 19293-19296 hardcoded in tests. If occupied, tests fail
          with misleading bind errors. Should use net.Listen("tcp",
          "localhost:0") for OS-assigned ports. Author pushed back —
          "stable in CI" — but it's a latent fragility.

      - id: S6
        title: "ENABLE_PPROF=false enables profiling — any non-empty value is truthy"
        severity: suggestion
        weight: 3
        category: correctness
        phase_ideal: tea
        files: [internal/profiling/pprof.go]
        description: >
          Any non-empty ENABLE_PPROF value (including "false", "0", "no")
          enables profiling. Should use strconv.ParseBool. Fixed in pass 4
          after 3 passes of persistence.

      - id: S9
        title: "fmt.Fprintf instead of charmbracelet/log for pprof shutdown error"
        severity: suggestion
        weight: 2
        category: correctness
        phase_ideal: reviewer
        files: [main.go]
        description: >
          CLAUDE.md mandates charmbracelet/log with structured fields.
          Pprof shutdown error uses raw fmt.Fprintf to stderr, invisible
          to log aggregation pipelines.

      # === Findings discovered in later passes (regression/gap detection) ===

      - id: P2-S11
        title: "Missing IdleTimeout on http.Server after partial I1 fix"
        severity: suggestion
        weight: 2
        category: security
        phase_ideal: dev
        files: [internal/profiling/pprof.go]
        description: >
          Pass 1 fix added WriteTimeout and ReadHeaderTimeout but missed
          IdleTimeout. Health server sets all four. Caught in pass 2,
          fixed in pass 3.

      - id: P2-S12
        title: "Missing isLoopback unit tests — security-sensitive function"
        severity: suggestion
        weight: 2
        category: testing
        phase_ideal: tea
        files: [internal/profiling/pprof_test.go]
        description: >
          isLoopback() has 5 branches and gates security warnings but
          zero direct test coverage. Fixed in pass 3 with table-driven
          TestIsLoopback.

      - id: P3-S14
        title: "/debug/pprof/cmdline 404 behavior not tested"
        severity: suggestion
        weight: 2
        category: testing
        phase_ideal: tea
        files: [internal/profiling/pprof_test.go]
        description: >
          Cmdline endpoint deliberately blocked as security hardening but
          no test verifies it returns 404. A regression would silently
          expose process arguments containing secrets. Fixed in pass 4.

      - id: P4-S18
        title: "CrowdStrike credentials in plaintext example command"
        severity: suggestion
        weight: 3
        category: security
        phase_ideal: reviewer
        files: [docs/PROFILING.md]
        description: >
          Example uses CROWDSTRIKE_CLIENT_ID=... CROWDSTRIKE_CLIENT_SECRET=...
          go run . — encourages passing secrets as inline env vars visible
          in process listings and shell history. Not fixed.

      - id: P4-S20
        title: "ParseBool error silently discarded for unrecognized values"
        severity: suggestion
        weight: 2
        category: correctness
        phase_ideal: dev
        files: [internal/profiling/pprof.go]
        description: >
          ENABLE_PPROF=yes or ENABLE_PPROF=on silently does not enable
          profiling after ParseBool fix. No log.Warn when ParseBool fails
          on a non-empty value. Not fixed.

cross_repo:
  # Same feature, same Claude pipeline, same Kraken reviewer
  coaster:
    pr: 57
    repo: poller-coaster
    review_passes: 1
    verdict: CHANGES_REQUESTED
    extra_finding: "C1: Build failure — Start() returns 2 values but only 1 captured in cmd/collector/main.go"
    notes: >
      Coaster has an additional entrypoint (cmd/collector/main.go) that cobra
      lacks. The same pprof code produced a compile error there that was caught
      in coaster but not cobra (cobra only has main.go). Interesting false
      negative — if the pipeline tests only main.go, cmd/collector/ is blind.
  bear:
    pr: 91
    repo: poller-bear
    review_passes: null
    notes: "Same pattern expected — not yet analyzed in detail"

phase_prompts:
  tea: |
    You are the TEA (Test Engineer/Architect) for the pprof profiling feature.

    Your task is the RED phase of TDD:
    1. Read CLAUDE.md for project conventions
    2. Design and write comprehensive failing tests for an opt-in pprof
       profiling server gated by ENABLE_PPROF env var
    3. Tests go in internal/profiling/pprof_test.go
    4. Run `go test ./...` to verify tests fail (RED state)

    Cover:
    - Server startup with enabled/disabled states
    - Bind failure propagation (port in use, permission denied)
    - ENABLE_PPROF parsing edge cases (false, 0, no, empty, invalid)
    - Default address vs custom PPROF_ADDR
    - Loopback validation for PPROF_ADDR
    - Graceful shutdown via returned closure
    - Security: cmdline endpoint should be blocked (returns 404)
    - Security: isLoopback() branches (127.0.0.1, ::1, 0.0.0.0, empty)
    - HTTP server timeout configuration (match health server pattern)
    - Port allocation (prefer OS-assigned ports over hardcoded)

    Write tests that would catch: missing server timeouts, swallowed bind
    errors, truthy string parsing bugs, unblocked sensitive endpoints,
    and missing security-function test coverage.
    When done, provide a summary of test files and test count.

  dev: |
    You are the Dev (Developer) for the pprof profiling feature.

    Your task is the GREEN phase of TDD:
    1. Read CLAUDE.md for project conventions
    2. Review the tests in internal/profiling/pprof_test.go
    3. Implement internal/profiling/pprof.go to make ALL tests pass
    4. Update main.go to integrate the profiling server
    5. Run `go test ./...` to verify all tests pass
    6. Run `make lint` to check for lint issues

    Key implementation details:
    - Opt-in via ENABLE_PPROF env var (use strconv.ParseBool)
    - Separate ServeMux (not DefaultServeMux) for isolation
    - Block /debug/pprof/cmdline (security — process args may contain secrets)
    - Validate PPROF_ADDR is loopback, warn if not
    - Set all HTTP server timeouts (Read, Write, ReadHeader, Idle)
      matching the health server pattern
    - Synchronous bind with async serve — return error on bind failure
    - Use charmbracelet/log for all logging (CLAUDE.md requirement)
    - Return shutdown closure for graceful cleanup

    Make the tests pass with clean, production-quality code.
    When done, provide a summary of files changed and test results.

  reviewer: |
    You are the Reviewer (Code Reviewer) for the pprof profiling feature.

    Your task is the REVIEW phase:
    1. Read CLAUDE.md for project conventions
    2. Read ALL code changes — pprof.go, pprof_test.go, main.go, docs
    3. Perform an adversarial security-focused review

    Check for:
    - Security: unauthenticated pprof endpoints, non-loopback binding,
      cmdline exposure, heap dump secret leakage (CVE-2019-11248)
    - Server config: all timeouts set matching health server pattern
    - Error handling: bind failures propagated, not swallowed in goroutines
    - CLAUDE.md compliance: charmbracelet/log, error wrapping, structured fields
    - Config parsing: ENABLE_PPROF=false should NOT enable profiling
    - Test quality: hardcoded ports, missing security function tests,
      regression tests for blocked endpoints
    - Documentation accuracy: claims matching actual behavior
    - Cross-reference: compare with health server for pattern consistency

    Be thorough. The goal is to catch issues the TEA and Dev may have missed.
    Output findings as a structured list: [SEVERITY] Finding title — description.
    Conclude with a verdict: APPROVED, APPROVED_WITH_FINDINGS, or CHANGES_REQUESTED.
