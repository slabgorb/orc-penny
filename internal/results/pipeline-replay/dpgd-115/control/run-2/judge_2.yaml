  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding: \"[TYPE] FieldRef::FromStr uses type Err = String \u2014\
    \ SOUL.md #5 requires domain error types, not string bags.\" While this targets\
    \ FieldRef::FromStr rather than AxiQLError specifically, the reviewer also noted\
