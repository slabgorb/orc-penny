- finding_id: I1
  title: "integer() panics on i64 overflow \u2014 process-level DoS (CWE-190/400)"
  weight: 8
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: "TEA wrote test `sql_limit_very_large_value_handles_overflow` (parser_security_test.rs)\
    \ which fails on i64 overflow panic. Dev fixed with `try_map` replacing `expect()`\
    \ in `integer()`. Reviewer VERIFIED: \"CWE-190 integer overflow fixed \u2014 parser.rs:133-149:\
    \ integer() uses try_map with s.parse::<i64>().map_err()\""
- finding_id: I2
  title: n as usize silent truncation on 32-bit targets (CWE-190)
  weight: 5
  phase_ideal: dev
  caught: true
  caught_by: dev
  evidence: 'Dev implemented `positive_usize()` using `usize::try_from(n).map_err()`
    for LIMIT/head/tail. Reviewer VERIFIED: "No `as usize` casts remain. Complies
    with rule #7." TEA also had test `pipe_head_large_value_no_silent_truncation`.'
- finding_id: I3
  title: "No input length limit on parse_axiql() \u2014 parser-level DoS (CWE-400)"
  weight: 7
  phase_ideal: tea
  caught: true
  caught_by: dev
  evidence: "Dev added MAX_INPUT_LENGTH (1MB) check in parse_axiql() before calling\
    \ parser. Reviewer VERIFIED: \"CWE-400 input length limited \u2014 parser.rs:30-38:\
    \ trimmed.len() > MAX_INPUT_LENGTH (1MB) returns error.\" TEA wrote `very_long_input_does_not_hang`\
    \ test. However, the ground truth specifies no length limit AND deeply nested\
    \ expressions causing super-linear parse time \u2014 the nesting depth limit also\
    \ addresses the nested AND/OR concern."
