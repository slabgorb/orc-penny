- finding_id: I10
  title: FieldRef::new() accepts invalid input at parser trust boundary
  weight: 7
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding: \"[TYPE] FieldRef::new('') / FromStr('') inconsistency\
    \ \u2014 new() silently produces empty segments, FromStr rejects. Rule #13 violation.\"\
    \ TEA also wrote test `field_ref_new_empty_should_reject`. However, the reviewer\
    \ dismissed it as non-blocking because \"parser's field_ref() combinator requires\
    \ at_least(1) identifier characters, so empty strings cannot reach FieldRef::new()\
    \ through the parser path.\" The finding was flagged but the security boundary\
    \ concern was downplayed."
