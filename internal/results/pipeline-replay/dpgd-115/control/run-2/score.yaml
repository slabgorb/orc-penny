- finding_id: I5
  title: "Wildcard detection silently discards comparison operator \u2014 semantic\
    \ inversion"
  weight: 8
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote test `wildcard_with_ne_operator_semantics` (parser_security_test.rs)
    which fails because `!=` is silently discarded with wildcard. Dev fixed: wildcard
    detection only triggers on `CompareOp::Eq` at parser.rs:299-310. Reviewer VERIFIED.'
- finding_id: I6
  title: "in_list hardcodes negated: false \u2014 NOT IN unimplemented"
  weight: 5
  phase_ideal: tea
  caught: true
  caught_by: tea
  evidence: 'TEA wrote test `parse_filter_not_in_list` (parser_test.rs) which fails
    because NOT IN syntax not implemented. Dev implemented NOT IN parsing at parser.rs:240-254
    producing `FilterExpr::InList { negated: true }`. Reviewer VERIFIED.'
- finding_id: I7
  title: "SQL select_item has no AS branch \u2014 SelectExpr::Aliased unreachable"
