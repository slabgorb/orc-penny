- finding_id: I9
  title: AxiQLError is a string-bag struct, not a thiserror enum
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: reviewer
  evidence: "Reviewer finding: 'FieldRef::FromStr uses type Err = String \u2014 violates\
    \ SOUL.md #5 Errors are domain knowledge, not strings' at query_types.rs:106.\
    \ Also flagged AxiQLError as related type design concern. Same vulnerability class\
    \ (string-bag errors instead of thiserror enum)."
- finding_id: I10
  title: FieldRef::new() accepts invalid input at parser trust boundary
  weight: 7
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: "TEA wrote test `field_ref_new_empty_should_reject` (query_types_edge_test.rs)\
    \ which fails because FieldRef::new('') silently succeeds. Reviewer confirmed\
    \ as finding: 'FieldRef::new(\"\") / FromStr(\"\") inconsistency \u2014 new()\
    \ silently produces empty segments, FromStr rejects. Rule #13 violation.' However,\
    \ Reviewer dismissed the security aspect, saying parser grammar prevents empty\
    \ strings from reaching new()."
- finding_id: I11
  title: FieldRef::Display breaks alias resolution for array-indexed fields
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: 'TEA wrote test `field_ref_display_from_str_roundtrip_with_array_index`
    (query_types_edge_test.rs) which fails because Display loses bracket notation.
    Dev fixed by adding `array_indices: Vec<bool>` to FieldRef to preserve bracket
    notation through Display. Reviewer VERIFIED roundtrip.'
- finding_id: I12
  title: "Alias resolution stops at depth 2 \u2014 3-hop chains silently truncate"
  weight: 5
  phase_ideal: reviewer
  caught: true
  caught_by: tea
  evidence: TEA wrote test `alias_chain_depth_three_resolves_fully` (aliases_test.rs)
    which fails because only 2-level chain resolution works. Dev implemented loop-based
    resolution up to 10 levels with cycle detection at aliases.rs:22-38. Reviewer
    VERIFIED.
