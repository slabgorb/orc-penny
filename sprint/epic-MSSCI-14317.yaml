id: epic-78
type: epic
title: 'Epic: Cyclist Permission System'
description: |
  Wire existing approval gate, hook script, WheelHub router,
  ApprovalModal, and grant storage into a single working permission
  flow. Remove the legacy IPC path. Enable one-time, session, and
  permanent permission grants through Cyclist UI.
priority: P0
status: in_progress
repos: pennyfarthing
jira: MSSCI-14317
points: 24
marker: cyclist
stories:
  - id: MSSCI-14318
    jira: MSSCI-14318
    title: Remove legacy IPC approval path
    description: |
      Remove old /approval-request endpoint from main.ts,
      Electron IPC permission-request/resolveHookApproval handlers,
      and interceptBashToolUse from approval-gate.ts. Generic
      interceptToolUse remains.
    points: 2
    priority: P0
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14320
    jira: MSSCI-14320
    title: Update and register PreToolUse hook
    description: |
      Update cyclist-pretooluse-hook.js to POST to
      /api/hook-request (not old /approval-request). Register
      hook in .claude/settings.local.json under hooks.PreToolUse.
      Handle WheelHub unreachable gracefully (return ask).
    points: 3
    priority: P0
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14321
    jira: MSSCI-14321
    title: Integrate grant checking into WheelHub hook router
    description: |
      Wire settings-store.ts grant checking into hook-request.ts
      handler. Auto-approve matching grants, broadcast to WebSocket
      when no match. Handle once/session/always grant lifecycle.
      Return ask when no UI clients connected.
    points: 3
    priority: P0
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14322
    jira: MSSCI-14322
    title: Mount ApprovalModal in React component tree
    description: |
      Import and render ApprovalModal in App.tsx at top level.
      Connect WebSocket subscription for hook-request events.
      Wire hook-response sending on user decision. Queue
      concurrent requests (show one at a time, no stacking).
    points: 3
    priority: P0
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14323
    jira: MSSCI-14323
    title: Add severity classification to hook request flow
    description: |
      Classify tool requests as safe/normal/destructive in
      WheelHub before broadcasting. Integrate dangerous-path.ts
      for path-based classification. Include severity and
      contextual warnings in WebSocket broadcast. Visual
      treatment in ApprovalModal (red border for destructive).
    points: 3
    priority: P1
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14324
    jira: MSSCI-14324
    title: Wire grant persistence across all three scopes
    description: |
      Ensure once grants auto-revoke after single use, session
      grants clear on session end, always grants persist to
      .claude/settings.local.json. Implement glob pattern
      matching for scope (e.g. npm * matches npm test).
    points: 3
    priority: P1
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14326
    jira: MSSCI-14326
    title: Workflow permission presets
    description: |
      Integrate workflow-permissions.ts schema into workflow
      startup. Show batch approval modal on agent activation
      when presets exist. Store approved presets as session grants.
    points: 2
    priority: P3
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14392
    jira: MSSCI-14392
    title: Agent-level permission scoping
    description: |
      Permission grants currently apply globally — any agent gets the
      same grants. Add agent identity to the permission request flow
      so grants can be scoped per-agent. Thread agent name through
      PreToolUse hook → WheelHub → ApprovalModal → grant storage.
      Enables rules like "allow dev to run bash freely but require
      approval for reviewer".
    points: 3
    priority: P1
    status: done
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-02-06'
  - id: MSSCI-14327
    jira: MSSCI-14327
    title: Smooth plan mode exit with tirepump choice
    description: |
      ExitPlanMode should transition smoothly without requiring
      manual user intervention to accept. After plan approval,
      offer a choice for whether to tirepump (commit/push) the
      resulting changes before continuing. Currently plan mode
      exit is clunky and requires the user to manually set
      accept mode.
    points: 2
    priority: P2
    status: done
    repos: pennyfarthing
    completed: '2026-02-06'
  - id: MSSCI-14395
    jira: MSSCI-14395
    title: Render AskUserQuestion tool via Reflector QuickActions
    description: |
      When Claude uses the AskUserQuestion tool, Cyclist renders it
      as a generic collapsed ToolCallBlock with raw JSON. The user
      has no way to select an answer. Fix: detect AskUserQuestion
      tool_use messages in the stream and render them through the
      existing Reflector QuickActions UI (buttons for choices,
      yes/no, open text). Send the user's selection back as a
      message via the /ws/claude WebSocket, same as existing
      QuickActions responses. Requires intercepting the tool_use
      in MessageView or ToolCallBlock and converting the tool
      input (questions array with options) into the QuickActions
      format that useMarkerActions already supports.
    points: 3
    priority: P1
    status: done
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - AskUserQuestion tool_use renders interactive buttons instead of collapsed JSON
      - Single-select questions show clickable option buttons
      - Multi-select questions show checkboxes or toggleable buttons
      - User selection is sent back to Claude via WebSocket as a message
      - Existing Reflector marker QuickActions continue to work unchanged
      - ToolCallBlock still renders normally for all other tool types
    completed: '2026-02-06'
