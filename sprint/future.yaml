                Document baseline alpha values per scenario.
              points: 2
              priority: P1
              status: planning
              repos: pennyfarthing
        - id: epic-45
          title: "Gold Standard References"
          description: |
            Add human-curated ideal responses to scenarios. Judge can use
            these as calibration references to reduce variance and provide
            consistent scoring anchored to known-good examples.

            Framework alignment: Level 3 improvement - calibration anchors.
            Per Wallach et al., operationalization needs clear anchoring to
            ensure consistent interpretation. Gold standards define what
            "high quality" looks like concretely, reducing subjective variance.

            Research basis: HELM uses reference implementations for
            calibration; MLPerf provides gold standards for comparison.
          points: 8
          priority: P2
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
