future:
  initiatives:
    - name: "Benchmark Reliability"
      description: |
        Research-backed improvements to agent benchmarking methodology.
        Based on HELM (Stanford CRFM), ARC-AGI, and MLPerf methodologies.

        Grounded in measurement theory from Wallach et al. (2025) "Position:
        Evaluating Generative AI Systems Is a Social Science Measurement Challenge"
        (ICML 2025, https://arxiv.org/abs/2502.00561).

        Key insight: AI evaluation is a measurement challenge requiring the same
        rigor social scientists apply to measuring abstract constructs. Our epics
        implement the four-level measurement framework:
        - Level 1: Background Concept (what we care about)
        - Level 2: Systematized Concept (scoped definition)
        - Level 3: Operationalization (measurement procedure)
        - Level 4: Scores/Indicators (numeric outputs)

        See: pennyfarthing-dist/guides/measurement-framework.md
      status: research_complete
      blocked_by: "Need stable benchmark baseline before measuring improvements"
      total_points: 44
      research_references:
        - title: "Position: Evaluating Generative AI Systems Is a Social Science Measurement Challenge"
          authors: "Wallach, Desai, Cooper, Wang, et al."
          venue: "ICML 2025"
          url: "https://arxiv.org/abs/2502.00561"
          key_insight: "Four-level measurement framework; construct validity; inter-rater reliability"
      epics:
        - id: epic-41
          title: "Precision/Recall Detection Scoring"
          description: |
            Separate detection scoring into precision and recall components.
            Current formula conflates finding issues with avoiding false positives.
            New approach makes trade-offs explicit and measurable.

            Framework alignment: Level 4 improvement - separate scores for
            distinct constructs (finding issues vs. avoiding false alarms).
            Addresses the anti-pattern of conflating operationalization with construct.

            Research basis: HELM benchmark methodology (Stanford CRFM)
          points: 8
          priority: P1
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "41-1"
              title: "Update judge SKILL.md with precision/recall formula"
              description: |
                Replace current detection formula:
                  detection = criticals×15 + highs×10 + mediums×5 + lows×2 + novel×5 - false_positives×5
                With precision/recall:
                  precision (25 pts) = true_positives / (true_positives + false_positives) × 25
                  recall (25 pts) = true_positives / total_baseline_issues × 25
                Update checklist rubric prompt and JSON output format.
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "41-2"
              title: "Update judge JSON output schema"
              description: |
                New detection output format:
                ```json
                {
                  "detection": {
                    "true_positives": 8,
                    "false_positives": 1,
                    "total_baseline": 10,
                    "precision": 0.89,
                    "recall": 0.80,
                    "precision_score": 22.2,
                    "recall_score": 20.0,
                    "subtotal": 42.2
                  }
                }
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "41-3"
              title: "Regression test: compare new vs old scores"
              description: |
                Run judge with both formulas on existing benchmark results.
                Verify correlation > 0.9 to ensure new formula doesn't
                dramatically alter rankings while adding precision/recall insight.
              points: 3
              priority: P1
              status: planning
              repos: pennyfarthing
        - id: epic-42
          title: "Anchored Rubric Criteria"
          description: |
            Replace vague rubric criteria ("clear_explanations") with behavioral
            anchors that define what each score level means concretely.

            Framework alignment: Level 3 improvement - operationalization with
            explicit behavioral anchors. Per Wallach et al., "A benchmark score
            tells us nothing without understanding the construct it purports to
            measure." Anchors make the construct explicit at each score level.

            Research basis: 2025 research shows few-shot doesn't fix judge
            self-inconsistency; explicit anchors reduce variance.
          points: 6
          priority: P1
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "42-1"
              title: "Create rubric-anchors.md with behavioral scales"
              description: |
                New file: pennyfarthing-dist/skills/judge/rubric-anchors.md
                Define score anchors for each dimension:
                - clear_explanations (1-10): what constitutes each level
                - actionable_fixes (1-10): concrete examples per score
                - in_character (1-10): persona consistency indicators
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "42-2"
              title: "Reference anchors in judge prompts"
              description: |
                Update judge SKILL.md checklist prompt to include
                anchor reference. Judge should consult anchors when
                assigning quality/persona dimension scores.
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "42-3"
              title: "Variance test: measure CV reduction"
              description: |
                Re-run TEA benchmarks with anchored rubric.
                Target: CV reduction from 25-65% to < 15%.
              points: 1
              priority: P1
              status: planning
              repos: pennyfarthing
        - id: epic-43
          title: "False Positive Traps (Red Herrings)"
          description: |
            Add intentional non-issues to scenarios to systematically measure
            precision. Agents that flag red herrings as issues lose points;
            agents that correctly identify them as non-issues get bonus.

            Framework alignment: Level 3 improvement - tests construct validity.
            Per Wallach et al., valid measurement requires evidence that scores
            DON'T correlate with unrelated constructs. Red herrings test whether
            high detection scores reflect true understanding vs. pattern matching.

            Research basis: ARC-AGI distinguishes novel reasoning from
            pattern matching; red herrings test true understanding.
          points: 7
          priority: P1
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "43-1"
              title: "Add red_herrings schema to scenarios"
              description: |
                New scenario field:
                ```yaml
                red_herrings:
                  - id: LOOKS_LIKE_SQLI_BUT_PARAMETERIZED
                    location: "line 45"
                    description: "Appears to be SQL injection but uses parameterized query"
                    trap_type: false_security_alarm
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "43-2"
              title: "Update judge for red herring detection"
              description: |
                Scoring for red herrings:
                - Agent flags red herring as issue: -5 points (false positive)
                - Agent correctly identifies as not-an-issue: +2 bonus
                Add to judge checklist prompt and output format.
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "43-3"
              title: "Pilot: Add red herrings to order-service scenario"
              description: |
                Add 2 red herrings to order-service.yaml:
                1. Code that looks like SQL injection but is parameterized
                2. "Missing" error handling that's actually handled upstream
                Run benchmark to validate trap detection scoring.
              points: 3
              priority: P1
              status: planning
              repos: pennyfarthing
        - id: epic-44
          title: "Multi-Judge Validation"
          description: |
            Measure judge reliability by running multiple judges with prompt
            variations. Calculate Krippendorff's Alpha to quantify inter-rater
            reliability. Flag results when Alpha < 0.65.

            Framework alignment: Reliability evidence. Per Wallach et al.,
            "Annotator disagreement is not noise to be averaged away—it is
            meaningful data about construct complexity." Multi-judge validation
            quantifies measurement reliability and identifies constructs that
            need clearer operationalization.

            Research basis: Krippendorff's Alpha is standard for inter-rater
            reliability; 2025 research recommends Gwet's AC2 for skewed data.
          points: 10
          priority: P2
          marker: "benchmark"
          repos: pennyfarthing
          status: planning
          stories:
            - id: "44-1"
              title: "Add --multi-judge flag to /solo command"
              description: |
                New flag: `/solo theme:agent --scenario X --multi-judge`
                Runs judge 3 times with prompt variations:
                - "You are an impartial judge..."
                - "As a neutral evaluator..."
                - "Evaluate this response objectively..."
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "44-2"
              title: "Implement Krippendorff's Alpha calculation"
              description: |
                Calculate alpha across dimension scores from multiple judges.
                Return alpha value with interpretation:
                - α > 0.80: excellent agreement
                - α 0.65-0.80: acceptable
                - α < 0.65: unreliable, flag for review
              points: 3
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "44-3"
              title: "Update finalize-run for multi-judge storage"
              description: |
                New storage format in results:
                ```yaml
                judge:
                  mode: multi
                  iterations: 3
                  krippendorff_alpha: 0.72
                  scores_per_judge: [85, 82, 87]
                  final_score: 85  # median
                ```
              points: 2
              priority: P0
              status: planning
              repos: pennyfarthing
            - id: "44-4"
              title: "Multi-judge test on high-variance scenarios"
              description: |
