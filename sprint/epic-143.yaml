id: '143'
type: epic
title: Native Subagent Migration
description: |
  Migrate all Pennyfarthing agent personas from in-conversation persona switching
  to native Claude Code subagents (.claude/agents/*.md), giving each agent an
  isolated context window with role-specific tool restrictions. SM remains the
  main conversation orchestrator, spawning 10 agents as subagents.
