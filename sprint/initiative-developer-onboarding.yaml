name: "Developer Discovery & Onboarding"
description: |
  New developers installing Pennyfarthing struggle with discovery at every stage.
  The system has 60 commands, 18 agents, 33 guides, and sophisticated workspace
  tooling, but all of it is pull-based: you must already know it exists to find it.
  This initiative creates the missing "read this first" guide, surfaces entry points
  in the welcome banner, documents what the system does automatically, teaches Claude
  to suggest capabilities proactively, and removes deprecated command noise.
