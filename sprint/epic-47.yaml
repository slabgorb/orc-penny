id: '47'
type: epic
title: Theme Schema & Python Port
description: Formalize theme YAML schema, port JS/TS theme utilities to Python pf CLI, add schema validation
priority: p1
status: backlog
repos: pennyfarthing
stories:
  - id: 47-1
    title: Port theme TS/JS utilities to Python pf CLI
    description: 'Port ~1,590 lines of theme-related TypeScript/JavaScript to Python in the pf CLI package. Files: themes.ts (461L, loading/parsing/validateThemeSchema), add-ocean-profiles.ts (731L, batch OCEAN addition), validate-ocean-profiles.ts (181L, OCEAN completeness check), theme-loader.ts (115L, types/CLI delegation), migrate-theme-schema.mjs (102L, schema migrations). The Python port should live in pf/theme/ and expose equivalent CLI commands via pf theme validate, pf theme migrate, etc.'
    points: 5
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - pf theme validate runs schema validation on all theme YAML files (equivalent to validateThemeSchema)
      - pf theme validate-ocean checks OCEAN profile completeness (equivalent to validate-ocean-profiles.ts)
      - pf theme add-ocean batch-adds OCEAN profiles to themes missing them (equivalent to add-ocean-profiles.ts)
      - pf theme migrate runs schema migrations (equivalent to migrate-theme-schema.mjs)
      - Theme loading/parsing logic available as Python library (pf.theme.loader) for use by benchmark scripts
      - All existing TS/JS theme files marked deprecated with pointers to Python equivalents
      - Tests cover validation, OCEAN checks, and migration on mock theme fixtures
    type: refactor
  - id: 47-2
    title: Create formal theme YAML schema from existing data
    description: Survey all 100+ theme YAML files to extract the actual field vocabulary, then create a formal schema (theme-schema.yaml) that documents all required/optional fields, enumerates valid values for dimensions, tiers, categories, and OCEAN ranges. Add pf theme validate --schema command to check themes against it.
    points: 3
    priority: p0
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - theme-schema.yaml created in pennyfarthing-dist/personas/ documenting full theme structure
      - 'Schema covers: top-level keys, theme section, dimensions vocabulary, zeitgeist, agent fields, additional_characters'
      - All existing themes pass schema validation
      - New dimensions added for benchmark slicing (medium, decade, geographic-origin, ensemble-size)
      - pf theme validate --schema checks themes against the formal schema
