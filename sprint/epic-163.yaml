  - id: 163-10
    title: 'pf init ships broken generated files: justfile.pf references undeclared {{root}} (every just invocation fails at parse); question-reflector-check.sh calls removed reflector-check subcommand (gh #149)'
    description: "From gh #149 (observed pf 13.3.0). Two package-managed files generated into .pennyfarthing/ are broken on arrival: (1) justfile.pf references {{root}} in five recipes but its contract ('Requires root := justfile_directory() in the parent justfile') is neither satisfied by pf init nor verified — just fails at PARSE time, breaking every just invocation, not only pf recipes. (2) question-reflector-check.sh calls the removed 'reflector-check' CLI subcommand. Class root cause: .pennyfarthing/ is overwritten on every pf update, so hand-fixes silently regress — generated-file contracts must be satisfied by the generator. Fix both files upstream + add a doctor/init check that generated-file contracts hold."
    points: 2
    priority: p2
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: bug
