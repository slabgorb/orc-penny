  - id: 163-6
    title: 'pf context validate rejects the markdown docs pf context create emits (gh #140)'
    description: "From gh #140. 'pf context validate <file>' parses its input as YAML, but 'pf context create' emits MARKDOWN (sprint/context/context-*.md). So validate rejects the very documents create generates — every epic/story context doc fails with a raw PyYAML error ('Invalid YAML: expected <document start>...') at the first prose paragraph, making the validate workflow a no-op on real projects. The handoff gate (pf/handoff/complete_phase.py) only checks existence + non-emptiness, so stories are NOT blocked (low severity), but the raw parse error sends users down a false 'my context doc is malformed' path. Confirmed pf 13.3.0. Fix (preferred): pf context validate understands the markdown context documents create emits and checks the structural contract (required sections: ## Title, ## Overview, ## Metadata, non-empty ## Background, etc.). Minimum acceptable: detect .md / non-YAML input and fail with an actionable message naming the format mismatch instead of a PyYAML traceback fragment."
    points: 2
    priority: p3
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - 'pf context validate succeeds against the markdown docs pf context create emits (round-trip: create then validate passes)'
      - 'validate checks the markdown structural contract (required sections present + non-empty ## Background)'
      - On genuinely malformed/non-context input, validate fails with an actionable message about the format, not a raw PyYAML traceback fragment
    type: bug
