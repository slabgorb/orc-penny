  - id: 117-1
    jira: MSSCI-15311
    title: Ship pyproject.toml in npm package for consumer Python hooks
    description: The npm package bundles pennyfarthing_scripts/ Python source but no pyproject.toml. All hooks delegate to uv run --project which requires pyproject.toml. Consumer projects must manually create one. Ship a template pyproject.toml in the npm package and auto-generate it during postinstall.
    points: 3
    priority: p0
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-19'
    workflow: tdd
    completed: '2026-02-19'
    review_verdict: approved
  - id: 117-2
    jira: MSSCI-15312
    title: Generate hook commands with pf.sh wrapper path, not bare pf
    description: 'settings.local.json hook generation writes bare pf commands which are not in PATH. The pf CLI is only available via uv run or the pf.sh wrapper. Generate hooks using the pf.sh wrapper path instead: $CLAUDE_PROJECT_DIR/.pennyfarthing/scripts/core/pf.sh hooks <subcommand>.'
    points: 2
    priority: p0
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-19'
    workflow: tdd-tandem
    completed: '2026-02-19'
    review_verdict: approved
  - id: 117-3
    jira: MSSCI-15313
    title: Postinstall cleanup of stale pre-11.x artifacts
    description: 'Upgrading from v8.x-v10.x leaves stale artifacts: .claude/manifest.json, .claude/personas/, non-prefixed commands (41 extras) and skills (22 extras). The postinstall/update command should detect and remove these v8-era artifacts.'
    points: 3
    priority: p1
    status: backlog
    workflow: tdd
  - id: 117-4
    jira: MSSCI-15314
    title: Ensure project hook templates have execute permission
    description: Project hook scripts (setup-env.sh etc) generated by init/update are created with 644 permissions instead of 755. Causes Permission denied on session start. Ensure chmod +x on all generated hook scripts.
