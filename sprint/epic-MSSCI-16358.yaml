id: '143'
type: epic
title: Native Subagent Migration
description: |
  Migrate all Pennyfarthing agent personas from in-conversation persona switching
  to native Claude Code subagents, giving each agent an isolated context window
  with role-specific tool restrictions. Agent definitions live in
  pennyfarthing-dist/agents/native/ (distributed source of truth); consumer
  projects access them via .claude/agents/ symlink. SM remains the main
  conversation orchestrator, spawning 10 agents as subagents.
priority: p0
status: active
repos: pennyfarthing
jira: MSSCI-16358
