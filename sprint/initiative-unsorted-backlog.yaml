  - id: ub-1
    title: Adopt research spike repo structure and orchestrator-side tracking
    description: |
      Bring the spike repo pattern established in poller-orchestrator (PR #12)
      and spike-ocsf-rs1 to pennyfarthing-orchestrator. Creates the
      orchestrator-side infrastructure for running research spikes with
      dedicated repos.

      Deliverables:
      - spikes/index.md: Index of active/completed spikes (repo links, Jira,
        charters, fold-back status)
      - spikes/_templates/charter.md: Parameterized charter template
        (hypothesis, questions, methods, timebox, success criteria, parent
        context, scope boundaries)
      - spikes/_templates/spike-repo-CLAUDE.md: CLAUDE.md template for new
        spike repos (directory structure, working patterns, artifact flow)
      - spikes/_templates/spike-repo-README.md: README template for new spike
        repos (hypothesis, scope, structure, lifecycle)
      - Fold-back process documented in index.md
      - CLAUDE.md updated with spikes/ in repository structure table

      Out of scope: automation (repo creation scripts, GH Actions), migrating
      existing research artifacts, BikeLane/workflow changes.

      Pattern references:
      - https://github.com/1898andCo/spike-ocsf-rs1
      - https://github.com/1898andCo/poller-orchestrator/pull/12
      - docs/lifecycle-improvement-rs.md section D
    points: 3
    priority: p2
    status: backlog
    repos: orchestrator
    workflow: trivial
    type: chore
