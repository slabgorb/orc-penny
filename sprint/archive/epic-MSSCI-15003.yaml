id: '106'
type: epic
title: Gate Files & First Migration
description: 'Create gate file schema and first gate file (tests-pass.md). Gate subagent runner spawns haiku Task, returns GATE_RESULT. Workflow YAML supports gate.file references. TDD workflow uses file-based gate for green phase.'
priority: P1
status: done
repos: pennyfarthing
jira: MSSCI-15003
stories:
  - id: 106-1
    jira: MSSCI-15004
    title: Create tests-pass gate file with schema
    description: |
      Create pennyfarthing-dist/gates/tests-pass.md as the first gate file.
      Uses <gate name="tests-pass" model="haiku"> schema with <purpose>,
      <pass>, and <fail> blocks. Pass block instructs evaluator to report
      test count, coverage, branch status. Fail block reports failing test
      files/lines, uncommitted files, with recovery guidance.
    points: 1
    priority: P1
    status: done
    assigned_to: keith.avery@1898andco.io
    repos: pennyfarthing
    workflow: trivial
    completed: '2026-02-15'
  - id: 106-2
    jira: MSSCI-15005
    title: Gate subagent runner with GATE_RESULT contract
    description: |
      Gate runner spawns a gate file as a haiku Task subagent and returns
      structured GATE_RESULT: {status: pass|fail, message, checks}.
      Supports model attribute (default haiku, override per gate).
      Default-deny: no GATE_RESULT = fail. GATE_RESULT extraction via
      regex/grep, not full YAML parser. Gate files are read-only at runtime.
    points: 3
    priority: P1
    status: done
    assigned_to: keith.avery@1898andco.io
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-02-15'
  - id: 106-3
    jira: MSSCI-15006
    title: Workflow YAML gate.file integration
    description: |
      Add gate.file field to workflow YAML schema. resolve-gate checks
      file first, falls back to type (backward compat). Update tdd.yaml
      green phase to gate: {file: gates/tests-pass}. Both file and type
      coexist during migration period.
    points: 2
    priority: P1
    status: done
    assigned_to: keith.avery@1898andco.io
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-02-15'
  - id: 106-4
    jira: MSSCI-15007
    title: Gate file discovery and resolution
    description: |
      Gate file resolution order: .pennyfarthing/gates/{name}.md
      (project-local) then pennyfarthing-dist/gates/{name}.md (built-in).
      Project-local overrides built-in. Non-existent file with no type
      fallback returns status:blocked. Add gates/ symlink to
      pennyfarthing init/update following existing symlink pattern.
    points: 1
    priority: P1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-15'
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-02-15'
initiative: gate-extraction
