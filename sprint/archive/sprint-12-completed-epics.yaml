    title: 'Epic: Separate Meta Scripts from Distributed Scripts'
    description: 'Currently scripts/ at root and pennyfarthing-dist/scripts/ overlap

      in confusing ways. deploy.sh exists in both places. This causes

      confusion about which script is used where.


      Clean separation:

      - scripts/ - pennyfarthing development only (deploy, release, CI)

      - pennyfarthing-dist/scripts/ - only what users get installed


      Acceptance criteria:

      - No script duplication between directories

      - Clear documentation of which scripts go where

      - /release command uses scripts/deploy.sh (meta)

      - User projects only get pennyfarthing-dist/scripts/*

