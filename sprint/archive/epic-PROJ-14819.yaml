id: '101'
type: epic
title: BikeRack Mode — Decoupled WheelHub Dashboard
description: Decoupled WheelHub dashboard for CLI-first developers. Panels served individually via browser tabs, OTEL telemetry from standalone Claude CLI. See ADR-0024 and sprint/planning/bikerack-prd.md.
priority: P1
status: done
repos: pennyfarthing
jira: PROJ-14819
stories:
  - id: 101-1
    title: isBikeRackMode() gate and bikerack.ts entry point
    description: |
      Add centralized BikeRack mode detection and a new server entry point
      that starts WheelHub without ClaudeService.

      Files:
      - NEW: src/bikerack.ts — sets IS_BIKERACK=1, calls createTerminalServer(),
        listens on port 2898, writes .bikerack-port after listen() callback
      - MODIFY: src/server.ts — export isBikeRackMode() function, use
        .bikerack-port when in BikeRack mode (~10 lines)
      - MODIFY: src/websocket.ts — skip /ws/claude setup when
        isBikeRackMode() (~3 lines guard)

      ACs:
      - [ ] isBikeRackMode() exported from server.ts, checks process.env.IS_BIKERACK === '1' (Rule 1)
      - [ ] No direct process.env.IS_BIKERACK checks outside isBikeRackMode() (Rule 1)
      - [ ] bikerack.ts sets IS_BIKERACK=1 before any imports that check it (Rule 9)
      - [ ] bikerack.ts does NOT go through main.ts (Rule 9)
      - [ ] Port file written AFTER server.listen() callback (CE-3)
      - [ ] Port file is .bikerack-port, not .cyclist-port (Rule 4)
      - [ ] Default port 2898 with auto-increment on conflict (Rule 6)
      - [ ] /ws/claude WebSocket skipped in BikeRack mode
      - [ ] pnpm build succeeds
      - [ ] Existing Cyclist tests pass unchanged

      Ref: ADR-0024, Rules 1/4/6/9, CE-3
    points: 2
    priority: P0
    status: done
    repos: pennyfarthing
    workflow: tdd-tandem
    completed: "2026-02-11"
  - id: 101-2
    title: StandalonePanel wrapper and ?panel=X client routing
    description: |
      Add client-side routing that detects ?panel=X in the URL and renders
      a single panel full-screen instead of the dockview workspace.

      Files:
      - NEW: src/public/components/StandalonePanel.tsx — PANEL_REGISTRY mapping
        panel names to components, full-viewport wrapper, "Panel not found"
        fallback with link to /bikerack
      - MODIFY: src/public/App.tsx — check ?panel= before rendering
        DockviewWorkspace (~15 lines)

      ACs:
      - [ ] ?panel=sprint renders SprintPanel full-screen
      - [ ] All 12 existing panels in PANEL_REGISTRY (sprint, git, diffs, todos,
            workflow, background, audit, changed, ac, tty, debug, bikelane)
      - [ ] PANEL_REGISTRY is single source of truth for routing (CE-2)
      - [ ] Invalid ?panel= value shows "Panel not found" with link to /bikerack
      - [ ] No dockview-react imports in StandalonePanel (Rule 7)
      - [ ] No BikeRack-specific props passed to panels (Rule 2)
      - [ ] BikeRack detection is URL-based only — ?panel= presence (Rule 10)
      - [ ] Normal / URL still loads dockview workspace
      - [ ] pnpm build succeeds

      Ref: ADR-0024, Rules 2/7/10, CE-2
    points: 3
    priority: P0
    status: done
    repos: pennyfarthing
    workflow: tdd-tandem
    completed: "2026-02-11"
