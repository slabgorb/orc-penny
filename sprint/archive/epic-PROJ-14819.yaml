  - id: 101-4
    title: PortraitPanel with tandem support
    description: |
      New standalone panel displaying agent identity (character, role,
      portrait image) with tandem backseat support.

      Files:
      - NEW: src/public/components/panels/PortraitPanel.tsx — subscribes
        to /ws/persona via usePersona() hook, displays portrait image
        from /portraits/{theme}/medium/{slug}.png, shows tandem agent
      - MODIFY: src/public/components/panels/index.ts — export PortraitPanel

      ACs:
      - [ ] PortraitPanel uses existing usePersona() hook (CE-1)
      - [ ] No new WebSocket connections or endpoints (CE-5, Rule 3)
      - [ ] Displays character name, role, portrait image
      - [ ] Shows tandem agent when active (tandemAgent data)
      - [ ] Shows "No agent active" state when no persona data
      - [ ] Portrait URL resolved via /portraits/{theme}/medium/{slug}.png
      - [ ] Renders correctly in StandalonePanel wrapper via ?panel=portrait
      - [ ] pnpm build succeeds

      Ref: ADR-0024, Rules 2/3, CE-1/CE-5, Contract 4
    points: 2
