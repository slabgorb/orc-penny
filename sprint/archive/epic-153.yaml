  - id: 153-9
    title: Fix test_git_utils.py leaking a feature/test checkout onto the live repo (full pytest suite silently switches the working branch)
    description: "Running the full pytest suite (`pytest pennyfarthing-dist/src/pf/tests/`) silently switches the live working tree onto a stale branch named 'feature/test'. Root cause: test_git_utils.py exercises git_utils.create_or_checkout_branch / create_feature_branches with branch 'feature/test'; despite isolated temp_git_repo / sample_repos (tmp_path) fixtures, a checkout leaks onto the process cwd (the real repo). The leaked branch predates recent work (e.g. loader.py without find_story_in_data), breaking imports and cascading bogus failures across unrelated modules. Discovered during 153-3, where it corrupted the branch mid-implementation twice; full incident account in sprint/archive/153-3-session.md (Dev Incident section). Fix: pin every git operation in the helper to the explicitly-passed repo path (never fall back to cwd), and add a regression test asserting the helper never mutates the outer/live repository's checked-out branch."
    points: 3
    priority: p1
    status: done
    started: '2026-06-04'
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - Running the full pytest suite leaves the working tree on its original branch — no 'feature/test' (or any) checkout leaks onto the live repo
      - create_or_checkout_branch and create_feature_branches pin all git subprocess calls to the passed repo path; none rely on process cwd
      - A regression test asserts the helper does not change the branch of a repository other than the one explicitly passed in
      - The git_utils tests run hermetically against tmp_path fixtures only, with no side effects on the surrounding repository
    completed: '2026-06-04'
    type: bug
    review_findings: "Rework merged in PR #87; all 5 rejection findings addressed (returncode==0 liveness gate, _make_repo git-checked + develop assert, subprocess timeout, AST-based static guard, partial-failure outcome assertions). Re-review skipped per author."
    review_verdict: approved
  - id: 153-10
    title: Refresh XDG portrait cache on content change, not just pf version bump
    description: "Re-rendering or resizing portraits within the same pf version never propagates to consumer projects. _install_portraits (init/core.py:1158) skips the copy whenever manifest.pf_version == __version__, so the shared cache at ~/.local/share/pennyfarthing/portraits/ goes stale until manually mirrored (rsync). Any co-* project symlinked to that cache shows stale/blank portraits. Root cause: freshness is keyed on the version string, but portrait content changes independently of version (renders, resizes, restyles all land without a bump). Fix: add a cheap stat-only source fingerprint (sha256 over sorted '{relpath}\\t{size}' for *.png under the source; optionally include mtime_ns to catch same-size re-renders) to the manifest, and re-copy when EITHER pf_version OR source_fingerprint differs. Add a pf init --force-portraits escape hatch and consider surfacing staleness in pf health-check. Note: _install_portraits is currently only mocked in tests (test_init_custom_agents.py:456), never exercised."
    points: 2
    priority: p3
    status: done
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - Same pf version + changed source content re-copies portraits to XDG
      - Same pf version + unchanged source skips (idempotent, no needless copy)
      - Missing/old manifest copies (existing behavior preserved)
      - Manifest records source_fingerprint
      - Unit tests cover all three guard branches (currently _install_portraits is only mocked, never run)
    completed: '2026-06-03'
  - id: 153-11
    title: pf doctor doesn't verify the project-local .pennyfarthing/bin/pf shim — stays green while every 'just pf' recipe and the statusline hook are broken
    description: |-
      Surfaced in oq-2 (2026-06-03): `just pf launch frame` failed with "/Users/slabgorb/Projects/oq-2/.pennyfarthing/bin/pf: No such file or directory". The project-local shim (.pennyfarthing/bin/pf, written by pf init via write_shim in init/core.py:409) was absent — gitignored (.gitignore:51) so never committed; a git clean or a clone that never ran init leaves it gone. Every `just pf *` recipe (justfile.pf) and the Claude statusline hook (init/core.py:34,885 → ".pennyfarthing/bin/pf hooks statusline") depend on it.

      The blind spot: `pf doctor` checks python_install = "pf CLI found on PATH" (the GLOBAL binary) but never the project shim, so doctor reported "All checks passed" while every just-pf recipe and the statusline were broken. Doctor is the first thing a confused downstream user runs; it must catch this.

      Fix: add a doctor check (e.g. project_shim) that verifies .pennyfarthing/bin/pf exists, is executable, and successfully execs (pf --version via the shim). On failure, emit a clear remediation pointing at `pf init` (which is idempotent and regenerates the shim). Audit of all local consumers found oq-1/2/3/4, orc-penny, words, cards-lib, thecat, slabgorb.github.io healthy; only oq-2 (now hand-fixed) and the dormant python-sidequest reference repo were missing it.
    points: 2
    priority: p2
    status: done
    started: '2026-06-10'
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - pf doctor adds a check that verifies .pennyfarthing/bin/pf exists, is executable, and execs successfully (pf --version through the shim)
      - When the shim is missing/broken/stale, doctor FAILS (non-green) with remediation pointing at `pf init`
      - When the shim is present and working, the check passes; idempotent with existing doctor output
      - 'Regression test covers all three states: missing, present-but-not-executable, and present-and-working'
    completed: '2026-06-10'
    type: bug
    review_verdict: approved
