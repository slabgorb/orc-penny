  - id: 44-4
    jira: PROJ-16218
    title: Multi-judge test on high-variance scenarios
    description: |
      Run multi-judge (N=3) on 5 scenarios known to have high score variance in existing single-judge runs. Compare single-judge vs multi-judge agreement. Report whether ensemble scoring reduces effective variance (CV of aggregated means < CV of single-judge scores). This validates that multi-judge actually improves reliability in our specific context. Research basis: PersonaGym found model complexity doesn't predict persona capability; our multi-judge test determines whether judge ensemble actually reduces variance vs just adding cost.
    points: 2
    priority: p1
    status: canceled
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - 5 high-variance scenarios identified from existing baseline data (highest std_dev in single-judge runs)
      - Each scenario run with --multi-judge 3 (3 judges x 3 runs = 9 judge invocations per scenario)
      - 'Report: Krippendorff Alpha per scenario, CV comparison (single vs multi), dimension-level agreement'
      - Results stored in internal/results/multi-judge-validation/ for historical tracking
      - 'Written summary: does multi-judge reduce effective variance? By how much? Cost analysis (tokens/run)'
