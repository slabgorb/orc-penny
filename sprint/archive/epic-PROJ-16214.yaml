  - id: 44-1
    jira: PROJ-16215
    title: Add --multi-judge flag to /solo command
    description: |
      Add --multi-judge N flag to the /solo command that invokes the judge N times per agent run (default N=3). Each judge invocation uses the same rubric but receives the scenario/response in randomized presentation order to control position bias (Galileo framework recommendation). Results stored as array of verdicts alongside aggregated mean score.
    points: 3
    priority: p0
    status: done
    assigned_to: keith.avery@slabgorb.io
    started: '2026-03-05'
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - /solo theme:agent --scenario X --multi-judge 3 invokes judge 3 times per run
      - Each judge invocation randomizes presentation order of scenario context
      - Judge verdicts stored as array in runs/judge_{i}.json with judges[] and aggregated fields
      - Aggregated score (mean of weighted_totals) used as the run's canonical score
      - --multi-judge 1 behaves identically to current single-judge (backward compat)
      - Summary YAML includes judge_agreement section with per-run agreement stats
    completed: '2026-03-05'
    review_verdict: approved
  - id: 44-2
    jira: PROJ-16216
    title: Implement Krippendorff Alpha calculation
    description: |
      Implement Krippendorff's Alpha (interval scale) for measuring inter-rater agreement across N judges. Also compute Cronbach's alpha for internal consistency. Both operate on the 1-10 dimension scores (not just the 1-100 total). Report agreement per dimension (correctness, depth, quality, persona) to identify which dimensions judges disagree on most. Research basis: Galileo framework recommends Cronbach's alpha + McDonald's omega; PersonaGym uses multi-evaluator ensemble. Krippendorff's Alpha is preferred over Fleiss' kappa because our scores are ordinal/interval (1-10), not categorical.
    points: 3
    priority: p0
    status: done
    assigned_to: keith.avery@slabgorb.io
    started: '2026-03-06'
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - calculateKrippendorffAlpha(judges number[][]) function in benchmark module
      - calculateCronbachAlpha(judges number[][]) function in benchmark module
      - Agreement calculated per dimension AND overall
      - 'Interpretation thresholds: alpha >= 0.8 = reliable, 0.67-0.8 = acceptable, < 0.67 = unreliable'
      - Unreliable dimensions flagged in output with recommendation to revise rubric anchors
      - Unit tests with known agreement matrices (perfect agreement, zero agreement, moderate agreement)
      - Functions exported from packages/core/src/benchmark/index.ts
    completed: '2026-03-06'
    review_verdict: approved
