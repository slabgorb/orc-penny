id: epic-86
title: "Agent Collaboration — Tandem to Teams"
description: |
  Phase 1 (15 pts): Tandem consultation protocol — workflow YAML
  tandem: blocks, structured request/response with Sonnet partner,
  dialogue file persistence, agent tandem awareness, templates.

  Phase 2 (16 pts): Phase-scoped native Agent Teams — feature detection,
  lightweight teammate activation via spawn prompts, team: block on
  workflow phases, phase-scoped lifecycle with TeammateIdle/TaskCompleted
  hook-based gates, team-mode agent behavior protocol, team workflow
  templates.

  Phase 3 (8 pts): Cyclist integration — TandemPanel for dialogue
  visualization, TeamPanel for native team status/messaging.
priority: P1
status: done
