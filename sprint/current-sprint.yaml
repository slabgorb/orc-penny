      - id: MSSCI-14187
        title: '[BUG] Tab overflow - hidden tabs have no way to be accessed'
        description: |
          When sidebars have more tabs than can fit in the visible area, users have

          no way to access the hidden tabs. Dockview's built-in tab overflow dropdown

          is not appearing.


          **Observed behavior:**

          - More tabs exist than visible space allows

          - No scroll, no dropdown, no way to access hidden tabs

          - Panel restore menu only shows closed panels, not overflow tabs


          **Expected behavior:**

          - Dockview should show overflow dropdown (`.dv-tabs-overflow-dropdown-root`)

          - Or tabs should be horizontally scrollable with visible scrollbar

          - Hidden tabs should be accessible via some UI mechanism


          **Investigation findings:**

          - Dockview has `disableTabsOverflowList` option (defaults to enabled)

          - OverflowObserver uses ResizeObserver to detect scrollWidth > clientWidth

          - When overflow detected, dropdown button appears in `.dv-right-actions-container`

          - Our CSS does NOT explicitly hide the dropdown


          **Potential causes:**

          1. `.dv-right-actions-container` has no allocated space

          2. OverflowObserver not triggering (tabs fit or resize event missed)

          3. CSS `overflow: hidden` on parent clipping the dropdown


          **Files to investigate:**

          - `packages/cyclist/src/public/components/DockviewWorkspace.tsx`

          - `packages/cyclist/src/public/styles/dockview-theme.css`

          - Browser DevTools: check for `.dv-tabs-overflow-dropdown-root` in DOM
        points: 3
        priority: P1
        type: bug
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - All sidebar tabs are accessible (via overflow dropdown or scroll)
          - Dockview overflow dropdown appears when tabs exceed visible width
          - OR horizontal tab scroll with visible scrollbar works
          - Tab overflow behavior documented in ADR-0019
        completed: '2026-02-04'
