  - id: epic-81
    type: epic
    title: 'Epic: Dead Code Detection'
    description: |
      Two-layer diagnostic tool finding unused/orphaned code.
      Layer 1: Git-based stale file detection (files with zero commits
      in time window). Layer 2: Unused export detection for TypeScript
      via ts-prune. Python backend in pennyfarthing_scripts/deadcode/.
      Diagnostic only — does NOT auto-delete.
    priority: P1
    status: backlog
    repos: pennyfarthing
    jira: MSSCI-14457
    points: 5
    marker: cyclist
    stories:
      - id: 81-1
        jira: MSSCI-14458
        title: 'Python deadcode module: stale file detection'
        description: |
          New module: pennyfarthing_scripts/deadcode/
          Files: __init__.py, analyze.py, models.py, cli.py
          Layer 1: git ls-files vs git log --name-only --since=N days.
          Difference = never-touched files in window. Filter to source
          file extensions. Model: StaleFile with path, last_modified,
          days_stale, confidence.
        points: 2
        priority: P0
        status: backlog
        repos: pennyfarthing
      - id: 81-2
        jira: MSSCI-14459
        title: Unused export detection via ts-prune
        description: |
          Layer 2: Run ts-prune (or tsc analysis) to find exported symbols
          with no importers. Parse output into UnusedExport model with
          symbol, file, line, export_type. Integrate into deadcode CLI
          as separate subcommand or combined output.
        points: 2
        priority: P1
        status: backlog
        repos: pennyfarthing
      - id: 81-3
        jira: MSSCI-14460
        title: Dead code API + React hook + dialog
        description: |
          Express API: GET /api/dead-code?days=180&repo=pennyfarthing
          React hook: useDeadCode.ts. Dialog: DeadCodeDialog.tsx with tabs
          (Stale Files | Unused Exports), sortable tables, confidence
          badges. Add button to DebugPanel launcher row.
        points: 1
        priority: P0
        status: backlog
        repos: pennyfarthing
