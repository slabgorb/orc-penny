      - id: MSSCI-14212
        title: Changed Files and Diffs panels - use git commands instead of OTEL
        jira: MSSCI-14238
        description: |
          Refactor the Changed Files and Diffs panels to use git commands directly
          instead of hand-rolling diffs from OTEL tool correlation data.

          Current state:
          - Changed Files panel relies on OTEL span correlation to extract file paths
          - Diffs panel extracts old_string/new_string from Edit tool invocations
          - This approach is fragile and misses changes from Bash commands
          - toolInput correlation fails in Electron mode (MSSCI-14190 root cause)

          Target state:
          - Use `git status` to detect changed files
          - Use `git diff` to generate actual diffs
          - More reliable, catches all file changes regardless of source
          - Simpler implementation without OTEL correlation complexity

          Existing git-cache.ts infrastructure to leverage:
          - Per-project cache state: Map<string, GitCacheState> with repos, stale flag, lastFetch timestamp
          - Debounce with backoff: REFRESH_DELAY_MS=1500ms normal, MAX_INVALIDATION_DELAY_MS=5000ms cap
          - Stale threshold: STALE_THRESHOLD_MS=30000ms forces refresh if cache > 30s old
          - Request deduplication: concurrent requests wait for same fetchPromise
          - Callback system: onGitCacheRefresh() broadcasts to WebSocket clients
          - Per-repo mutex in api/git.ts prevents git lock conflicts

          Cache invalidation triggers (websocket.ts shouldInvalidateGitCache):
          - Edit/Write tools on success
          - Bash commands: git state-changing (add, commit, checkout, reset, etc.)
          - Bash commands: file modifications (rm, mv, cp, touch, mkdir, etc.)
          - Bash commands: redirects with > operator
          - Bash commands: package managers (npm install, pnpm add, etc.)
          - Branch switch: .git/HEAD watcher triggers immediate force refresh (bypasses debounce)

          Implementation approach:
          - Extend git-cache.ts to also cache file diffs (git diff output)
          - Add diff content to GitCacheState or create parallel DiffCacheState
          - Replace OTEL-based file tracking - use existing invalidation triggers
          - Use git diff for actual diff content instead of toolInput.old_string/new_string
          - Keep WebSocket real-time updates, source from git cache refresh callbacks
          - Remove complex tool correlation logic from otlp-receiver.ts (lines 868-949)

          Related files:
          - packages/cyclist/src/git-cache.ts (core caching, extend for diffs)
          - packages/cyclist/src/api/git.ts (per-repo mutex, add git diff command)
          - packages/cyclist/src/websocket.ts (shouldInvalidateGitCache - already works)
          - packages/cyclist/src/otlp-receiver.ts (tool correlation to REMOVE)
          - packages/cyclist/src/public/hooks/useDiffs.ts (update to use new source)
          - packages/cyclist/src/public/components/panels/ChangedFilesPanel.tsx
        points: 5
        priority: P1
        type: refactor
        status: done
        workflow: tdd
        repos: pennyfarthing
        acceptance_criteria:
          - Changed Files panel shows all modified files via git status
          - Diffs panel shows accurate diffs via git diff
          - Real-time updates use existing debounce/backoff (1.5s normal, 5s max cap)
          - Cache invalidation on Edit/Write/Bash file modifications (existing logic)
          - Branch switch triggers immediate refresh (existing .git/HEAD watcher)
          - Works correctly in both Electron and browser modes
          - Bash commands that modify files are properly tracked
          - Simpler codebase - remove OTEL tool correlation for diffs from otlp-receiver.ts
        completed: "2026-02-04"
