  - id: MSSCI-14394
    jira: MSSCI-14394
    title: '[BUG] Subagent spans never clear on task completion'
    description: |
      transformMessage() in MessagePanel.tsx drops tool_result blocks
      from user-type SDK messages. The existing cleanup code at lines
      279-287 never fires because the tool_result never becomes a
      MessageData. Fix: extract tool_result from user messages so
      completed subagent groups are removed from the view.
    points: 2
    priority: P0
    status: done
    repos: pennyfarthing
    workflow: trivial
    completed: '2026-02-06'
  - id: MSSCI-15038
    jira: MSSCI-15038
    title: Add party-mode roleplay variant and validate-refs CI/pre-commit
    description: |
      Five deliverables in one PR (#859):

      1. Party-mode roleplay variant — new sustained multi-round agent
         discussion workflow (party-mode-roleplay, 3 BikeLane steps:
         agent-loading, discussion, exit). Routes party-mode command to
         quick/roleplay/bare dispatch via party_mode_default config.
         Adapted from BMAD 3-step party-mode with PF agent loading and
         theme persona resolution.

      2. validate-refs plugin awareness — getSkillNames() discovers skills
         from plugin packages via package.json pennyfarthing.skills field.
         Fixes 9 false-positive warnings for benchmark skills.

      3. CI + pre-commit enforcement — new validate-refs CI job (--strict,
         fails build on broken references) and pre-commit Check 3
         (warn-only when pennyfarthing-dist/ files staged).

      4. Plugin skill discovery tests — getSkillNames exported for testing,
         4-test suite covering core skills, plugin discovery, and
         non-directory exclusion. Verbose logging for malformed
         package.json in plugin scan.

      5. Per-check reference counters — all 16 check functions return
         { issues, refs } with counts of references examined. Summary
         prints breakdown by check class sorted by volume (e.g.
         "Theme agent keys: 297, Workflow agents: 70"). GHA step summary
         includes the same table. Provides context for issue counts
         (3 issues out of 538 refs = 99.4% valid).

      Partially delivers 91-2 (CI/hook wiring) and establishes the
      package.json pennyfarthing field convention planned in 93-3.
    points: 3
    priority: P1
    status: in_progress
    repos: pennyfarthing
    workflow: trivial
    pr: 859
    branch: feat/MSSCI-15038-party-mode-roleplay
