epics:
- id: epic-74
  title: 'Epic: Tool Use Visualization'
  description: 'Improve tool use display in the message view with human-readable

    summaries and proper visual hierarchy.


    Current state: ToolCallBlock shows tool name + raw input

    Target state: Stacked tool history with intent summaries


    Key requirements:

    - Tool uses show human-readable intent summary

    - Results in collapsible block underneath

    - Previous tool uses between messages shown collapsed as stack

    - Current/active tool use shown prominently

    '
  points: 13
  priority: P1
  marker: cyclist-react
  repos: pennyfarthing
  status: backlog
  stories:
  - id: MSSCI-13395
    title: Tool intent summarizer
    description: 'Create a utility that generates human-readable summaries of tool
      use intent:

      - Read: "Reading file src/foo.ts"

      - Bash: "Running git status" or "Installing dependencies"

      - Glob: "Finding TypeScript files in src/"

      - Grep: "Searching for ''TODO'' in codebase"

      - Write: "Creating new file config.json"

      - Edit: "Updating function in utils.ts"

      - Task: "Launching explore agent to find error handlers"

      Use tool name + input parameters to generate contextual summary.

      '
    points: 3
    priority: P0
    status: done
    completed: 2026-02-02
    repos: pennyfarthing
    acceptance_criteria:
    - Generates readable summary for all common tools
    - Handles edge cases gracefully (unknown tools show name + truncated input)
    - Extracts meaningful context from input parameters
    jira: MSSCI-13395
  - id: MSSCI-13398
    title: Collapsible tool result display
    description: 'Enhance ToolCallBlock to show results in a proper collapsible block:

      - Results collapsed by default (show "▶ Result (X lines)")

      - Expand to show full result with syntax highlighting

      - Large results (>50 lines) show truncated preview with "Show all"

      - Copy button for result content

      '
    points: 2
    priority: P0
    status: done
    repos: pennyfarthing
    acceptance_criteria:
    - Results collapsed by default
    - Line count shown in collapsed state
    - Large results truncated with expand option
    - Copy to clipboard button
    jira: MSSCI-13398
    completed: '2026-02-03'
  - id: MSSCI-13400
    title: Tool use stack between messages
    description: 'Group consecutive tool uses between assistant messages into a

      collapsible stack:

      - Show count: "5 tool calls" with expand/collapse

      - Collapsed: show just the summary line for each

      - Expanded: show full ToolCallBlock for each

      - Current/pending tool use always shown expanded

      - Visual hierarchy: current tool prominent, history dimmed

      '
    points: 5
    priority: P0
    status: done
    repos: pennyfarthing
    acceptance_criteria:
    - Consecutive tool uses grouped into collapsible stack
    - Stack shows count when collapsed
    - Individual tool summaries visible when expanded
    - Active/pending tool always visible
    - Clear visual distinction between current and historical
    jira: MSSCI-13400
    completed: '2026-02-03'
  - id: MSSCI-13402
    title: Tool use visual design polish
    description: 'Apply consistent visual design to tool use blocks:

      - Status indicators (pending spinner, success checkmark, error X)

      - Color coding by tool type (read=blue, write=orange, bash=green)

      - Elapsed time for completed tools

      - Error results highlighted with red border

      - Consistent with Cyclist design system

      '
    points: 3
    priority: P1
    status: done
    repos: pennyfarthing
    acceptance_criteria:
    - Status indicators for pending/success/error
    - Tool type color coding
    - Elapsed time display
    - Error state styling
    jira: MSSCI-13402
    completed: '2026-02-03'
  type: epic
  jira: MSSCI-13394
- id: epic-76
  title: 'Epic: Dockview Panel Migration'
  description: 'Replace hand-rolled panel management with Dockview library.


    Current state: Custom 1,042-line DockingWorkspace.tsx with bugs

    Target state: Dockview-based workspace with proper panel docking


    dockview-react is already installed but unused. Migration enables:

    - Floating panels (pop-out windows)

    - Split views within regions

    - Panel maximization

    - Better drag-and-drop UX

    - Full ARIA accessibility


    See ADR-0019 for technical details.

    '
  points: 8
  priority: P0
  marker: cyclist-react
  repos: pennyfarthing
  status: in_progress
  stories:
  - id: MSSCI-14001
    title: Replace DockingWorkspace with Dockview
    description: 'Replace the hand-rolled panel system with Dockview in one pass:


      1. Create DockviewWorkspace.tsx using dockview-react

      2. Adapt existing 9 panel components via PanelAdapter pattern

      3. Implement sacred center (MessagePanel locked, cannot close/move)

      4. Migrate layout persistence to Dockview serialization format

      5. Apply Cyclist theme via CSS custom properties

      6. Implement responsive collapse behavior

      7. Update App.tsx to use new workspace

      8. Delete old DockingWorkspace.tsx (~1,042 lines)

      9. Update/fix affected tests


      See docs/adr/0019-dockview-migration.md for implementation details.

      '
    points: 8
    priority: P0
    status: done
    repos: pennyfarthing
    acceptance_criteria:
    - DockingWorkspace.tsx deleted (1,042 lines removed)
    - DockviewWorkspace.tsx renders all 9 panels
    - MessagePanel locked in center (cannot close/move)
    - Panels draggable between sidebars
    - Layout persists to config.local.yaml
    - Responsive collapse at <1024px works
    - Theme matches current Cyclist design
    - All existing panel functionality preserved
    - Tests pass
    jira: MSSCI-14001
    completed: '2026-02-03'
  type: epic
  jira: MSSCI-14000
