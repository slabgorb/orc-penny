  - id: epic-76
    title: "Epic: Dockview Panel Migration"
    description: |
      Replace hand-rolled panel management with Dockview library.

      Current state: Custom 1,042-line DockingWorkspace.tsx with bugs
      Target state: Dockview-based workspace with proper panel docking

      dockview-react is already installed but unused. Migration enables:
      - Floating panels (pop-out windows)
      - Split views within regions
      - Panel maximization
      - Better drag-and-drop UX
      - Full ARIA accessibility

      See ADR-0019 for technical details.
    points: 29
    priority: P0
    marker: cyclist-react
    repos: pennyfarthing
    status: in_progress
    stories:
      - id: MSSCI-14001
        title: Replace DockingWorkspace with Dockview
        description: |
          Replace the hand-rolled panel system with Dockview in one pass:

          1. Create DockviewWorkspace.tsx using dockview-react
          2. Adapt existing 9 panel components via PanelAdapter pattern
          3. Implement sacred center (MessagePanel locked, cannot close/move)
          4. Migrate layout persistence to Dockview serialization format
          5. Apply Cyclist theme via CSS custom properties
          6. Implement responsive collapse behavior
          7. Update App.tsx to use new workspace
          8. Delete old DockingWorkspace.tsx (~1,042 lines)
          9. Update/fix affected tests

          See docs/adr/0019-dockview-migration.md for implementation details.
        points: 8
        priority: P0
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - DockingWorkspace.tsx deleted (1,042 lines removed)
          - DockviewWorkspace.tsx renders all 9 panels
          - MessagePanel locked in center (cannot close/move)
          - Panels draggable between sidebars
          - Layout persists to config.local.yaml
          - Responsive collapse at <1024px works
          - Theme matches current Cyclist design
          - All existing panel functionality preserved
          - Tests pass
        jira: MSSCI-14001
        completed: '2026-02-03'
      - id: MSSCI-14187
        title: "[BUG] Tab overflow - hidden tabs have no way to be accessed"
        description: |
          When sidebars have more tabs than can fit in the visible area, users have
          no way to access the hidden tabs. Dockview's built-in tab overflow dropdown
          is not appearing.

          **Observed behavior:**
          - More tabs exist than visible space allows
          - No scroll, no dropdown, no way to access hidden tabs
          - Panel restore menu only shows closed panels, not overflow tabs

          **Expected behavior:**
          - Dockview should show overflow dropdown (`.dv-tabs-overflow-dropdown-root`)
          - Or tabs should be horizontally scrollable with visible scrollbar
          - Hidden tabs should be accessible via some UI mechanism

          **Investigation findings:**
          - Dockview has `disableTabsOverflowList` option (defaults to enabled)
          - OverflowObserver uses ResizeObserver to detect scrollWidth > clientWidth
          - When overflow detected, dropdown button appears in `.dv-right-actions-container`
          - Our CSS does NOT explicitly hide the dropdown

          **Potential causes:**
          1. `.dv-right-actions-container` has no allocated space
          2. OverflowObserver not triggering (tabs fit or resize event missed)
          3. CSS `overflow: hidden` on parent clipping the dropdown

          **Files to investigate:**
          - `packages/cyclist/src/public/components/DockviewWorkspace.tsx`
          - `packages/cyclist/src/public/styles/dockview-theme.css`
          - Browser DevTools: check for `.dv-tabs-overflow-dropdown-root` in DOM
        points: 3
        priority: P1
        type: bug
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - All sidebar tabs are accessible (via overflow dropdown or scroll)
          - Dockview overflow dropdown appears when tabs exceed visible width
          - OR horizontal tab scroll with visible scrollbar works
          - Tab overflow behavior documented in ADR-0019
        completed: "2026-02-04"
      - id: MSSCI-14188
        title: "Split Progress panel into Workflow, AC, and Todo panels"
        description: |
          Now that we have Dockview with proper nested panel support, split the
          overloaded ProgressPanel into three dedicated panels:

          **Current state:**
          - ProgressPanel contains internal tabs: Workflow | AC | Todo
          - User must click into Progress, then click a tab
          - Takes up one slot in right sidebar

          **Target state:**
          - Three separate panels: WorkflowPanel, ACPanel, TodoPanel
          - Each can be independently positioned, collapsed, or closed
          - Workflow shows BikeLane phase visualization
          - AC shows acceptance criteria checklist
          - Todo shows task list with progress

          **Implementation:**
          1. Extract WorkflowSection → WorkflowPanel
          2. Extract ACSection → ACPanel (or reuse existing AcceptanceCriteriaPanel)
          3. Extract TodoSection → TodoPanel
          4. Update PANEL_INVENTORY and RIGHT_SIDEBAR_PANELS
          5. Register new panel components
          6. Delete ProgressPanel.tsx
          7. Update layout persistence to handle migration

          **Benefits:**
          - More flexible workspace layout
          - Users can close unused panels (e.g., hide AC when not doing TDD)
          - Better use of Dockview's tab overflow handling
          - Cleaner component architecture
        points: 5
        priority: P2
        type: enhancement
        status: backlog
        repos: pennyfarthing
        acceptance_criteria:
          - WorkflowPanel shows BikeLane phase visualization
          - ACPanel shows acceptance criteria checklist with check/uncheck
          - TodoPanel shows task list with progress bar
          - All three panels independently positionable in Dockview
          - Layout persistence handles migration from old Progress panel
          - No functionality regression from current ProgressPanel
      - id: MSSCI-14189
        title: "Enhanced Sprint Panel with story management and epic actions"
        description: |
          Redesign the Sprint panel to be a comprehensive sprint management hub with
          actionable controls and clear story visibility.

          **Current state:**
          - Basic sprint info display
          - Limited interactivity
          - No epic/story hierarchy view

          **Target state:**

          ## 1. Current Story Section (Top)
          - Show active story title, ID, points, workflow phase
          - Link to full story details (AC panel, Workflow panel)
          - If NO active story: Show "Next up: {story}" with the highest priority
            backlog story, indicating it's ready to start

          ## 2. Sprint Stories View (Middle)
          - Collapsible tree view grouped by epic
          - Each epic shows: title, points done/total, progress bar
          - Stories under each epic show: ID, title, status badge, points
          - Status badges: backlog (gray), in_progress (blue), done (green)
          - Click story to see details or start work

          ## 3. Epic Actions
          - **Archive button** on epics where ALL stories are done
            - Triggers `archive_epic.py` flow
            - Removes from sprint, adds to archive
          - **Complete Epic** action when ready

          ## 4. Future Work Section (Bottom)
          - Summary of future.yaml initiatives
          - Show: initiative name, total points, status, epic count
          - **Promote button** on each promotable epic
            - Triggers `promote-epic.sh` flow
            - Adds epic to current sprint

          ## 5. Data Sources
          - Current story: `/api/session` or session file
          - Sprint stories: `/api/sprint/stories` (new endpoint)
          - Future epics: `/api/sprint/future` (new endpoint)
          - Archive action: `POST /api/sprint/archive-epic/{id}`
          - Promote action: `POST /api/sprint/promote-epic/{id}`

          **Implementation:**
          1. Create SprintPanel sections as sub-components
          2. Add REST endpoints for sprint/future data
          3. Implement archive/promote action handlers
          4. Add collapsible epic tree with story list
          5. Style with consistent Cyclist theme
        points: 8
        priority: P1
        type: enhancement
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - Current story section shows active story or "Next up" indicator
          - Stories grouped by epic in collapsible tree view
          - Epic progress bars show done/total points
          - Archive button appears on fully completed epics
          - Archive action triggers archive_epic.py and refreshes view
          - Future initiatives section shows promotable epics
          - Promote button triggers promote-epic.sh and refreshes view
          - All actions have loading states and error handling
          - Panel updates in real-time via WebSocket or polling
        completed: "2026-02-04"
      - id: MSSCI-14190
        title: "[BUG] Changed Files panel not tracking file modifications"
        description: |
          The Changed Files panel is not detecting or displaying files modified during
          the session. Need to investigate and fix the file tracking mechanism.

          **Observed behavior:**
          - Panel shows "0 files changed" even after agent creates/modifies files
          - Files only appear after manual refresh or restart
          - May lose track of changes after git commits

          **Expected behavior:**
          - Panel updates in real-time when Write/Edit tools are used
          - Shows cumulative list of all files touched during session
          - Persists history across commits (session-based, not git-based)

          **Investigation notes:**
          - Git panel has a working state caching mechanism
          - Changed panel may need similar approach
          - Check if WebSocket subscription `/ws/changed` is working
          - May need to hook into tool execution events

          **Potential fixes:**
          1. Subscribe to file system events via chokidar/fs.watch
          2. Hook into Write/Edit tool execution to track changes
          3. Use similar caching pattern as GitPanel
          4. Add session-based change tracking in Electron main process

          **Related files:**
          - `packages/cyclist/src/public/components/panels/ChangedPanel.tsx`
          - `packages/cyclist/src/api/` (WebSocket handlers)
          - `packages/cyclist/src/public/hooks/` (data fetching hooks)
        points: 3
        priority: P1
        type: bug
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - Changed panel updates when Write tool creates a file
          - Changed panel updates when Edit tool modifies a file
          - Change history persists after git commits during session
          - Panel shows accurate count badge
          - Real-time updates via WebSocket or polling
        completed: "2026-02-04"
