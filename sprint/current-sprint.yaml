      - id: MSSCI-14192
        title: "[BUG] Sprint panel shows 'No epics in current sprint' despite active epics"
        description: |
          The Sprint panel's Current Epics section displays "No epics in current sprint"
          and suggests promoting from Future Initiatives, even though current-sprint.yaml
          contains active epics (Epic 74 complete, Epic 76 in progress with 7 stories).

          **Observed behavior:**
          - Current Epics section shows empty state message
          - "Promote an epic from Future Initiatives to get started" displayed
          - Future Initiatives section IS populated correctly
          - Sprint data clearly exists in current-sprint.yaml

          **Expected behavior:**
          - Epic 74 should show as complete (13/13 pts)
          - Epic 76 should show with progress bar (21/29 pts done)
          - Stories should be visible under each epic in collapsible tree

          **Root cause hypothesis:**
          - API endpoint `/api/sprint/stories` may be returning empty
          - Frontend may not be calling the correct endpoint
          - Data transformation may be filtering out epics incorrectly
          - Possible mismatch between expected and actual response shape

          **Files to investigate:**
          - packages/cyclist/src/public/components/panels/SprintPanel.tsx
          - packages/cyclist/src/api/ (sprint-related endpoints)
          - Browser DevTools Network tab: check /api/sprint/* responses
        points: 2
        priority: P1
        type: bug
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - Sprint panel shows Epic 74 with 13/13 points complete
          - Sprint panel shows Epic 76 with progress (21/29 points)
          - Stories visible under each epic in collapsible tree
          - No "No epics" message when epics exist in sprint YAML
        completed: "2026-02-04"
      - id: MSSCI-14204
        title: "[BUG] Panel detail popup jumps in size and uses small images"
        jira: MSSCI-14204
        description: |
          The panel detail popup (shown when hovering over panel names in the restore menu
          or panel list) has visual polish issues that make it feel unprofessional.

          **Observed behavior:**
          - Dialog box jumps in size as you move mouse down the list of panel names
          - Each panel has different content length causing layout shift
          - Popup uses small/thumbnail images instead of larger detail images

          **Expected behavior:**
          - Popup maintains consistent dimensions regardless of which panel is hovered
          - No jarring size jumps when moving between panels
          - Uses larger, more detailed panel preview images
          - Smooth, professional feel when browsing panel options

          **Implementation approach:**
          1. Set fixed dimensions for popup container (min-width/min-height or fixed size)
          2. Content should scroll or truncate rather than resize container
          3. Identify where panel images are sourced (may need to add larger assets)
          4. If larger images don't exist, may need to generate/acquire them
          5. Ensure image container has fixed aspect ratio to prevent shifts

          **Investigation needed:**
          - Where are panel preview images stored?
          - What image sizes currently exist vs what's needed?
          - Which component renders the panel detail popup?
        points: 3
        priority: P1
        type: bug
        status: done
        repos: pennyfarthing
        acceptance_criteria:
          - Popup maintains consistent size when hovering different panels
          - No layout shift or jumping when moving mouse between panel names
          - Panel preview images are larger/more detailed
          - Smooth visual experience when browsing panel list
        completed: "2026-02-04"
