epics:
  - id: MSSCI-14298
    type: epic
    title: 'Epic: Stepped Workflow Infrastructure'
    description: |
      Fix stepped workflow support in Cyclist and the framework. Stepped
      workflows (epics-and-stories, prd, research, etc.) use a subdirectory
      pattern with workflow.yaml + steps/ that is not handled by existing
      code paths. Three issues identified:
      1. Session state never updates (step advancement not wired up)
      2. WorkflowPanel can't find subdirectory workflow definitions
      3. No way to see available/applicable workflows in the panel
    priority: P1
    status: in_progress
    repos: pennyfarthing
    stories:
      - id: MSSCI-14299
        title: Wire up stepped workflow session state advancement
        description: |
          Stepped workflows complete all steps but the session file stays
          frozen at Step 1 / 0% / in_progress. The TypeScript API exists
          in packages/core/src/workflow/session-state.ts (completeStep,
          updateWorkflowState, updateSessionContent) but nothing calls it.
          No CLI command, no HTTP endpoint, no skill exposes step advancement.

          Fix: Expose step completion via a mechanism Claude can invoke
          (CLI script, skill, or hook) so session state updates as steps
          complete. Affects 12+ stepped workflows.
        points: 5
        priority: P0
        status: done
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - Session file Current Step increments when a step completes
          - Session file Steps Completed array populates correctly
          - Session file Status changes to completed when all steps done
          - Completion percentage updates in session file
          - Works for all stepped workflows (epics-and-stories, prd, research, etc.)
        completed: '2026-02-05'
      - id: MSSCI-14300
        title: Add subdirectory workflow lookup to getWorkflowPhases
        description: |
          getWorkflowPhases() in packages/cyclist/src/story-parser.ts only
          checks for flat-file workflows (e.g. tdd.yaml) but 16 workflows
          use the subdirectory pattern (e.g. epics-and-stories/workflow.yaml).
          Panel shows "No active workflow" for all subdirectory workflows.

          Fix: Add {name}/workflow.yaml search paths alongside {name}.yaml
          in all three lookup locations (.pennyfarthing/workflows/,
          .claude/workflows/, pennyfarthing-dist/workflows/). Also handle
          stepped workflow type (steps → phases mapping for panel display).
        points: 3
        priority: P0
        status: done
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - getWorkflowPhases finds subdirectory workflow definitions
          - WorkflowPanel displays stepped workflow progress (step N of M)
          - Existing flat-file workflow lookup still works
          - All 16 subdirectory workflows discoverable by panel
        completed: '2026-02-05'
      - id: MSSCI-14301
        title: Show available applicable workflows in WorkflowPanel
        description: |
          WorkflowPanel currently only shows the active workflow (if any).
          When no workflow is active it shows "No active workflow" with no
          way to discover what workflows are available. Even when a workflow
          is active, users cannot see alternatives.

          Fix: Add a section to WorkflowPanel that lists available workflows
          applicable to the current context. Filter by triggers, tags, or
          project type. Allow users to see stepped vs phased workflows and
          start new ones from the panel. Requires a backend endpoint or
          API to enumerate available workflow definitions and their metadata.
        points: 3
        priority: P1
        status: done
        repos: pennyfarthing
        workflow: tdd
        acceptance_criteria:
          - WorkflowPanel shows list of available workflows when no workflow is active
          - Available workflows are filtered by applicability to current project context
          - Each workflow entry shows name, type (stepped/phased), and description
          - User can identify which workflows are startable from the panel
          - List updates when project context changes
        completed: '2026-02-05'
  - id: epic-78
    type: epic
    title: 'Epic: Cyclist Permission System'
    description: |
      Wire existing approval gate, hook script, WheelHub router,
      ApprovalModal, and grant storage into a single working permission
      flow. Remove the legacy IPC path. Enable one-time, session, and
      permanent permission grants through Cyclist UI.
    priority: P0
    status: backlog
    repos: pennyfarthing
    jira: MSSCI-14317
    points: 21
    marker: cyclist
    stories:
      - id: MSSCI-14318
        jira: MSSCI-14318
        title: Remove legacy IPC approval path
        description: |
          Remove old /approval-request endpoint from main.ts,
          Electron IPC permission-request/resolveHookApproval handlers,
          and interceptBashToolUse from approval-gate.ts. Generic
          interceptToolUse remains.
        points: 2
        priority: P0
        status: done
        repos: pennyfarthing
        completed: "2026-02-06"
      - id: MSSCI-14320
        jira: MSSCI-14320
        title: Update and register PreToolUse hook
        description: |
          Update cyclist-pretooluse-hook.js to POST to
          /api/hook-request (not old /approval-request). Register
          hook in .claude/settings.local.json under hooks.PreToolUse.
          Handle WheelHub unreachable gracefully (return ask).
        points: 3
        priority: P0
        status: done
        repos: pennyfarthing
        completed: "2026-02-06"
      - id: MSSCI-14321
        jira: MSSCI-14321
        title: Integrate grant checking into WheelHub hook router
        description: |
          Wire settings-store.ts grant checking into hook-request.ts
          handler. Auto-approve matching grants, broadcast to WebSocket
          when no match. Handle once/session/always grant lifecycle.
          Return ask when no UI clients connected.
        points: 3
        priority: P0
        status: backlog
        repos: pennyfarthing
      - id: MSSCI-14322
        jira: MSSCI-14322
        title: Mount ApprovalModal in React component tree
        description: |
          Import and render ApprovalModal in App.tsx at top level.
          Connect WebSocket subscription for hook-request events.
          Wire hook-response sending on user decision. Queue
          concurrent requests (show one at a time, no stacking).
        points: 3
        priority: P0
        status: backlog
        repos: pennyfarthing
      - id: MSSCI-14323
        jira: MSSCI-14323
        title: Add severity classification to hook request flow
        description: |
          Classify tool requests as safe/normal/destructive in
          WheelHub before broadcasting. Integrate dangerous-path.ts
          for path-based classification. Include severity and
          contextual warnings in WebSocket broadcast. Visual
          treatment in ApprovalModal (red border for destructive).
        points: 3
        priority: P1
        status: backlog
        repos: pennyfarthing
      - id: MSSCI-14324
        jira: MSSCI-14324
        title: Wire grant persistence across all three scopes
        description: |
          Ensure once grants auto-revoke after single use, session
          grants clear on session end, always grants persist to
          .claude/settings.local.json. Implement glob pattern
          matching for scope (e.g. npm * matches npm test).
        points: 3
        priority: P1
        status: backlog
        repos: pennyfarthing
      - id: MSSCI-14325
        jira: MSSCI-14325
        title: Connect /permissions skill to grant store
        description: |
          Wire existing /permissions skill to settings-store.ts
          for list/grant/revoke/show operations. Ensure always-grants
          can be revoked from .claude/settings.local.json.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
      - id: MSSCI-14326
        jira: MSSCI-14326
        title: Workflow permission presets
        description: |
          Integrate workflow-permissions.ts schema into workflow
          startup. Show batch approval modal on agent activation
          when presets exist. Store approved presets as session grants.
        points: 2
        priority: P3
        status: backlog
        repos: pennyfarthing
      - id: MSSCI-14327
        jira: MSSCI-14327
        title: Smooth plan mode exit with tirepump choice
        description: |
          ExitPlanMode should transition smoothly without requiring
          manual user intervention to accept. After plan approval,
          offer a choice for whether to tirepump (commit/push) the
          resulting changes before continuing. Currently plan mode
          exit is clunky and requires the user to manually set
          accept mode.
        points: 2
        priority: P2
        status: backlog
        repos: pennyfarthing
stories: []
