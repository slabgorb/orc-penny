  - id: MSSCI-12793
    title: 'Epic: Tiered Context Injection System'
    description: 'Implement session-aware context tiers to reduce token overhead from agent context injection. Currently Cyclist sends ~4000 tokens via --append-system-prompt on every turn, even when resuming sessions where the agent already has context. Four context tiers based on session state:

      - FULL (~4000): First turn of new session

      - REFRESH (~600): Resumed session, same agent

      - HANDOFF (~700): Resumed session, different agent

      - MINIMAL (~200): Deep conversation (turn 3+), same agent Success metrics:

      - System prompt tokens per turn < 1000 avg (currently ~4000)

      - Time to ''Prompt too long'' error: 2x current

      - Agent persona consistency: no regression Projected savings: 84% token reduction for typical sessions. Context Doc: sprint/context/MSSCI-12787-reference/tiered-context-story-draft.md'
    points: 18
    completed_points: 0
    priority: P1
    status: backlog
    marker: context-optimization
    repos: pennyfarthing
    stories:
