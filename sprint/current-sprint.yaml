        description: "When installing Pennyfarthing over a legacy install (or updating), stale\nfiles can remain that conflict with or shadow Pennyfarthing's proper files.\n\nDiscovered in ~/Projects/conductor:\n- `.claude/scripts/statusline.sh` (legacy, simplified) shadows\n  `.pennyfarthing/scripts/misc/statusline.sh` (proper, feature-rich)\n- `settings.local.json` may point to wrong statusline path\n- `.claude/persona-config.yaml` may conflict with `.pennyfarthing/config.local.yaml`\n\nImplementation:\n- `init`: Detect legacy `.claude/scripts/` files, offer to remove or migrate\n- `update`: Check for stale files that shadow pennyfarthing-dist symlinks\n- `doctor`: Add check for conflicting statusline scripts, fix path in settings\n- All: Validate statusline path in settings.local.json points to correct location\n\nAcceptance Criteria:\n- [ ] doctor --fix removes stale `.claude/scripts/statusline.sh` if pennyfarthing one exists\n- [ ] doctor --fix updates settings.local.json statusline path if wrong\n- [ ] init warns about legacy files and offers cleanup\n- [ ] update cleans up known legacy file patterns\n"
