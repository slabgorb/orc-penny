  - id: 110-9
    title: TUI portrait resolution for consumer installs
    description: >-
      Portrait images in the BikeRack TUI header only work in dogfooding mode.
      In consumer installs, the npm package ships themes/ but not portraits/
      (too large). The Python portrait_resolver.py returns None because
      discover_all_theme_dirs() only finds .pennyfarthing/personas/themes/ and
      looks for a sibling portraits/ which doesn't exist in the npm package.
      The WheelHub Node.js server works because getPortraitsDir() walks up
      from __dirname and finds the monorepo paths. Fix: teach the Python
      resolver to search node_modules/@pennyfarthing/themes-*/portraits/ and
      prevent pennyfarthing update from overwriting dogfooding symlinks.
    points: 3
    priority: p2
    status: backlog
    workflow: tdd
    acceptance_criteria:
      - Python resolve_portrait_path() finds portraits in consumer installs
      - discover_all_theme_dirs() searches node_modules theme packages as fallback
      - pennyfarthing update preserves dogfooding symlinks when manifest says symlink
      - Test coverage for both consumer and dogfooding resolution paths
