  - id: 141-15
    jira: MSSCI-16149
    title: Delete Dead Shell/Python Scripts That Duplicate pf CLI
    description: |-
      Delete confirmed-dead shell and Python scripts that duplicate pf CLI commands. Easy win — these have direct pf equivalents.

      Delete: scripts/misc/backlog.sh (duplicates pf sprint backlog), scripts/workflow/get-workflow-type.py (duplicates pf workflow type, already deprecated), scripts/core/check-context.sh (deprecated, duplicates pf context), scripts/misc/validate-subagent-frontmatter.sh (subset of validate-agent-schema.sh, triple overlap with pf validate agent). Remove dead output_persona() from scripts/core/agent-session.sh.

      AC: Listed scripts deleted or dead functions removed. No remaining callers reference deleted scripts. pf validate, pf sprint backlog, pf workflow type, pf context still work.
    points: 1
    priority: p2
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: chore
  - id: 141-16
    jira: MSSCI-16150
    title: Add --json Output to pf CLI for GUI Consumption
    description: |-
      The GUI cannot be a thin wrapper if the CLI does not expose structured JSON output. Add --json flags to key pf commands that the TypeScript layer currently reimplements.

      Commands needing --json: pf story info (current story context, session data, workflow phase status), pf workflow phases (phase list with done/current/pending status for a story), pf persona current (active agent persona with character, theme, crew), pf theme show (full theme data including all characters), pf handoff status (current gate state, next phase/agent).

      AC: Each listed command supports --json and returns structured data. Output schema documented. TypeScript layer can replace direct file parsing with subprocess calls to these commands. Blocks 141-17, 141-18, 141-19.
    points: 3
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
  - id: 141-17
    jira: MSSCI-16151
    title: Replace TypeScript story-parser with pf CLI Subprocess Calls
    description: |-
      story-parser.ts (886 lines) exists in BOTH core and cyclist. It reimplements session file parsing (13 regex formats), sprint YAML aggregation, workflow phase resolution, story status normalization, and Jira URL generation. This is the single biggest source of duplication (~1700 lines total across both copies).

      Replace all direct YAML/markdown parsing with subprocess calls to pf story info --json and pf workflow phases --json. Remove hardcoded Jira URL (https://1898andco.atlassian.net/browse).

      AC: Both core and cyclist story-parser.ts replaced with pf CLI subprocess calls. No direct sprint YAML or session file parsing in TypeScript. Jira URL comes from config not hardcode. GUI panels still render correctly. Depends on 141-16.
    points: 5
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: refactor
  - id: 141-18
    jira: MSSCI-16152
    title: Replace TypeScript Workflow Engine with pf CLI Delegation
    description: |-
      Six TypeScript files reimplement pf handoff and pf workflow logic: handoff.ts (595 lines — gate checking, phase advancement), session-state.ts (290 lines — Workflow State section read/write, must stay byte-compatible with Python), workflow-router.ts (329 lines — 5-priority routing algorithm), workflow-executor.ts (356 lines — stepped workflow state machine), workflow-schema.ts (866 lines — YAML validation), gate-handler.ts (273 lines — gate decision format).

      Replace with delegation to pf handoff and pf workflow subcommands with --json output.

      AC: TypeScript workflow files delegate to pf CLI. No direct session file mutation from TypeScript. Workflow routing uses pf workflow route. Gate checking uses pf handoff resolve-gate. Depends on 141-16.
    points: 5
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: refactor
  - id: 141-19
    jira: MSSCI-16153
    title: Replace TypeScript Theme Loader with pf CLI Calls
    description: |-
      theme-loader.ts (577 lines) implements the full theme discovery algorithm (4-source priority, deduplication, CATEGORY_MAP with 130+ entries) which mirrors common/themes.py exactly. pennyfarthing.ts (420 lines) also duplicates project detection, theme config loading, and persona assembly from pf prime and pf theme.

      Replace with pf theme list --json and pf theme show --json. Move CATEGORY_MAP into theme YAML files (each theme declares its own category). Keep only FSWatcher (real-time file change detection) in TypeScript as legitimate GUI concern.

      AC: TypeScript theme discovery replaced with pf CLI calls. CATEGORY_MAP eliminated (categories in theme YAML). pennyfarthing.ts project detection and persona assembly use pf CLI. Depends on 141-16.
    points: 3
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: refactor
  - id: 141-20
    jira: MSSCI-16154
    title: Consolidate Agent Validation — Port Shell Checks to pf validate
    description: |-
      Agent validation has triple overlap: validate-agent-schema.sh (577 lines with extra checks like mindset tags, line-position checks), validate-subagent-frontmatter.sh (159 lines, subset of above), and pf validate agent (Python). The shell versions have checks the Python version lacks.

      Port all shell-only checks into pf validate agent, then delete both shell scripts.

      AC: pf validate agent includes all checks from shell scripts (mindset tags, line-position, content-outside-tags). Shell validation scripts deleted. pf validate agent passes on current agent files.
    points: 3
    priority: p2
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: refactor
  - id: 141-21
    jira: MSSCI-16155
    title: Extract Hardcoded Values and Relocate Misplaced Business Logic
    description: |-
      Cleanup story for hardcoded values and misplaced business logic found during the audit.

      Hardcoded values: Jira URL in story-parser.ts (handled by 141-17 if done first), token limits MAX_TOKENS_PER_BLOCK in usage-stats.ts, slug generation (toSlug + oceanSuffix) duplicated in pennyfarthing.ts and theme-agents.ts.

      Misplaced logic: agent-evaluation.ts (300+ lines of Job Fair benchmarking scoring, regression detection, agent-to-task-type mappings) belongs in packages/benchmark or pf benchmark CLI, not in the GUI server. settings.ts migration logic (4 legacy formats) runs only in TypeScript — Python can never migrate legacy settings.

      AC: agent-evaluation.ts moved to packages/benchmark or pf benchmark. Slug generation deduplicated (single source). Token limits moved to config or pf CLI. Settings migration callable from Python path.
    points: 2
    priority: p2
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: refactor
