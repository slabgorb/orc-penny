  - id: 141-22
    jira: MSSCI-16159
    title: Add pf serve — Persistent Python Server with WheelHub Reverse Proxy
    description: |-
      Subprocess-per-request to the pf CLI adds ~100-200ms of Python startup overhead per call. After 141-17 and 141-18 route all business logic through pf CLI --json, every GUI panel refresh spawns multiple Python processes.

      Add a pf serve command that starts a persistent FastAPI/Flask HTTP server exposing the same --json endpoints as HTTP routes. WheelHub reverse-proxies /api/pf/* to the pf serve port, so the TypeScript layer hits fetch('http://localhost:PORT/api/pf/story/show?id=141-16') instead of execFileSync('pf', ['sprint', 'story', 'show', ...]). Python stays warm — no interpreter startup, no import chain, no YAML re-parse on every request.

      141-17 and 141-18 establish the subprocess pattern with caching. This story replaces the subprocess callsite with HTTP fetch while keeping the same caching and error contract. The pf binary resolution problem (PATH, IDE contexts) also disappears — WheelHub knows the port.

      AC: pf serve starts a persistent HTTP server exposing all --json endpoints as HTTP routes. WheelHub reverse-proxies /api/pf/* to pf serve. TypeScript subprocess calls in story-parser, theme-loader, and workflow engine replaced with fetch() to WheelHub /api/pf/* routes. pf serve auto-starts when WheelHub starts (spawned as child process). pf serve shuts down when WheelHub shuts down. Latency regression test shows improvement over subprocess pattern. Error contract preserved ({error, code, detail} JSON on failure).
    points: 5
    priority: p1
    status: canceled
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-04'
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-03-04'
    type: feature
    review_verdict: approved
