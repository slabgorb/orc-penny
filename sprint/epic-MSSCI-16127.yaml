  - id: 141-16
    jira: MSSCI-16150
    title: Add --json Output to pf CLI for GUI Consumption
    description: |-
      The GUI cannot be a thin wrapper if the CLI does not expose structured JSON output. Add --json flags to key pf commands that the TypeScript layer currently reimplements.

      Commands needing --json: pf story info (current story context, session data, workflow phase status), pf workflow phases (phase list with done/current/pending status for a story), pf persona current (active agent persona with character, theme, crew), pf theme show (full theme data including all characters), pf handoff status (current gate state, next phase/agent).

      AC: Each listed command supports --json and returns structured data. Output schema documented (success AND error responses). Error responses return JSON with {error, code, detail} — never bare stderr. pf binary resolution strategy defined for non-PATH contexts (IDE extensions, GUI launches). TypeScript layer can replace direct file parsing with subprocess calls to these commands. Blocks 141-17, 141-18, 141-19.
    points: 3
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-04'
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-03-04'
  - id: 141-17
    jira: MSSCI-16151
    title: Replace TypeScript File Parsers with pf CLI Subprocess Calls
    description: |-
      Merged scope (was 141-17 + 141-19): story-parser.ts + theme-loader.ts + pennyfarthing.ts all follow the same anti-pattern — TypeScript reimplements Python business logic by parsing files directly. Replace with a single consistent pattern: subprocess calls to pf CLI --json endpoints.

      story-parser.ts (886 lines, exists in BOTH core and cyclist): reimplements session file parsing (13 regex formats), sprint YAML aggregation, workflow phase resolution, story status normalization, Jira URL generation. ~1700 lines total across both copies. Replace with pf story info --json and pf workflow phases --json. Remove hardcoded Jira URL.

      theme-loader.ts (577 lines): mirrors common/themes.py theme discovery algorithm with hardcoded CATEGORY_MAP (130+ entries). pennyfarthing.ts (420 lines): duplicates project detection, theme config loading, persona assembly. Replace with pf theme list --json and pf theme show --json. Move CATEGORY_MAP into theme YAML files (each theme declares its own category). Keep only FSWatcher (real-time file change detection) in TypeScript.

      Caching strategy: CLI results cached in-memory with FSWatcher-based invalidation. Sprint/session data invalidated on .session/ and sprint/ file changes. Theme data invalidated on theme YAML changes. Cache TTL fallback of 30s for safety.

      Shared test utility: create a subprocess mock helper for TypeScript tests that simulates pf CLI --json responses. Reused by 141-18.

      Interfaces preserved: StoryInfo, WorkflowPhase, SprintStory, EpicContext, CriteriaItem, AvailableWorkflow (from story-parser); ThemeMetadata, AgentPersona (from theme-loader).

      AC: Both core and cyclist story-parser.ts replaced with pf CLI subprocess calls. No direct sprint YAML or session file parsing in TypeScript. Jira URL comes from config not hardcode. TypeScript theme discovery replaced with pf CLI calls. CATEGORY_MAP eliminated (categories in theme YAML). pennyfarthing.ts project detection and persona assembly use pf CLI. FSWatcher retained for cache invalidation only. Panel render latency measured before/after with no perceptible regression. Contract tests validate CLI JSON schemas match TypeScript interfaces. GUI panels still render correctly. Depends on 141-16.
    points: 8
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-04'
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-03-04'
    type: refactor
    review_findings: 'Build broken: cyclist/theme-metadata.ts imports removed deriveCategory/CATEGORY_MAP; 8 cyclist test files import from deleted story-parser.ts'
    review_verdict: approved
  - id: 141-18
    jira: MSSCI-16152
    title: Replace TypeScript Workflow Engine with pf CLI Delegation
    description: |-
      Six TypeScript files reimplement pf handoff and pf workflow logic: handoff.ts (595 lines — gate checking, phase advancement), session-state.ts (290 lines — Workflow State section read/write, must stay byte-compatible with Python), workflow-router.ts (329 lines — 5-priority routing algorithm), workflow-executor.ts (356 lines — stepped workflow state machine), workflow-schema.ts (866 lines — YAML validation), gate-handler.ts (273 lines — gate decision format).

      Replace with delegation to pf handoff and pf workflow subcommands with --json output.

      Integration testing: End-to-end smoke test that exercises the full lifecycle (start story → advance through workflow phases → handoff → gate resolution) through the CLI layer. Round-trip contract test for session-state byte-compatibility: Python writes Workflow State section → TypeScript reads → Python reads back → assert identical. Uses subprocess mock helper from 141-17.

      AC: TypeScript workflow files delegate to pf CLI. No direct session file mutation from TypeScript. Workflow routing uses pf workflow route. Gate checking uses pf handoff resolve-gate. Integration smoke test covers full story lifecycle through CLI layer. Round-trip byte-compatibility test for session-state format. Depends on 141-16. Use feature branch shared with 141-17 to avoid rebase conflicts.
    points: 5
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: refactor
