    branch: feat/148-17-reviewer-subagent-completion
  - id: 148-18
    jira: MSSCI-16474
    title: "Peloton tmux session leak — agent panes not cleaned up on shutdown"
    description: "Two issues: (1) Peloton agent panes (tea, dev, reviewer, architect) accumulate across runs — visible as windows 4-15 in tmux after 3 peloton runs. TeamDelete and shutdown don't kill the tmux panes. (2) Tests that exercise tmux pane creation should NOT open real tmux panes — they must mock tmux interactions to avoid leaking sessions. User preference: no tests that open real tmux panels."
    points: 2
    priority: p0
