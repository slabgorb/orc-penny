  - id: 148-17
    title: "Reviewer subagent completion — wait for all 8 before writing assessment"
    description: "Two related issues: (1) Reviewer sometimes goes idle before sending verdict to team lead — subagents may still be running when the reviewer's turn ends. The reviewer needs to wait for all 8 subagents to return before writing the assessment and sending the verdict message. (2) The approval gate rejects bold markdown on 'All received: Yes' — the gate regex expects plain text but the reviewer template uses '**All received:** Yes'. Either fix the gate to handle markdown or fix the reviewer template to use plain text."
    points: 2
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-15'
    repos: pennyfarthing
