id: '121'
type: epic
title: Debug Panel and Brownfield Tools Fixes
description: Fix issues with the Debug panel in Cyclist/BikeRack and the brownfield analysis tools (hotspots, dead code, health score). Improve reliability, output formatting, and panel rendering.
priority: p2
status: backlog
repos: pennyfarthing
stories:
  - id: 121-1
    title: Improve debug panel refresh rate for real-time token usage tracking
    description: Increase the debug panel's polling/WebSocket refresh rate so token usage metrics update in near-real-time as the agent works. Currently the panel lags behind actual context consumption, making it hard to track burn rate during long sessions. Investigate whether the bottleneck is the WheelHub broadcast interval, the OTEL span ingestion cadence, or the React component polling cycle, and fix accordingly.
    points: 2
    priority: p1
    status: done
    workflow: trivial
    completed: '2026-02-20'
    type: bug
    review_verdict: approved
  - id: 121-2
    title: Add code quality rules trigger from debug panel
    description: Add interactive controls to the debug panel that let users fire off brownfield code quality analysis tools (hotspots, dead code, health score) directly from the UI. Currently these tools are CLI-only via pf debug. Add action buttons or a command palette in the debug panel that triggers analysis runs and displays results inline, so users can assess code quality without leaving the TUI/Cyclist.
    points: 3
    priority: p2
    status: backlog
    workflow: tdd
  - id: 121-3
    title: Fix footer keybinding labels — bracket display is inaccurate
    description: The footer bar in BikeRack TUI shows keybinding hints with incorrect bracket formatting. The bracket characters around key names are wrong or inconsistent, making the menu hard to read. Fix the keybinding label rendering in the footer widget to display accurate bracket notation matching the actual key shortcuts.
    points: 1
    priority: p1
    status: backlog
    workflow: trivial
    type: bug
  - id: 121-4
    title: Fix git sync cache busting for stale UI state
    description: >-
      The git status cache mechanism is not invalidating properly on writes,
      leading to stale/incorrect git state in the UI. Needs either a
      lock-free status approach or a fix to the cache busting logic.
    refs:
      - github: 1898andCo/pennyfarthing-orchestrator#31
    points: 2
    priority: p2
    status: backlog
    workflow: tdd
    type: bug
