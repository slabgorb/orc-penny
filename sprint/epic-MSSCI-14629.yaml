id: epic-93
title: 'Epic: Extract Benchmarking System into @pennyfarthing/benchmark'
description: |
  Extract the JobFair benchmarking system from @pennyfarthing/core into a
  standalone optional npm package (@pennyfarthing/benchmark). Benchmarking is
  a meta-operation that most users don't need — it evaluates persona
  effectiveness but isn't required for core agent workflows.

  Key finding: zero reverse dependencies. Core never imports from benchmarking.
  Cyclist already uses dynamic imports that gracefully degrade.

  See ADR-0020 (docs/adr/0020-benchmark-package-extraction.md) for full
  architectural rationale and file inventory.
priority: P2
status: backlog
repos: pennyfarthing
marker: infrastructure
adr: '0020'
jira: MSSCI-14629
