  - id: 93-3
    title: Plugin discovery for commands and skills from installed packages
    description: |
      Implement mechanism for @pennyfarthing/core to discover and register
      commands and skills from optional installed packages.

      When @pennyfarthing/benchmark is installed:
      - Its 4 commands appear in the command namespace
      - Its 3 skills load when referenced
      - Cyclist benchmark API router registers automatically

      Design should be generic (not benchmark-specific) so future package
      extractions can use the same mechanism.

      Approach options:
      - package.json "pennyfarthing" field with paths to commands/skills
      - Convention-based discovery in node_modules/@pennyfarthing/*/
      - Explicit registration via pennyfarthing.config.yaml plugins list
    points: 3
    priority: P0
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria: []
