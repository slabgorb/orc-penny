    title: "Health score Python module"
    description: |
      New module: pennyfarthing_scripts/healthscore/
      Aggregates lightweight versions of each tool's output.
      Weighted scoring algorithm with configurable weights.
      CLI: healthscore analyze --format json. Caches component
      scores, reuses cached results within 5 minute window.
