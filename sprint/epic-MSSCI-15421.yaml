id: '125'
type: epic
title: Sprint State Engine Consolidation
description: |-
  Consolidate fragmented sprint state across 6 storage locations and 4 reader
  implementations into a unified SprintContext model. Eliminates status drift,
  reader divergence (TS/Python merge shards differently), and architectural hacks.

  Five-move strategy (see sprint/planning/sprint-state-consolidation-proposal.md):
    Move 1: SprintContext first-class object — unified resolution (125-1 to 125-4)
    Move 2: Single canonical data service — Python canonical, TS via subprocess (125-5, 125-6)
    Move 3: Story lifecycle state machine — atomic multi-system transitions (125-7)
    Move 4: Event-driven Jira sync — real-time replaces batch reconciliation (125-8)
    Move 5: Managed focus contexts — lifecycle-tracked sprint switching (125-9, 125-10)

  Complementary to prd-sprint-data-management.md (write-side, complete). This epic
  addresses read-side consolidation and cross-system coordination.

  Open questions (resolve before Move 3+):
    1. Source of truth — YAML-primary assumed, needs confirmation
    2. State machine scope — story-only or include epic/sprint status?

  Source docs:
    - sprint/planning/sprint-state-consolidation-proposal.md (primary)
    - sprint/planning/prd-sprint-data-management.md (write-side predecessor)
priority: p1
status: backlog
repos: pennyfarthing
jira: MSSCI-15421
stories:
  - id: 125-1
    jira: MSSCI-15422
    title: Define SprintContext dataclass and resolve_sprint_context() function
    description: |-
      Create SprintContext dataclass bundling sprint_file, context_root, session_root, repos, name, type, is_default. Implement resolve_sprint_context(project_root) that handles the 90% default case (orchestrator's own sprint) and the 10% focus case (registry lookup via sprints.yaml + config.local.yaml preference). Single resolution function replaces all scattered path logic.

      AC:
      - SprintContext dataclass defined with all fields from proposal
      - resolve_sprint_context() returns correct context for default case (no preference set)
      - resolve_sprint_context() returns correct context for focus case (preference set, registry lookup)
      - Unit tests cover both paths and edge cases (missing registry, invalid preference)
    points: 3
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    workflow: tdd
    completed: '2026-02-22'
    review_verdict: approved
