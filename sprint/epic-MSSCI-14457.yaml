id: epic-81
title: "Dead Code Detection"
jira: MSSCI-14457
description: |
  Two-layer diagnostic tool finding unused/orphaned code.
  Layer 1: Git-based stale file detection (files with zero commits
  in time window). Layer 2: Unused export detection for TypeScript
  via ts-prune. Python backend in pennyfarthing_scripts/deadcode/.
  Diagnostic only — does NOT auto-delete.
priority: P1
status: backlog
