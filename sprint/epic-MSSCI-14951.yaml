stories:
  - id: '103-1'
    title: Textual app scaffold with basic layout
    description: |
      Create the core Textual application shell for BikeRack TUI.
      Single-panel layout with header (connection status area),
      main content area (panel render target), and footer (panel name,
      keybindings). Entry point for `pf bikerack` to launch.

      FRs: FR1
    points: 2
    priority: P0
    status: done
    workflow: tdd
    jira: MSSCI-14956
    assigned_to: keith.avery@1898andco.io
    completed: '2026-02-13'
  - id: '103-2'
    title: WheelHub WebSocket client with auto-reconnect
    description: |
      Python WebSocket client that connects to WheelHub at the configured
      port. Subscribes to panel channels, receives JSON payloads, dispatches
      to panel renderers. Auto-reconnect on disconnect with backoff.
      Reads port from .pennyfarthing/config.local.yaml.

      FRs: FR3, FR4
      NFRs: NFR6, NFR7, NFR8, NFR9, NFR11, NFR14
    points: 3
    priority: P0
    status: backlog
    workflow: tdd
    jira: MSSCI-14957
  - id: '103-3'
    title: '`pf bikerack` launcher command'
    description: |
      Add `bikerack` subcommand to `pf` CLI. Starts WheelHub (if not
      running), launches Claude CLI, opens TUI in companion terminal
      pane. TUI process independent of Claude session — closing TUI
      does not kill Claude, closing Claude does not kill TUI.

      FRs: FR1, FR2
      NFRs: NFR10
    points: 2
    priority: P0
    status: backlog
    workflow: tdd
    jira: MSSCI-14958
  - id: '103-4'
    title: Connection status indicator in TUI header
    description: |
      TUI header displays WheelHub connection state: connected,
      disconnected, reconnecting. Updates within 5 seconds of state
      change. TUI remains responsive while disconnected.

      FRs: FR4
      NFRs: NFR6, NFR8
    points: 1
    priority: P0
    status: backlog
    workflow: tdd
    jira: MSSCI-14959
  - id: '103-5'
    title: Base panel abstraction (channel subscription + Rich rendering)
    description: |
      Base panel class that panels inherit from. Handles: subscribe to
      WebSocket channel by key, receive JSON payload, call render method,
      display Rich output in main content area. Real-time updates when
      new data arrives. Panels implement render() with Rich tables/trees.

      FRs: FR5, FR21, FR22
      NFRs: NFR1
    points: 3
    priority: P0
    status: backlog
    workflow: tdd
    jira: MSSCI-14960
  - id: '103-6'
    title: SprintPanel implementation
    description: |
      First panel — proves the full vertical slice. Subscribes to
      /ws/sprint channel. Renders sprint status as Rich table: story
      list with status, points, Jira status, velocity. Default panel
      on launch.

      FRs: FR7, FR10, FR11
    points: 2
    priority: P0
    status: backlog
    workflow: tdd
    jira: MSSCI-14961
  - id: '103-7'
    title: '`/bc` slash command skill registration'
    description: |
      Register /bc as a Pennyfarthing slash command skill following the
      /sprint pattern. `/bc show <panel>` invokes `pf bikerack show
      <panel>` which sends a panel-switch message to the TUI (via
      WheelHub or direct IPC). Panel switches in < 200ms.

      FRs: FR6
      NFRs: NFR2
    points: 2
    priority: P0
    status: backlog
    workflow: tdd
    jira: MSSCI-14962
  - id: '103-8'
    title: Panel persistence (extend ERB mechanism)
    description: |
      Extend the existing Cyclist panel saving mechanism to persist
      last-viewed panel for TUI. On launch, restore last panel instead
      of defaulting to Sprint (Sprint remains default if no saved state).
      Single source of truth shared with ERB version.

      FRs: FR8
