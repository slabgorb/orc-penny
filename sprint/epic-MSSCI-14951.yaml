id: '103'
title: BikeRack TUI — Terminal-Native Dashboard
description: |
  Replace the browser-based Cyclist dashboard with a terminal-native TUI
  companion built on Rich/Textual (Python). Connects to WheelHub over
  WebSocket, renders 10 panels, switches via /bc slash command. Consumes
  existing WebSocket channels unchanged — zero server-side modifications.

  PRD: sprint/planning/prd.md
priority: P1
status: in_progress
repos: pennyfarthing
jira: MSSCI-14951
