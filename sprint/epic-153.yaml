  - id: 153-4
    title: 'pf sprint story remove/update/finish all fail to locate stories in epic shard files — same root cause (BLOCKING: breaks SM finish ceremony)'
    description: |
      `pf sprint story add` and `pf sprint epic show` read/write epic shard files
      (`sprint/epic-*.yaml`) correctly, but three other commands fail with
      "Story 'X' not found in epics, standalone_stories, or stories":

      - `pf sprint story remove <id>`
      - `pf sprint story update <id> --<field> <value>`
      - `pf sprint story finish <id>` — fails with "yaml-update step failed during
        finish: Story X not found in sprint YAML"

      Most painful: `finish`. It blocks the entire SM finish ceremony — no Jira
      transition, no PR merge step, no session archival. All-or-nothing with no
      recovery hook. Workaround: direct-edit the shard YAML.

      Repro:
        mkdir /tmp/pf-bug && cd /tmp/pf-bug
        mkdir sprint && cat > sprint/current-sprint.yaml <<EOF
        sprint: {number: 1, goal: test, start_date: 2026-01-01, end_date: 2026-01-14, status: active}
        epics: []
        EOF
        pf sprint epic add E "Test epic" --priority p1
        pf sprint story add E "Story one" 1
        pf sprint story remove E-1                  # → "not found"
        pf sprint story update E-1 --status done    # → "not found"
        pf sprint story finish E-1                  # → "not found in sprint YAML"
        pf sprint epic show E                       # → works fine
    points: 5
    priority: p1
    status: done
    started: '2026-05-21'
    repos: pennyfarthing
    workflow: tdd
    completed: '2026-05-21'
    type: bug
