  - id: 153-9
    title: Fix test_git_utils.py leaking a feature/test checkout onto the live repo (full pytest suite silently switches the working branch)
    description: "Running the full pytest suite (`pytest pennyfarthing-dist/src/pf/tests/`) silently switches the live working tree onto a stale branch named 'feature/test'. Root cause: test_git_utils.py exercises git_utils.create_or_checkout_branch / create_feature_branches with branch 'feature/test'; despite isolated temp_git_repo / sample_repos (tmp_path) fixtures, a checkout leaks onto the process cwd (the real repo). The leaked branch predates recent work (e.g. loader.py without find_story_in_data), breaking imports and cascading bogus failures across unrelated modules. Discovered during 153-3, where it corrupted the branch mid-implementation twice; full incident account in sprint/archive/153-3-session.md (Dev Incident section). Fix: pin every git operation in the helper to the explicitly-passed repo path (never fall back to cwd), and add a regression test asserting the helper never mutates the outer/live repository's checked-out branch."
    points: 3
    priority: p1
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    acceptance_criteria:
      - Running the full pytest suite leaves the working tree on its original branch — no 'feature/test' (or any) checkout leaks onto the live repo
      - create_or_checkout_branch and create_feature_branches pin all git subprocess calls to the passed repo path; none rely on process cwd
      - A regression test asserts the helper does not change the branch of a repository other than the one explicitly passed in
      - The git_utils tests run hermetically against tmp_path fixtures only, with no side effects on the surrounding repository
    type: bug
