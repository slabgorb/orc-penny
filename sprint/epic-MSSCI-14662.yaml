  - id: "90-2"
    jira: MSSCI-14664
    title: "Implement SM confidence gate file"
    description: |-
      Create a confidence gate file (gates/confidence-sm.md) using the Gate PRD schema. The gate checks whether an instruction to the SM agent is ambiguous (e.g. "continue", "next", "start" without clear target). If ambiguous, <fail> returns clarifying options. If unambiguous, <pass> lets the agent proceed.

      This is the first gate file authored under the Gate Extraction system — validates the schema, runner, and model inheritance in a real workflow context.

      Depends on: Gate subagent runner (FR-2), gate file schema (FR-1).
    points: 2
    priority: P1
    status: planning
    repos: pennyfarthing
