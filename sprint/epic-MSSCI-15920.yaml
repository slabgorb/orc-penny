id: '137'
type: epic
title: Stepped workflow modernization — gates, AskUserQuestion, and collaboration
description: |
  Upgrade the stepped workflow system with five capabilities: (1) research and
  design <switch>/<gate> XML tags for conditional flow and validation, (2) replace
  static [A]/[P]/[C]/[R] text menus with AskUserQuestion tool calls, (3) add
  automatic gate validation to stepped workflow lifecycle, (4) make agent
  initialization workflow-type-aware with step context, and (5) enable tandem
  observer and team collaboration patterns on individual steps.
priority: p1
status: ready
repos: pennyfarthing
jira: MSSCI-15920
stories:
  - id: 137-1
    jira: MSSCI-15921
    title: "Research spike — <switch> and <gate> tag design for stepped workflows"
    description: |
      Audit all stepped workflows for conditional branching patterns (quick-dev
      mode detection, release prerelease_skip_steps, architecture continuation).
      Design <switch> tag spec (on, case, default, next) and enhanced <gate> tag
      spec for stepped context. Prototype both in architecture step-03.
      Rationalize <output> tag contract: every step declares format, target file,
      and required sections. Write ADR documenting decisions.
    points: 1
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-01'
    workflow: trivial
    completed: '2026-03-01'
    type: chore
    review_verdict: approved
  - id: 137-2
    jira: MSSCI-15922
    title: "Replace static collaboration menus with AskUserQuestion"
    description: |
      Update workflow-step-schema to define <collaboration-menu> → AskUserQuestion
      mapping. Add tool="AskUserQuestion" attribute to signal structured choices.
      Migrate all stepped workflow step files (~90 files across architecture,
      release, prd, quick-dev, ux-design, epics-and-stories, sprint-planning,
      guided-tour, installation-check, project-setup, git-cleanup, etc.).
      Update xml-tags.md taxonomy.
    points: 2
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-01'
    workflow: trivial
    completed: '2026-03-02'
    type: feature
    review_verdict: approved
  - id: 137-3
    jira: MSSCI-15923
    title: "Gate validation for stepped workflows"
    description: |
      Create resolve_step_gate() in src/pf/workflow/step_gate.py. Extend
      pf workflow complete-step to call gate validation when step-meta has
      gate: true. Support inline gate criteria from <gate> tag and external
      gate_file references. Add --skip-gate override flag. Create stepped
      gate files for architecture (components, risks) and release (version
      bump, commit). Update gates.md guide and workflow-schema.md.
    points: 3
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-02'
    workflow: tdd
    completed: '2026-03-02'
    type: feature
    review_verdict: approved
  - id: 137-4
    jira: MSSCI-15924
    title: "Workflow-type-aware agent initialization"
    description: |
      Extend detect_workflow_state() in prime/workflow.py to parse stepped
      workflow sessions and return step-aware context (current step, step name,
      total steps, completion status). Add STEPPED_IN_PROGRESS_STATE. Extend
      WorkflowStatus model with optional step fields. Update Prime tier
      selection to include step context for FULL/REFRESH tiers. Update
      loader.py to auto-load current step file content on activation.
      Document stepped activation protocol in agent-behavior.md.
    points: 2
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-03-02'
    workflow: tdd
    completed: '2026-03-02'
    type: feature
    review_findings: '2 HIGH issues: (1) load_step_content() dead code - not wired into tiers.py/cli.py, (2) step_name field never populated. 2 MEDIUM: text output missing step fields, no redirect for STEPPED state. 3 ACs not met.'
    review_verdict: approved
  - id: 137-5
    jira: MSSCI-15925
    title: "Tandem and team collaboration on stepped workflow steps"
    description: |
      Define step-level tandem/team YAML schema in workflow definitions.
      Add <tandem> and <team> XML tags to step-file schema. Create
      get_step_tandem_config() and get_step_team_config() in prime/workflow.py.
      Adapt team_lifecycle.py for step-scoped lifecycle (scope: step).
      Update tandem-protocol.md and team-mode.md guides. Reference
      implementation: tandem PM on architecture step 4, team DevOps on
      architecture step 6.
    points: 2
    priority: p2
