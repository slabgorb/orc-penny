    title: 'Harden get_archive_path: path-traversal containment + sprint_id sanitization + encoding= on archive append (155-3 review deferral)'
    description: 'From 155-3 Reviewer deferred finding (PR pennyfarthing#119): archive_epic.get_archive_path builds sprint-{id}-completed.yaml from raw sprint-YAML metadata (name token via split, or str(number)) with no resolve()/containment check (CWE-22; lang-review python.md #5/#11), and archive.py opens the archive file for append without encoding=. LOW severity — sprint YAML is local self-authored config (no trust boundary) and the downstream archive_file.exists() guard fails loud. Fix CENTRALLY in get_archive_path so both story- and epic-archive callers benefit: add archive_path.resolve() plus a containment assertion under sprint/archive/, restrict sprint_id to word/dot/dash characters, and pass encoding=utf-8 to the append open().'
