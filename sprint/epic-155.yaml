    description: "From 155-4 Reviewer deferred findings (LOW, PR pennyfarthing#126). 155-4 tests hit only the _add_story_to_completed seam. Gaps: (1) the step-4b de-swallow in finish_story (the other half of the bug) is uncovered; (2) the jira-keyed-epic priority branch uncovered; (3) the standalone-story explicit-fallback uncovered; (4) the except ValueError branch (story_finish.py:112-118) uncovered. Also: (5) vacuous assertion at test_155_4_finish_archive_epic_field.py:177 ('assert ghost is None or ...strip()') accepts a fabricated non-empty epic on the raise-path — tighten to 'assert ghost is None'. And (6, finding 4) story_finish.py:464 step-4b read_sprint is unwrapped — an unexpected I/O error there now crashes finish AFTER merge/transition (steps 4c-7 skipped); add a graceful-degrade guard (near-nil window since read succeeded earlier same run, but defensible). Note finding 5 (non-blocking, accepted): 4b {success:False} prints but top-level finish exit code stays 0 — invisible to non-interactive $? callers; acceptable per documented non-fatal intent, revisit only if finish gains hard-fail semantics."
