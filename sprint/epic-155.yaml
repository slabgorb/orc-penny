    workflow: tdd
  - id: 155-8
    title: Delegate epic-ref resolution to canonical _get_epic_ref (155-4 review deferral)
    description: "From 155-4 Reviewer deferred finding (MEDIUM, PR pennyfarthing#126): _resolve_epic_ref (story_finish.py:59) and backfill_epic_refs (archive_epic.py:330) both reimplement 'str(epic.get(\"jira\") or epic.get(\"id\"))' instead of delegating to the canonical _get_epic_ref (yaml_io.py:312). The local formula diverges for sentinel-jira epics and 'epic-'-prefixed no-jira epics → could write epic:'epic-94' → orphan misgrouping + epic-epic-94.yaml double-prefix (the ADR-0022 trap). Latent only today: every live epic has a real PROJ-* jira so all three resolvers currently agree. Fix: delegate both call sites to _get_epic_ref so there is one canonical epic-ref formula. AC: both resolvers call _get_epic_ref; regression test pins sentinel-jira and epic-prefixed-no-jira epics resolve identically across all three paths."
    points: 2
