# =============================================================================
# SUMMARY STATISTICS
# =============================================================================
statistics:
  average_score_gains:
    one_swap: 5.8
    two_swaps: 12.9
    three_swaps: 12.5
    four_swaps: 25.0

  roles_most_often_swapped:
    - role: dev
      count: 27
      notes: "Dev role shows most character differentiation"
    - role: tea
      count: 18
      notes: "Testing requires specific character traits"
    - role: sm
      count: 15
      notes: "Leadership varies significantly by character"
    - role: reviewer
      count: 12
      notes: "Most characters perform well at review"

  characters_frequently_recommended:
    - pattern: "Analytical/logical characters excel at dev (Spock, Manhattan, Gandalf)"
    - pattern: "Ruthless/adversarial characters excel at reviewer (Palpatine, Chuck McGill)"
    - pattern: "Human-centered characters excel at tea (Laurie, Will Graham)"
    - pattern: "Natural leaders with patience excel at sm (Morpheus, Coach Beard)"

  key_insights:
    - "Dev role has lowest average scores and most variance across themes"
    - "SM role has highest average scores, suggesting easier scenarios"
    - "Native role assignments are optimal in only ~17% of themes"
    - "Character traits matter more than source role assignments"
    - "Multi-talented characters (Westley, Hari Seldon, Manhattan) dominate multiple roles"

# =============================================================================
# NOTES ON METHODOLOGY
# =============================================================================
methodology:
  data_sources:
    - 93 job-fair summary files from internal/results/job-fair/*/summary.yaml
    - 92 theme definition files from pennyfarthing-dist/personas/themes/*.yaml

  matching_approach:
    - Character names in summaries use slugified format (lowercase, underscores)
    - Theme files use proper names with mixed case
    - Matching done by converting both to comparable format

  score_interpretation:
    - Scores range from 0-100 based on rubric evaluation
    - Zero scores indicate failed runs, not true zeros
    - Score gains calculated as (recommended - current)

  limitations:
    - Some themes have incomplete data due to failed runs
    - Single-pass results have higher variance than multi-pass
    - Character-scenario interactions may vary

recommendations_for_implementation:
  - "Review each swap recommendation against character personality fit"
  - "Consider ties carefully - all tied characters are acceptable choices"
  - "Re-run failed scenarios before making changes to incomplete themes"
  - "Use theme comments like '# JOB FAIR OPTIMIZED' to document changes"
