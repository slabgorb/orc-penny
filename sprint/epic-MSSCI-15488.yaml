    review_verdict: approved
  - id: 126-9
    jira: MSSCI-15497
    title: Remove Node init.ts, npx entry point, postinstall.cjs
    description: |-
      Remove all Node-based installation artifacts that are replaced by
      Python-first approach. Clean up package.json bin entries. Remove
      setup-detector.js and session-start.js.

      AC:
      - init.ts removed
      - npx pennyfarthing entry point removed from package.json bin
      - postinstall.cjs removed
      - setup-detector.js removed
      - session-start.js removed (functionality in Python)
      - No Node-based init code remains
    points: 2
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-24'
    repos: pennyfarthing
    workflow: trivial
    completed: '2026-02-24'
    type: chore
    review_verdict: approved
  - id: 126-10
    jira: MSSCI-15498
    title: E2E tests — fresh install, upgrade from npm, pf init --dry-run
    description: |-
      End-to-end test suite covering the full installation lifecycle.
      Fresh install from PyPI, upgrade from npm-based install, dry-run
      verification, idempotency check.

      AC:
      - E2E test: fresh pip install pf + pf init on empty project
      - E2E test: pf upgrade from npm-based v11 install
      - E2E test: pf init --dry-run shows correct plan
      - E2E test: pf init is idempotent (run twice, same result)
      - Tests run in CI with isolated environments
    points: 5
    status: backlog
    repos: pennyfarthing
    workflow: tdd
    type: feature
  - id: 126-11
    jira: MSSCI-15599
    title: Update stale pennyfarthing init references to pf setup
    description: '~30 string references to pennyfarthing init and npx pennyfarthing remain after init.ts removal in 126-9. Users hitting these error paths are told to run a command that no longer exists. Locations: skill.ts (5), command.ts (5), theme.ts (2), version.ts, doctor.ts, uninstall.ts, files.ts, pf-help.md, pf-setup.md, hooks.md, templates, workflows, scripts, hooks_installer.py, upgrade/core.py. ACs: All pennyfarthing init refs updated to pf setup. All npx pennyfarthing refs updated to pf. No user-facing message references a nonexistent command.'
    points: 2
    priority: p1
    status: done
    workflow: trivial
    type: chore
  - id: 126-12
    jira: MSSCI-15600
    title: Wire setup auto-detection into session-start hook
    description: Session-start hook should detect incomplete setup (pf init ran but /pf-setup did not) and inject additionalContext telling Claude to run /pf-setup. Replaces the removed setup-detector.js. Without this, users who run pf init but miss the setup prompt get a half-configured installation with no nudge to complete it.
    points: 3
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-24'
    workflow: tdd
    acceptance_criteria:
      - session_start.py checks for .pennyfarthing/ present but config.local.yaml missing theme key
      - When incomplete setup detected, hook returns additionalContext with setup instructions
      - When setup is complete, hook is a no-op (no performance penalty on every session)
      - 'Detection also covers: repos.yaml missing, settings.local.json missing'
      - Unit tests for detection logic and additionalContext output
    completed: '2026-02-24'
    type: chore
    review_verdict: approved
  - id: 126-13
    jira: MSSCI-15601
    title: Extract shared hook constants and fix onboarding rough edges
    description: "Housekeeping debt from party-mode review. Three issues in one story: (1) _MINIMAL_SETTINGS in init/core.py and _PYTHON_HOOKS in upgrade/core.py define the same 5 hooks independently — extract to shared constant. (2) verify_pf_cli() install_hint says 'pipx install -e pennyfarthing-dist/' (dev path) instead of 'pip install pennyfarthing-scripts' (user path). (3) Dead code: run_auto_setup() in setup.py is never called — remove or wire up. (4) _copy_tree() does rmtree before copytree, nuking user files in skill dirs — add pre-flight check."
    points: 2
    priority: p1
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-24'
    workflow: trivial
    acceptance_criteria:
      - Single _INFRASTRUCTURE_HOOKS constant imported by both init/core.py and upgrade/core.py
      - verify_pf_cli() install_hint shows user-facing pip install command
      - run_auto_setup() either removed or wired to a code path
      - _copy_tree() preserves non-pf user files or warns before overwriting
      - Existing tests still pass after refactor
    completed: '2026-02-24'
    type: chore
    review_verdict: approved
  - id: 126-14
    jira: MSSCI-15602
    title: pf upgrade cleanup — remove npm artifacts and stale symlinks
    description: "pf upgrade detects node_modules/@pennyfarthing but doesn't clean up npm-era artifacts. After migration, users are left with: (1) node_modules/@pennyfarthing still present, (2) old Node commands/symlinks in .claude/commands that reference npx pennyfarthing, (3) stale .pennyfarthing/manifest.json (Node-era) alongside new init-manifest.json. Upgrade should offer to remove these artifacts (with user confirmation) and produce a clean post-migration state."
    points: 2
    priority: p2
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-24'
    workflow: trivial
    acceptance_criteria:
      - pf upgrade --clean offers to remove node_modules/@pennyfarthing directory
      - Stale symlinks in .claude/commands/ pointing to node_modules are detected and removed
      - Old manifest.json (Node-era) removed after migration to init-manifest.json
      - All cleanup requires user confirmation (or --yes flag for CI)
      - Dry-run shows what would be cleaned without acting
    completed: '2026-02-24'
    type: chore
    review_verdict: approved
  - id: 126-15
    jira: MSSCI-15603
    title: Pull LFS portraits during pf init/setup so TUI portraits work out of the box
    description: |-
      Portrait files are stored in Git LFS. After pf init or pf-setup, the portrait files remain as LFS pointers (ASCII text) instead of actual PNGs. The BikeRack TUI persona bar shows no portrait because the images aren't real files.

      MSSCI-15501 added auto-pull on theme set, but that only covers pf theme set. New installs that run pf init followed by pf-setup need LFS portraits pulled as part of the setup flow so the TUI works immediately without manual git lfs pull.
    points: 2
    priority: p2
    status: done
    assigned_to: keith.avery@1898andco.io
    started: '2026-02-24'
    workflow: trivial
    acceptance_criteria:
      - pf init or pf-setup runs git lfs pull for the selected theme's portraits
      - Only pulls portraits for the active theme (not all themes)
      - Graceful degradation if git-lfs is not installed (warn, don't fail)
      - Works for both fresh installs and upgrades
    completed: '2026-02-24'
    session_file: .session/126-15-session.md
    branch: feat/126-15-lfs-portrait-pull
    review_verdict: approved
